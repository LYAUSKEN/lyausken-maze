function hexRGB(h){h=h.replace('#','');var n=parseInt(h,16);return [(n>>16)&255,(n>>8)&255,n&255];}
function ink(a){return 'rgba('+INKRGB[0]+','+INKRGB[1]+','+INKRGB[2]+','+a+')';}
function rgba(hex,a){var c=hexRGB(hex);return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')';}
function shade(hex,f){                 // f>0で明るく、f<0で暗く
  var c=hexRGB(hex),o='#';
  for(var i=0;i<3;i++){
    var v=f>=0 ? c[i]+(255-c[i])*f : c[i]*(1+f);
    v=Math.max(0,Math.min(255,Math.round(v)));
    o+=('0'+v.toString(16)).slice(-2);
  }
  return o;
}

/* ステージの曲。回を追うごとに ユーロビート → ブラックミュージック → テクノロック と変わる */
var idolRetry=0;
function idolMusic(){
  if(musicOn)return;
  if(!audioInit())return;
  if(ac.state!=='running'){
    try{
      var pr=ac.resume();
      if(pr&&pr.then)pr.then(function(){if(state==='idol')idolMusic();});
    }catch(e){}
    if(idolRetry++<50) setTimeout(function(){if(state==='idol')idolMusic();},100);
    return;
  }
  idolRetry=0;
  musicStop();
  try{
    var t0=ac.currentTime+0.05;
    musicGain=ac.createGain();musicGain.gain.value=1;musicGain.connect(mg);musicOn=true;
    if(state==='idol')musicT=now;
    var nlen=Math.floor(ac.sampleRate*0.25),nbuf=ac.createBuffer(1,nlen,ac.sampleRate),nd=nbuf.getChannelData(0);
    for(var q=0;q<nlen;q++)nd[q]=Math.random()*2-1;
    var V={
      noise:function(st,dur,vol,hz,type,Q){
        var src=ac.createBufferSource();src.buffer=nbuf;
        var f=ac.createBiquadFilter();f.type=type||'highpass';f.frequency.value=hz;
        if(Q)f.Q.value=Q;
        var g=ac.createGain();
        g.gain.setValueAtTime(vol,t0+st);
        g.gain.exponentialRampToValueAtTime(0.0001,t0+st+dur);
        src.connect(f);f.connect(g);g.connect(musicGain);
        src.start(t0+st);src.stop(t0+st+dur+0.02);
      },
      tone:function(type,f,st,dur,vol,f2){
        if(!f)return;
        var o=ac.createOscillator(),g=ac.createGain();
        o.type=type;o.frequency.setValueAtTime(f,t0+st);
        if(f2)o.frequency.exponentialRampToValueAtTime(f2,t0+st+dur);
        g.gain.setValueAtTime(0.0001,t0+st);
        g.gain.exponentialRampToValueAtTime(vol,t0+st+0.008);
        g.gain.exponentialRampToValueAtTime(0.0001,t0+st+dur);
        o.connect(g);g.connect(musicGain);
        o.start(t0+st);o.stop(t0+st+dur+0.02);
      },
      pad:function(type,f,st,dur,vol){
        var o=ac.createOscillator(),g=ac.createGain();
        o.type=type;o.frequency.setValueAtTime(f,t0+st);
        g.gain.setValueAtTime(0.0001,t0+st);
        g.gain.exponentialRampToValueAtTime(vol,t0+st+0.06);
        g.gain.setValueAtTime(vol,t0+st+dur*0.40);
        g.gain.exponentialRampToValueAtTime(0.0001,t0+st+dur);
        o.connect(g);g.connect(musicGain);
        o.start(t0+st);o.stop(t0+st+dur+0.05);
      }
    };
    var kind=idolShow%3;
    if(kind===1)grooveTrack(V);
    else if(kind===2)technoTrack(V);
    else euroTrack(V);
  }catch(e){}
}
/* 1曲目：ユーロビート（BPM156・イ短調） */
function euroTrack(V){
  var BPM=156,B=60/BPM,S16=B/4;
  var roots=[110.00,87.31,98.00,110.00,110.00,87.31,98.00,82.41];
  var third=[130.81,110.00,123.47,130.81,130.81,110.00,123.47,103.83];
  var fifth=[164.81,130.81,146.83,164.81,164.81,130.81,146.83,123.47];
  var A=[440.00,493.88,523.25,587.33,659.25,698.46,783.99,880.00];
  var hook=[4,4,2,4,6,6,4,-1, 5,4,2,0,2,2,-1,-1];
  var bars=8,i2,b2;
  for(b2=0;b2<bars;b2++){
    var bt0=b2*4*B;
    for(i2=0;i2<4;i2++){
      V.tone('sine',150,bt0+i2*B,0.13,0.34,48);
      V.noise(bt0+i2*B,0.05,0.10,120,'lowpass');
    }
    for(i2=0;i2<8;i2++) V.noise(bt0+i2*B/2+B/4,0.035,(i2%2)?0.05:0.035,7000);
    for(i2=0;i2<8;i2++){
      var st=bt0+i2*B/2;
      V.tone('sawtooth',roots[b2],st,B*0.30,0.13);
      if(i2%2===1) V.tone('sawtooth',roots[b2]*2,st+B*0.25,B*0.16,0.07);
    }
    var arp=[roots[b2]*2,third[b2]*2,fifth[b2]*2,roots[b2]*4];
    var arpN=(b2===bars-1)?12:16;
    for(i2=0;i2<arpN;i2++) V.tone('square',arp[i2%4],bt0+i2*S16,S16*0.85,0.035);
    if(b2===bars-1) for(i2=12;i2<16;i2++) V.noise(bt0+i2*S16,0.07,0.09+(i2-12)*0.02,2500);
    if(b2>=2){
      for(i2=0;i2<16;i2++){
        var hn=hook[i2];
        if(hn>=0){
          var f0=A[hn]*(b2>=6?2:1);
          V.tone('square',f0,bt0+i2*S16,S16*1.6,0.075);
          V.tone('triangle',f0/2,bt0+i2*S16,S16*1.4,0.035);
        }
      }
    }
    if(b2%4===0) V.noise(bt0,0.5,0.09,4000);
  }
  var endT=bars*4*B,ED=2.6;
  V.pad('sawtooth',110.00,endT,ED,0.10);
  V.pad('sawtooth',164.81,endT,ED,0.07);
  V.pad('square', 261.63,endT,ED,0.055);
  V.pad('square', 440.00,endT,ED,0.075);
  V.pad('triangle',880.00,endT,ED*0.8,0.05);
  V.tone('sine',150,endT,0.22,0.34,48);
  V.noise(endT,1.9,0.11,3000);
  V.noise(endT,0.9,0.05,300,'lowpass');
}
/* 2曲目：ブラックミュージック風のグルーヴ（BPM104・跳ねる16分） */
function grooveTrack(V){
  var BPM=104,B=60/BPM,S16=B/4,SW=S16*0.22;   // SW=はねる分のずれ
  function sw(i){return i*S16+((i%2)?SW:0);}  // 裏の16分を後ろへ
  var bars=6,i2,b2;
  /* Dm7 - G7 - Cmaj7 - A7 の循環 */
  var bassPat=[
    [0,3,5,7,10,7,5,3],   // 度数（半音）
    [0,3,5,7,10,7,5,3],
    [0,4,7,10,7,4,0,-2],
    [0,3,7,10,7,3,0,-2]
  ];
  var rootHz=[73.42,98.00,65.41,110.00];       // D2 G2 C2 A2
  var chord=[[293.66,349.23,440.00],[293.66,349.23,392.00],
             [329.63,392.00,493.88],[277.18,329.63,440.00]];
  var mel=[[7,5,3,0,-2,0,3,5],[10,7,5,3,5,7,10,12]];
  for(b2=0;b2<bars;b2++){
    var bt0=b2*4*B,ci=b2%4;
    /* ドラム：1と2裏にキック、2と4にスネア、16分のハイハット */
    V.tone('sine',140,bt0,0.16,0.32,45);
    V.tone('sine',140,bt0+B*1.75,0.14,0.26,45);
    V.tone('sine',140,bt0+B*2.5,0.12,0.20,45);
    V.noise(bt0+B,0.16,0.16,1400,'bandpass',1.2);
    V.noise(bt0+B*3,0.16,0.16,1400,'bandpass',1.2);
    for(i2=0;i2<16;i2++)
      V.noise(bt0+sw(i2),0.03,(i2%4===0)?0.055:((i2%2)?0.022:0.038),8000);
    /* うねるベース */
    for(i2=0;i2<8;i2++){
      var d=bassPat[ci][i2];
      if(d<-10)continue;
      V.tone('triangle',rootHz[ci]*Math.pow(2,d/12),bt0+sw(i2*2),B*0.42,0.16);
    }
    /* 裏拍のクラビ風の刻み */
    for(i2=0;i2<8;i2++){
      if(i2%2===0)continue;
      chord[ci].forEach(function(f){
        V.tone('square',f,bt0+sw(i2*2),B*0.16,0.035);
      });
    }
    /* 歌うようなメロディ */
    if(b2>=2){
      var mp=mel[(b2-2)%2];
      for(i2=0;i2<8;i2++){
        var dm=mp[i2];
        if(dm<-10)continue;
        V.tone('sawtooth',rootHz[ci]*4*Math.pow(2,dm/12),bt0+sw(i2*2),B*0.44,0.055);
      }
    }
    if(b2%4===0)V.noise(bt0,0.6,0.07,3500);
  }
  var endT=bars*4*B,ED=2.8;
  V.pad('triangle',73.42,endT,ED,0.13);
  V.pad('square',293.66,endT,ED,0.05);
  V.pad('square',349.23,endT,ED,0.05);
  V.pad('sawtooth',440.00,endT,ED,0.05);
  V.tone('sine',140,endT,0.24,0.30,45);
  V.noise(endT,2.0,0.09,3000);
}
/* 3曲目：テクノ寄りのロック（BPM142・重い刻み） */
function technoTrack(V){
  var BPM=142,B=60/BPM,S16=B/4;
  var bars=8,i2,b2;
  var power=[82.41,82.41,110.00,98.00,82.41,87.31,110.00,98.00];   // E A G F
  var lead=[659.25,587.33,493.88,587.33,659.25,783.99,659.25,587.33];
  for(b2=0;b2<bars;b2++){
    var bt0=b2*4*B,rt=power[b2];
    for(i2=0;i2<4;i2++){
      V.tone('sine',160,bt0+i2*B,0.14,0.36,42);
      V.noise(bt0+i2*B,0.045,0.10,150,'lowpass');
    }
    V.noise(bt0+B,0.18,0.17,1800,'bandpass',1.1);
    V.noise(bt0+B*3,0.18,0.17,1800,'bandpass',1.1);
    for(i2=0;i2<16;i2++) V.noise(bt0+i2*S16,0.028,(i2%4===2)?0.05:0.028,9000);
    /* 歪んだパワーコードの刻み */
    for(i2=0;i2<8;i2++){
      var st=bt0+i2*B/2;
      if(b2===3&&i2>=4)continue;                 // ブレイク
      V.tone('sawtooth',rt,st,B*0.34,0.15);
      V.tone('sawtooth',rt*1.4983,st,B*0.34,0.10);  // 5度
      V.tone('square',rt*2,st,B*0.30,0.05);
    }
    /* 上昇するシーケンス */
    for(i2=0;i2<16;i2++)
      V.tone('square',rt*4*Math.pow(2,((i2%4)*2)/12),bt0+i2*S16,S16*0.8,0.028);
    /* リード */
    if(b2>=4) V.tone('sawtooth',lead[b2],bt0,B*1.6,0.08);
    if(b2===3) for(i2=0;i2<8;i2++) V.noise(bt0+B*2+i2*S16,0.06,0.05+i2*0.012,2500);
    if(b2%4===0) V.noise(bt0,0.55,0.10,4000);
  }
  var endT=bars*4*B,ED=2.7;
  V.pad('sawtooth',82.41,endT,ED,0.13);
  V.pad('sawtooth',123.47,endT,ED,0.09);
  V.pad('square',329.63,endT,ED,0.06);
  V.pad('square',659.25,endT,ED*0.75,0.05);
  V.tone('sine',160,endT,0.26,0.34,42);
  V.noise(endT,2.1,0.12,3200);
  V.noise(endT,1.0,0.06,300,'lowpass');
}

/* ---- 日本語は小さく描いて拡大し、ドット感を出す ---- */
/* stretch=縦の伸ばし率（1.3で130%長体）／中間調は捨てて全ドット100%にする */
function pixelCanvas(txt,color,stretch){
  stretch=stretch||1;
  var key=txt+'|'+color+'|'+stretch;
  if(pxCache[key])return pxCache[key];
  var base=12,t=document.createElement('canvas'),tc=t.getContext('2d');
  var font='700 '+base+'px "Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif';
  tc.font=font;
  var w=Math.ceil(tc.measureText(txt).width)+2;
  t.width=Math.max(1,w);
  t.height=Math.ceil(base*stretch)+5;
  tc=t.getContext('2d');
  tc.setTransform(1,0,0,stretch,0,0);
  tc.font=font;tc.textBaseline='top';tc.fillStyle=color;
  tc.fillText(txt,1,1);
  tc.setTransform(1,0,0,1,0,0);
  if(color.charAt(0)==='#'){
    try{
      var im=tc.getImageData(0,0,t.width,t.height),d=im.data,rgb=hexRGB(color);
      for(var i=0;i<d.length;i+=4){
        if(d[i+3]>=100){d[i]=rgb[0];d[i+1]=rgb[1];d[i+2]=rgb[2];d[i+3]=255;}
        else d[i+3]=0;
      }
      tc.putImageData(im,0,0);
    }catch(e){}
  }
  pxCache[key]=t;
  return t;
}
function pixelText(txt,x,y,scale,align,color,stretch){
  try{
    var c=pixelCanvas(txt,color,stretch);
    var dw=c.width*scale,dh=c.height*scale,dx=x;
    if(align==='center')dx=x-dw/2;else if(align==='right')dx=x-dw;
    ctx.imageSmoothingEnabled=false;
    ctx.webkitImageSmoothingEnabled=false;
    ctx.mozImageSmoothingEnabled=false;
    ctx.drawImage(c,0,0,c.width,c.height,Math.round(dx),Math.round(y),dw,dh);
    ctx.imageSmoothingEnabled=true;
  }catch(e){
    ctx.fillStyle=color;ctx.textAlign=align||'left';
    ctx.font='700 '+(scale*12)+'px sans-serif';
    ctx.fillText(txt,x,y+scale*12);
  }
}

/* ================= 迷路 ================= */
function blank(){
  grid=[];
  for(var r=0;r<ROWS;r++){var row=[];
    for(var c=0;c<COLS;c++) row.push({n:1,e:1,s:1,w:1,v:inBed(r,c)?1:0});
    grid.push(row);}
}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=(Math.random()*(i+1))|0,t=a[i];a[i]=a[j];a[j]=t;}return a;}
function carve(stack){
  var guard=0;
  while(stack.length&&guard++<200000){
    var t=stack[stack.length-1],cr=t[0],cc=t[1],nb=[];
    if(cr>0&&!grid[cr-1][cc].v)      nb.push([cr-1,cc,'n','s']);
    if(cr<ROWS-1&&!grid[cr+1][cc].v) nb.push([cr+1,cc,'s','n']);
    if(cc>0&&!grid[cr][cc-1].v)      nb.push([cr,cc-1,'w','e']);
    if(cc<COLS-1&&!grid[cr][cc+1].v) nb.push([cr,cc+1,'e','w']);
    if(!nb.length){stack.pop();continue;}
    var p=nb[(Math.random()*nb.length)|0];
    grid[cr][cc][p[2]]=0;grid[p[0]][p[1]][p[3]]=0;grid[p[0]][p[1]].v=1;
    stack.push([p[0],p[1]]);
  }
}
function genMaze(){
  blank();
  var sr=(Math.random()*ROWS)|0, sc=(Math.random()*COLS)|0,sg=0;
  while(inBed(sr,sc)&&sg++<600){sr=(Math.random()*ROWS)|0;sc=(Math.random()*COLS)|0;}
  grid[sr][sc].v=1;
  carve([[sr,sc]]);
  repair(sr,sc);
  sealBed();
  if(stage<FREE_FROM){
    start={r:ROWS-1,c:(COLS/2)|0};
    goal ={r:0,     c:(COLS/2)|0};
  }else{
    start={r:(Math.random()*ROWS)|0,c:(Math.random()*COLS)|0};
    var sg2=0;
    while(inBed(start.r,start.c)&&sg2++<600) start={r:(Math.random()*ROWS)|0,c:(Math.random()*COLS)|0};
    goal=farFrom(start.r,start.c,0.8,null);
  }
}
/* 掘り直しで孤立したマスが出たら、必ず通路をつなぎ直す */
function repair(sr,sc){
  var guard=0;
  while(guard++<60){
    var d=bfs(sr,sc),bad=[],r,c;
    for(r=0;r<ROWS;r++)for(c=0;c<COLS;c++) if(d[r][c]<0&&!inBed(r,c)) bad.push([r,c]);
    if(!bad.length) return;
    var opened=false;
    for(var i=0;i<bad.length;i++){
      var r0=bad[i][0],c0=bad[i][1],opts=[];
      if(r0>0&&d[r0-1][c0]>=0&&!inBed(r0-1,c0)) opts.push('n');
      if(r0<ROWS-1&&d[r0+1][c0]>=0&&!inBed(r0+1,c0)) opts.push('s');
      if(c0>0&&d[r0][c0-1]>=0&&!inBed(r0,c0-1)) opts.push('w');
      if(c0<COLS-1&&d[r0][c0+1]>=0&&!inBed(r0,c0+1)) opts.push('e');
      if(!opts.length) continue;
      var k=opts[(Math.random()*opts.length)|0],v=DIRS[k];
      grid[r0][c0][k]=0;grid[r0+v.dr][c0+v.dc][OPP[k]]=0;opened=true;
    }
    if(!opened) return;
  }
}
function bfs(sr,sc){
  var d=[],r,c;
  for(r=0;r<ROWS;r++){d.push([]);for(c=0;c<COLS;c++)d[r].push(-1);}
  var q=[[sr,sc]];d[sr][sc]=0;
  for(var i=0;i<q.length;i++){
    var r0=q[i][0],c0=q[i][1],g=grid[r0][c0],v=d[r0][c0];
    if(!g.n&&r0>0&&d[r0-1][c0]<0){d[r0-1][c0]=v+1;q.push([r0-1,c0]);}
    if(!g.s&&r0<ROWS-1&&d[r0+1][c0]<0){d[r0+1][c0]=v+1;q.push([r0+1,c0]);}
    if(!g.w&&c0>0&&d[r0][c0-1]<0){d[r0][c0-1]=v+1;q.push([r0,c0-1]);}
    if(!g.e&&c0<COLS-1&&d[r0][c0+1]<0){d[r0][c0+1]=v+1;q.push([r0,c0+1]);}
  }
  return d;
}
function farFrom(sr,sc,ratio,avoid){
  var d=bfs(sr,sc),mx=0,r,c;
  for(r=0;r<ROWS;r++)for(c=0;c<COLS;c++) if(d[r][c]>mx) mx=d[r][c];
  var far=[];
  for(r=0;r<ROWS;r++)for(c=0;c<COLS;c++){
    if(d[r][c]<mx*ratio) continue;
    if(avoid&&avoid[r+','+c]) continue;
    far.push({r:r,c:c});
  }
  if(!far.length) far.push({r:sr,c:sc});
  return far[(Math.random()*far.length)|0];
}

/* ---- 迷路の変形：壁を数枚だけ入れ替える ---- */
function ekey(a,b){
  if(a.r===b.r) return a.r+','+Math.max(a.c,b.c)+',w';
  return Math.max(a.r,b.r)+','+a.c+',n';
}
function edgeKey(e){return e.r+','+e.c+','+e.d;}
function setEdge(e,closed){
  var v=closed?1:0;
  if(e.d==='n'){grid[e.r][e.c].n=v;grid[e.r-1][e.c].s=v;}
  else{grid[e.r][e.c].w=v;grid[e.r][e.c-1].e=v;}
}
function edgeLine(e){
  var x=ox+e.c*cell,y=oy+e.r*cell;
  if(e.d==='n') return {x1:x,y1:y,x2:x+cell,y2:y};
  return {x1:x,y1:y,x2:x,y2:y+cell};
}
function allConnected(){
  var d=bfs(pc.r,pc.c),n=0;
  for(var r=0;r<ROWS;r++)for(var c=0;c<COLS;c++) if(d[r][c]>=0)n++;
  return n===ROWS*COLS-bedCount();
}
function reshape(){
  var prot={},i,r,c;
  var from=amoebaOn?Math.floor(amoeba):0,prev=null;
  for(i=Math.max(0,from);i<dots.length;i++){
    var q=cellAt(dots[i].x,dots[i].y);
    if(q.r<0||q.r>=ROWS||q.c<0||q.c>=COLS){prev=null;continue;}
    if(prev&&Math.abs(prev.r-q.r)+Math.abs(prev.c-q.c)===1) prot[ekey(prev,q)]=1;
    prev=q;
  }
  if(dir) prot[ekey(pc,nb(pc,dir))]=1;
  if(aPath&&aMode!=='trail') for(i=0;i+1<aPath.length;i++) prot[ekey(aPath[i],aPath[i+1])]=1;

  var closed=[],opened=[];
  for(r=0;r<ROWS;r++)for(c=0;c<COLS;c++){
    if(r>0&&!inBed(r,c)&&!inBed(r-1,c))(grid[r][c].n?closed:opened).push({r:r,c:c,d:'n'});
    if(c>0&&!inBed(r,c)&&!inBed(r,c-1))(grid[r][c].w?closed:opened).push({r:r,c:c,d:'w'});
  }
  shuffle(closed);shuffle(opened);
  var rem=closed.slice(0,SHIFT_EDGES);
  for(i=0;i<rem.length;i++) setEdge(rem[i],false);
  var add=[];
  for(i=0;i<opened.length&&add.length<SHIFT_EDGES;i++){
    var e=opened[i];
    if(prot[edgeKey(e)])continue;
    setEdge(e,true);
    if(allConnected()) add.push(e); else setEdge(e,false);
  }
  pendGoal=farFrom(pc.r,pc.c,0.65,null);
  for(i=0;i<add.length;i++) setEdge(add[i],false);   // いったん元に戻して演出へ
  for(i=0;i<rem.length;i++) setEdge(rem[i],true);
  animRem=rem;animAdd=add;animSkip={};
  for(i=0;i<rem.length;i++) animSkip[edgeKey(rem[i])]=1;
  for(i=0;i<add.length;i++) animSkip[edgeKey(add[i])]=1;
  shiftApplied=false;shiftCrashed=false;shiftT=now;state='shift';
  beep(300,0.18,0.05,'triangle');
}
function applyShift(){
  var i;
  for(i=0;i<animRem.length;i++) setEdge(animRem[i],false);
  for(i=0;i<animAdd.length;i++) setEdge(animAdd[i],true);
  if(pendGoal) goal=pendGoal;
  for(i=blockers.length-1;i>=0;i--)
    if(blockers[i].mode==='idle'&&blockers[i].r===goal.r&&blockers[i].c===goal.c) blockers.splice(i,1);
  for(i=0;i<blockers.length;i++){
    var b=blockers[i];
    if(b.mode==='wander'&&(!b.wdir||!open({r:b.r,c:b.c},b.wdir))){b.prog=0;b.wdir=null;pickWander(b);}
    if(b.mode!=='go')continue;
    var np=(b.target&&lures.indexOf(b.target)>=0)?pathTo({r:b.r,c:b.c},{r:b.target.r,c:b.target.c}):null;
    if(np&&np.length){b.path=np;b.pi=0;b.prog=0;} else stopBlocker(b);
  }
  shiftApplied=true;
  birthSfx();
}

function ctr(r,c){return {x:ox+c*cell+cell/2,y:oy+r*cell+cell/2};}
function cellAt(x,y){return {r:Math.floor((y-oy)/cell),c:Math.floor((x-ox)/cell)};}
function open(p,d){
  if(!d)return false;
  var g=grid[p.r][p.c];
  if(g[d])return false;
  var v=DIRS[d],nr=p.r+v.dr,nc=p.c+v.dc;
  return nr>=0&&nr<ROWS&&nc>=0&&nc<COLS;
}
function nb(p,d){var v=DIRS[d];return {r:p.r+v.dr,c:p.c+v.dc};}

/* ================= 待ち伏せアメーバ ================= */
function placeBlockers(){
  blockers=[];
  if(stage<BLOCK_FROM) return;
  var n=Math.min(6,stage-BLOCK_FROM+2);
  var d=bfs(pc.r,pc.c),cand=[],r,c;
  for(r=0;r<ROWS;r++)for(c=0;c<COLS;c++){
    if(d[r][c]<3) continue;
    if(isUsed(r,c)) continue;
    cand.push({r:r,c:c});
  }
  shuffle(cand);
  for(var i=0;i<n&&i<cand.length;i++){
    blockers.push({r:cand[i].r,c:cand[i].c,ph:Math.random()*9000,per:6200+Math.random()*3000,op:2600,
                   mode:'idle',path:null,pi:0,prog:0,target:null,look:0,eatT:0,wdir:null});
    markUsed(cand[i].r,cand[i].c);
  }
}
function blockerPos(b){
  if(b.mode==='wander'){
    var a0=ctr(b.r,b.c);
    if(!b.wdir)return a0;
    var n0=nb({r:b.r,c:b.c},b.wdir),q0=ctr(n0.r,n0.c);
    return {x:a0.x+(q0.x-a0.x)*b.prog,y:a0.y+(q0.y-a0.y)*b.prog};
  }
  if(b.mode!=='go'||!b.path||!b.path.length) return ctr(b.r,b.c);
  var i=Math.min(b.pi,b.path.length-1),a=ctr(b.path[i].r,b.path[i].c);
  if(i<b.path.length-1){
    var q=ctr(b.path[i+1].r,b.path[i+1].c);
    return {x:a.x+(q.x-a.x)*b.prog,y:a.y+(q.y-a.y)*b.prog};
  }
  return a;
}
function pickWander(b){
  var opts=[],back=b.wdir?OPP[b.wdir]:null,k;
  for(k in DIRS) if(open({r:b.r,c:b.c},k)&&k!==back) opts.push(k);
  if(!opts.length) for(k in DIRS) if(open({r:b.r,c:b.c},k)) opts.push(k);
  b.wdir=opts.length?opts[(Math.random()*opts.length)|0]:null;
}
function stopBlocker(b){
  if(b.mode==='go'&&b.path&&b.path.length){
    var idx=(b.prog>0.5)?Math.min(b.pi+1,b.path.length-1):Math.min(b.pi,b.path.length-1);
    b.r=b.path[idx].r;b.c=b.path[idx].c;
  }
  b.mode='idle';b.path=null;b.pi=0;b.prog=0;b.target=null;
  b.ph=Math.random()*b.per;b.look=now;
}
/* 誰かが食べた時点で、同じ餌を狙っていた個体は動きを止める */
function onLureTaken(L,eater){
  for(var i=0;i<blockers.length;i++){
    var b=blockers[i];
    if(b!==eater&&b.target===L&&b.mode==='go') stopBlocker(b);
  }
  if(eater&&aMode==='go'&&aTarget===L){aTarget=null;startBack();}
}
function nearestLure(r,c,range){
  if(!lures.length)return null;
  var d=bfs(r,c),best=null,bd=1e9;
  for(var i=0;i<lures.length;i++){
    var L=lures[i];
    if(L.eat)continue;
    var v=d[L.r][L.c];
    if(v<0||v>range)continue;
    if(v<bd){bd=v;best=L;}
  }
  return best;
}
function holeAt(r,c){
  for(var i=0;i<holes.length;i++) if(holes[i].open&&holes[i].r===r&&holes[i].c===c) return holes[i];
  return null;
}
function checkHoles(){
  var i,h;
  /* 追跡アメーバ：落ちたら10秒潜って、同じ場所から上がってくる */
  if(aMode==='hole'){
    if(now-aHoleT>=HOLE_HIDE){
      aMode=aPrevMode;aHoleCool=now+3000;
      beep(300,0.14,0.05,'sawtooth');
    }
  }else if(amoebaOn&&now>=aHoleCool){
    var a=amoebaPos();
    if(a){
      var q=cellAt(a.x,a.y);
      if(q.r>=0&&q.r<ROWS&&q.c>=0&&q.c<COLS&&holeAt(q.r,q.c)){
        aPrevMode=aMode;aMode='hole';aHoleT=now;aHolePos={x:a.x,y:a.y};
        holeFx.push({x:a.x,y:a.y,t:now,c:RED});
        fallSfx();
      }
    }
  }
  /* 待ち伏せアメーバ：動いている時に落ちたら消滅 */
  for(i=blockers.length-1;i>=0;i--){
    var b=blockers[i];
    if(b.mode!=='go'&&b.mode!=='wander')continue;
    if(!holeAt(b.r,b.c))continue;
    var bp=blockerPos(b);
    holeFx.push({x:bp.x,y:bp.y,t:now,c:VIO});
    blockers.splice(i,1);
    score+=HOLE_PT;
    pop(bp.x,bp.y-cell*0.3,'+'+HOLE_PT,'#ffd400');
    fallSfx();
    setTimeout(function(){beep(1046,0.1,0.05,'square');},900);
    setTimeout(function(){beep(1568,0.18,0.05,'square');},1000);
  }
}
function updateBlockers(){
  for(var i=0;i<blockers.length;i++){
    var b=blockers[i];
    if(b.mode==='eat'&&b.girl){
      if(now-b.eatT>=GIRL_EAT){
        girl.state='gone';b.girl=false;b.mode='wander';b.prog=0;b.wdir=null;pickWander(b);b.look=now;
      }
      continue;
    }
    if(b.mode==='eat'){
      if(now-b.eatT>=LURE_EAT){
        var k=lures.indexOf(b.target);
        if(k>=0)lures.splice(k,1);
        b.target=null;b.mode='wander';b.prog=0;b.wdir=null;pickWander(b);b.look=now;
      }
      continue;
    }
    if(b.mode==='go'){
      if(!b.target||lures.indexOf(b.target)<0||b.target.eat){stopBlocker(b);continue;}
      b.prog+=BLK_SPD*(dt/1000);
      var g=0;
      while(b.prog>=1&&b.pi<b.path.length-1&&g++<40){
        b.prog-=1;b.pi++;b.r=b.path[b.pi].r;b.c=b.path[b.pi].c;
      }
      if(b.pi>=b.path.length-1){
        b.prog=0;
        b.r=b.path[b.path.length-1].r;b.c=b.path[b.path.length-1].c;
        b.mode='eat';b.eatT=now;b.target.eat=now;
        onLureTaken(b.target,b);
        beep(360,0.16,0.045,'sawtooth');
      }
      continue;
    }

function placeBed(){

/* 人数に応じた3列の隊形（前列が少なく、後列ほど多い） */
function idolRows(n){
  if(n<=7)return [1,2,4];
  if(n===12)return [3,4,5];
  var front=Math.max(1,Math.round(n*0.25));
  var mid=Math.max(front,Math.round(n*0.33));
  var back=n-front-mid;
  if(back<mid){back=mid;front=n-mid-back;}
  if(front<1){front=1;mid=Math.max(1,Math.floor((n-1)/2));back=n-1-mid;}
  return [front,mid,back];
}
function idolSlotPos(k,S,ox2,oy2){
  var r=idolRowsCache||idolRows(idolN);
  var rowY=[0.80,0.635,0.48],rowS=[1.15,1.00,0.86];
  var row=0,idx=k;
  if(idx>=r[0]){idx-=r[0];row=1;}
  if(row===1&&idx>=r[1]){idx-=r[1];row=2;}
  var c=r[row]||1;
  var span=(c<=1)?0:Math.min(0.80,0.20*c);
  var x=(c<=1)?0.5:(0.5-span/2+span*(idx/(c-1)));
  var shrink=Math.min(1,6/Math.max(r[0],r[1],r[2]));
  return {x:ox2+S*x,y:oy2+S*rowY[row],s:rowS[row]*shrink};
}

function tryWarp(){
  if(gates.length<2||!held||now-warpT<=WARP_LOCK)return false;
  var h=cellAt(px,py);                       // 実際に立っているマスで判定する
  var gi=gateAt(h.r,h.c,held);
  if(gi<0)return false;
  var pt=gatePartner(gi);
  if(!pt)return false;
  doWarp(pt);

function step(ms){
  if(state!=='playing') return;
  if(warpHold){
    if(held===warpHold) return;      // ワープ直後、同じ方向を押しっぱなしなら止まったまま
    warpHold=null;
  }
  if(!held) return;
  if(tryWarp()) return;
  if(dir&&prog>0&&prog<1&&held===OPP[dir]){       // 通路の途中で反転
    pc=nb(pc,dir);dir=OPP[dir];prog=1-prog;
  }
  if(prog<=0){
    prog=0;
    if(open(pc,held)) dir=held;
    else if(!(dir&&open(pc,dir))) return;
  }
  var amt=SPEED*ms/1000,guard=0;
  while(amt>1e-9&&guard++<80&&state==='playing'){
    var m=Math.min(amt,1-prog);
    prog+=m;amt-=m;
    sync();
    if(prog>=1-1e-9){
      pc=nb(pc,dir);prog=0;sync();
      if(tryWarp())return;
      if(held&&open(pc,held)) dir=held;
      else if(open(pc,dir)) {}
      else break;                                  // 行き止まり
    }
  }
}
function pushHist(){
  var l=hist[hist.length-1];
  if(!l||Math.hypot(px-l.x,py-l.y)>1.5){hist.push({x:px,y:py});if(hist.length>600)hist.shift();}

function updateGirl(){
  if(girl.state!=='follow')return;
  var need=cell*GIRL_GAP,acc=0,i=hist.length-1;
  var gx=px,gy=py;
  while(i>0){
    var a=hist[i],b=hist[i-1],d=Math.hypot(a.x-b.x,a.y-b.y);
    if(acc+d>=need){
      var t=(need-acc)/(d||1);
      gx=a.x+(b.x-a.x)*t;gy=a.y+(b.y-a.y)*t;
      acc=need;break;
    }
    acc+=d;i--;
  }
  if(acc<need&&hist.length){gx=hist[0].x;gy=hist[0].y;}
  var ddx=gx-girl.x,ddy=gy-girl.y;
  if(Math.abs(ddx)>0.6||Math.abs(ddy)>0.6)
    girl.face=(Math.abs(ddx)>Math.abs(ddy))?(ddx>0?'e':'w'):(ddy>0?'s':'n');
  girl.x=gx;girl.y=gy;
}

function sync(){
  var p=playerPos();px=p.x;py=p.y;
  if(dir)face=dir;
  if(state!=='playing')return;
  pushHist();updateGirl();
  if(girl.state==='caged'&&pc.r===jail.r&&pc.c===jail.c&&!askLock){

  }
  if(!(pc.r===jail.r&&pc.c===jail.c))askLock=false;
  eraseDots();addDots();
  // 追跡アメーバ
  if(amoebaOn){
    var a=amoebaPos();
    if(a&&aMode!=='girl'&&aMode!=='hole'&&Math.hypot(px-a.x,py-a.y)<cell*0.45){caught('ヌメリンに触れた',null);return;}
  }
  // 待ち伏せアメーバ
  for(var i=0;i<blockers.length;i++){
    var b=blockers[i];
    if(b.girl) continue;                       // 少女を食べている個体は当たり判定なし
    if(b.mode!=='idle'&&b.mode!=='wander'&&b.mode!=='go') continue;
    if(b.mode==='idle'&&blockerOpen(b)>=0.55) continue;
    var bc=blockerPos(b);
    if(Math.hypot(px-bc.x,py-bc.y)<cell*0.31){caught('待機ヌメリンに捕まった',b);return;}
  }
  for(var ci=0;ci<coins.length;ci++){
    var co=coins[ci];
    if(co.got)continue;
    var cp=ctr(co.r,co.c);
    if(Math.hypot(px-cp.x,py-cp.y)<cell*0.34){

    }
  }
  for(var hi=0;hi<holes.length;hi++){
    var ho=holes[hi],hp=ctr(ho.r,ho.c);
    var on=Math.hypot(px-hp.x,py-hp.y)<cell*0.42;
    if(!ho.open){
      if(on){
        ho.open=now;ho.armed=0;          // 蓋を開けた直後は落ちない
        beep(320,0.09,0.045,'square');
        setTimeout(function(){beep(180,0.2,0.05,'sawtooth');},70);
      }
      continue;
    }
    if(!on){ho.armed=1;continue;}        // 一度離れたら落とし穴になる
    if(ho.armed){
      fallSfx();
      gameOver('マンホールに落ちた');
      return;
    }
  }
  if(bomb&&!bomb.got){
    var bp=ctr(bomb.r,bomb.c);
    if(Math.hypot(px-bp.x,py-bp.y)<cell*0.34){
      bomb.got=now;hasBomb=true;
      beep(520,0.08,0.05,'triangle');
      setTimeout(function(){beep(780,0.14,0.05,'triangle');},80);
    }
  }
  var g=ctr(goal.r,goal.c);
  if(Math.hypot(px-g.x,py-g.y)<cell*0.3) startTally();
}
function addDots(){

    var l=dots[dots.length-1];

    if(d<sp)break;

function eraseDots(){
  var sp=cell*SPACING_F,guard=0;
  while(dots.length>=2&&guard++<40){
    var b=dots[dots.length-2];
    if(Math.hypot(px-b.x,py-b.y)>=sp*0.96)break;
    dots.pop();
    score=Math.max(0,score-DOT_PT);
    if(dots.length%4===0) beep(420,0.03,0.02,'sine');

/* ============ 擬似餌（ピンク） ============ */
function pathTo(a,b){
  if(a.r===b.r&&a.c===b.c) return [{r:a.r,c:a.c}];
  var d=bfs(b.r,b.c);
  if(d[a.r][a.c]<0) return null;
  var path=[{r:a.r,c:a.c}],cur={r:a.r,c:a.c},guard=0;
  while(!(cur.r===b.r&&cur.c===b.c)&&guard++<3000){
    var best=null,bd=d[cur.r][cur.c];
    for(var k in DIRS){
      if(!open(cur,k))continue;
      var n=nb(cur,k);
      if(d[n.r][n.c]>=0&&d[n.r][n.c]<bd){bd=d[n.r][n.c];best=n;}
    }
    if(!best)break;
    cur=best;path.push(cur);
  }
  return path;
}
function aCellNow(){
  if(aMode==='trail'||!aPath){var p=amoebaPos();return p?cellAt(p.x,p.y):{r:pc.r,c:pc.c};}
  return aPath[Math.min(aPi,aPath.length-1)];
}
function dropLure(){
  if(state!=='playing'||lureStock<=0)return;
  for(var i=0;i<lures.length;i++) if(lures[i].r===pc.r&&lures[i].c===pc.c) return;
  lures.push({r:pc.r,c:pc.c,t:now,eat:0});
  lureStock--;
  beep(700,0.08,0.05,'triangle');
}
/* いちばん近い擬似餌を探す（ピンクは黄色より好み） */
function pickLure(){
  if(!lures.length)return null;
  var a=aCellNow(),d=bfs(a.r,a.c),best=null,bd=1e9;
  for(var i=0;i<lures.length;i++){
    var L=lures[i],v=d[L.r][L.c];
    if(L.eat)continue;
    if(v<0||v>LURE_RANGE)continue;
    if(v<bd){bd=v;best=L;}
  }
  return best;
}
function startGo(L){
  var p=pathTo(aCellNow(),{r:L.r,c:L.c});
  if(!p)return false;
  aPath=p;aPi=0;aProg=0;aTarget=L;aMode='go';
  beep(520,0.12,0.05,'triangle');
  return true;
}
/* 餌を食べ終わったら、抜けた地点そのものへ戻る。
   途中の黄色い丸を飛ばして消してしまわないようにする */
function startBack(fromCell){
  if(!dots.length){aMode='trail';aPath=null;amoeba=0;return;}
  var a=fromCell||aCellNow();
  var lo=Math.min(Math.floor(amoeba),dots.length-1);
  if(lo<0)lo=0;
  var q=cellAt(dots[lo].x,dots[lo].y),p=null,best=lo;
  if(q.r>=0&&q.r<ROWS&&q.c>=0&&q.c<COLS) p=pathTo(a,q);
  if(!p){
    /* 元の地点へ戻れない時だけ、そこから先で一番近い点を探す */
    var d=bfs(a.r,a.c),bd=1e9;best=-1;
    for(var i=lo;i<dots.length;i++){
      var q2=cellAt(dots[i].x,dots[i].y);
      if(q2.r<0||q2.r>=ROWS||q2.c<0||q2.c>=COLS)continue;
      var v=d[q2.r][q2.c];
      if(v<0)continue;
      if(v<bd){bd=v;best=i;}
    }
    if(best<0){aMode='trail';aPath=null;amoeba=Math.min(amoeba,Math.max(0,dots.length-1));return;}
    p=pathTo(a,cellAt(dots[best].x,dots[best].y));
    if(!p){aMode='trail';aPath=null;amoeba=Math.min(amoeba,Math.max(0,dots.length-1));return;}
  }
  aBackIdx=best;aPath=p;aPi=0;aProg=0;aTarget=null;aMode='back';
}
function arrive(){
  if(aMode==='go'){
    aMode='eat';aEatT=now;
    if(aTarget){aTarget.eat=now;onLureTaken(aTarget,null);}
    beep(400,0.2,0.05,'sawtooth');
  }else{
    aMode='trail';aPath=null;
    amoeba=Math.min(aBackIdx,Math.max(0,dots.length-1));
    lastEaten=Math.floor(amoeba);
  }
}
function finishEat(){
  aBoost=LURE_BOOST;                 // 餌を食べたら速さが倍になる（戻りも倍）
  if(aTarget){
    var i=lures.indexOf(aTarget);
    if(i>=0)lures.splice(i,1);
    aTarget=null;
  }
  var L=pickLure();
  if(L&&startGo(L))return;
  startBack();
}
/* 軌跡の最後尾がプレイヤーから十分離れている時だけ湧かせる
   （短い軌跡の上に湧くと、出た瞬間に襲いかかってしまうため） */
function spawnOK(){
  if(dots.length-1<SPAWN_MIN_DOTS)return false;
  return Math.hypot(px-dots[0].x,py-dots[0].y)>=cell*SPAWN_MIN_CELLS;
}
function amoebaSpeed(){
  var t=(now-amoebaT)/1000;
  return Math.min(SPD_MAX*aBoost,(EAT_PER_SEC+(stage-1)*SPD_STAGE)*(1+t*SPD_RAMP)*aBoost);
}
function amoebaPos(){
  if(aMode==='girl'&&aFreeze)return aFreeze;   // 少女を食べている間は動かない
  if(aMode==='hole')return aHolePos||null;
  if(aMode!=='trail'&&aPath&&aPath.length){
    var a=ctr(aPath[Math.min(aPi,aPath.length-1)].r,aPath[Math.min(aPi,aPath.length-1)].c);
    if(aPi<aPath.length-1){
      var b=ctr(aPath[aPi+1].r,aPath[aPi+1].c);
      return {x:a.x+(b.x-a.x)*aProg,y:a.y+(b.y-a.y)*aProg};
    }
    return a;
  }
  if(!dots.length)return null;
  var i=Math.floor(amoeba),f=amoeba-i;
  var a=dots[Math.min(i,dots.length-1)],b=dots[Math.min(i+1,dots.length-1)];
  return {x:a.x+(b.x-a.x)*f,y:a.y+(b.y-a.y)*f};
}

/* ============ ツルハシ ============ */
function edgeOf(r,c,d){
  if(d==='n')return {r:r,c:c,d:'n'};
  if(d==='s')return {r:r+1,c:c,d:'n'};
  if(d==='w')return {r:r,c:c,d:'w'};
  return {r:r,c:c+1,d:'w'};
}
function canBreak(d){
  var v=DIRS[d],nr=pc.r+v.dr,nc=pc.c+v.dc;
  if(nr<0||nr>=ROWS||nc<0||nc>=COLS)return false;   // 外壁は壊せない
  if(inBed(nr,nc))return false;                     // 中庭の壁は壊せない
  return !!grid[pc.r][pc.c][d];
}
function togglePick(){
  if(state!=='playing')return;
  if(!aiming&&picks<=0){                       // 在庫ゼロなら購入を提案
    if(canBuy('pick'))openBuy('pick');
    else beep(140,0.1,0.04,'square');
    return;
  }
  aiming=!aiming;
  idleT=now;
  beep(aiming?620:300,0.07,0.04,'triangle');
}
function doPick(d){
  if(!aiming||state!=='playing')return;
  if(!canBreak(d)){beep(140,0.1,0.05,'square');return;}   // 狙いは続行
  var e=edgeOf(pc.r,pc.c,d);
  setEdge(e,false);
  picks--;aiming=false;
  score=Math.max(0,score-PICK_COST);
  var L=edgeLine(e);
  breakFx.push({x1:L.x1,y1:L.y1,x2:L.x2,y2:L.y2,t:now});
  idleT=now;
  crashSfx();
}

function hitDir(x,y){
  var m=bs*0.12;
  for(var k in dpad){
    var b=dpad[k];
    if(x>=b.x-m&&x<=b.x+b.w+m&&y>=b.y-m&&y<=b.y+b.h+m) return k;
  }
  return null;
}
function inBox(b,x,y,m){return x>=b.x-m&&x<=b.x+b.w+m&&y>=b.y-m&&y<=b.y+b.h+m;}
function hitLure(x,y){return inBox(lureBtn,x,y,bs*0.07);}
function hitPick(x,y){return inBox(pickBtn,x,y,bs*0.07);}
function hitBomb(x,y){return inBox(bombBtn,x,y,bs*0.07);}
function hitCoin(x,y){return inBox(coinBtn,x,y,bs*0.07);}
function hitPause(x,y){return inBox(pauseBtn,x,y,bs*0.10);}
function readTouches(e){
  var r=cv.getBoundingClientRect(),d=null,lp=false,pk=false,bb=false,cn=false,ps=false;
  for(var i=0;i<e.touches.length;i++){
    var x=e.touches[i].clientX-r.left,y=e.touches[i].clientY-r.top;
    var k=hitDir(x,y);
    if(k)d=k;
    if(hitLure(x,y))lp=true;
    if(hitPick(x,y))pk=true;
    if(hitBomb(x,y))bb=true;
    if(hitCoin(x,y))cn=true;
    if(hitPause(x,y))ps=true;
  }
  if(ps&&!pausePressed){
    pauseDownT=now;
    if(state==='playing')enterPause();
    else if(state==='pause'||state==='halt')resumeFromAsk();   // もう一度押すと解除
  }
  if(ps&&state==='pause'&&now-pauseDownT>=3000){state='halt';saveGame();saveInfo=readSave();beep(180,0.2,0.05,'sawtooth');}
  pausePressed=ps;
  if(state==='pause'&&d==='e'&&!dirPressed){dirPressed=true;skipStage();return;}
  if(bb&&!bombPressed)useBomb();
  bombPressed=bb;
  if(cn&&!coinPressed)openShop();
  coinPressed=cn;
  if(pk&&!pickPressed){togglePick();dirPressed=!!d;}
  pickPressed=pk;
  if(lp&&!lurePressed){dropLure();idleT=now;}
  lurePressed=lp;
  if(aiming){
    held=null;idleT=now;
    if(d&&!dirPressed) doPick(d);
    dirPressed=!!d;
    return;
  }
  dirPressed=!!d;
  held=d;
  if(held)idleT=now;
}
function tap(x,y){
  audioUnlock();
  if(state==='title'){
    if(x===undefined)return;
    var sb=startBtn(),hb=howBtn();
    if(saveInfo&&inBox(contBtn(),x,y,8)){
      beep(660,0.08,0.05,'triangle');
      setTimeout(function(){beep(990,0.14,0.05,'triangle');},90);
      continueGame();return;
    }
    if(inBox(hb,x,y,8)){beep(760,0.09,0.05,'triangle');state='help';helpScroll=0;placeNameInput();return;}
    if(inBox(sb,x,y,8)){beep(880,0.09,0.05,'triangle');startGame();}
    return;
  }
  if(state==='idol'){
    if(idolDemo&&x!==undefined){musicStop();idolDemo=false;beep(400,0.08,0.045,'triangle');toTitle();}
    return;
  }
  if(state==='help'){
    if(x===undefined)return;
    var cb=closeBtn();
    if(inBox(cb,x,y,10)){beep(400,0.08,0.045,'triangle');state='title';placeNameInput();}
    return;
  }
  if(state==='opening'){endOpening();return;}
  if(state==='ready'){state='countdown';cdT=now;cdLast=-1;}
  else if(state==='pause'){
    if(x===undefined)return;
    if(hitPause(x,y)||hitDir(x,y))return;      // ボタンと十字は操作用
    resumeFromAsk();
  }
  else if(state==='halt'){
    if(x===undefined)return;
    if(hitPause(x,y))return;
    resumeFromAsk();
  }
  else if(state==='buy'){
    if(x===undefined)return;
    var bb=askBtns();
    if(inBox(bb.yes,x,y,8)){doBuy(buyKind);resumeFromAsk();}
    else if(inBox(bb.no,x,y,8)){beep(240,0.08,0.04,'square');resumeFromAsk();}
  }
  else if(state==='shop'){
    if(x===undefined)return;
    var sh=shopBtns();
    if(inBox(sh.pick,x,y,8)&&canBuy('pick')){doBuy('pick');resumeFromAsk();}
    else if(inBox(sh.bomb,x,y,8)&&canBuy('bomb')){doBuy('bomb');resumeFromAsk();}
    else if(inBox(sh.cancel,x,y,8)){beep(240,0.08,0.04,'square');resumeFromAsk();}
  }
  else if(state==='ask'){
    var ab=askBtns();
    if(x===undefined)return;
    if(inBox(ab.yes,x,y,8)){rescueGirl();resumeFromAsk();}
    else if(inBox(ab.no,x,y,8)){askLock=true;resumeFromAsk();}
  }
  else if(state==='over'&&now-endT>600){
    if(canRetry){beep(660,0.09,0.05,'triangle');newStage();}
    else{submitScore();toTitle();}
  }
  else if(state==='clear'&&now-endT>400){
    var b=nextBtn,m=bs*0.2;
    if(x===undefined||(x>=b.x-m&&x<=b.x+b.w+m&&y>=b.y-m&&y<=b.y+b.h+m)){
      beep(880,0.08,0.05,'triangle');
      stage++;newStage();
    }
  }
}

/* ================= 更新 ================= */
function update(){
  if(state==='countdown'){
    if(now-cdT>=3500) startPlay();
    else{var k=Math.floor((now-cdT)/1000);
      if(k!==cdLast&&k<3){cdLast=k;beep([523,659,784][k],0.13,0.055,'square');}}
  }
  if(state==='tally'){
    var tc=tallyCount();
    if(tc!==tallyLast){
      tallyLast=tc;
      if(now-tallyTick>34){
        tallyTick=now;
        beep(700+Math.min(600,tc*7),0.02,0.025,'square');
      }
    }
    if(now-tallyT>=TALLY_MS&&!tallyDone){
      tallyDone=now;
      pop(px,py-cell*0.9,'TRAJECTORY +'+(tallyN*DOT_PT),'#ffd400');
      beep(1046,0.09,0.05,'triangle');
      setTimeout(function(){beep(1568,0.16,0.05,'triangle');},110);
    }
    /* 救出できていたら、少女が喜ぶ演出を挟む */
    if(tallyDone&&!girlCheerT&&girl.state==='follow'&&now-tallyDone>=600){
      girlCheerT=now;
      pop(girl.x,girl.y-cell*1.0,'+'+GIRL_BONUS,'#ff8ac0');
      beep(1174,0.09,0.05,'triangle');
      setTimeout(function(){beep(1568,0.1,0.05,'triangle');},100);
      setTimeout(function(){beep(2093,0.18,0.05,'triangle');},200);
    }
    var endAt=(girl.state==='follow')
      ? (girlCheerT?girlCheerT+GIRL_CHEER:Infinity)
      : (tallyDone+TALLY_HOLD);
    if(tallyDone&&now>=endAt){
      if(girl.state==='follow'&&savedGirls+1>=idolNext){
        savedGirls++;
        startIdol(false,idolNext);
      }else{
        if(girl.state==='follow')savedGirls++;
        clearStage();
      }
    }
  }
  if(state==='idol') updateIdol();
  if(state==='opening'&&now-openT>=OPEN_MS) endOpening();
  if(state==='ready'&&(now-readyT)/1000>=viewLimit()){
    state='countdown';cdT=now;cdLast=-1;
  }
  if(state==='shift'){
    var sT=now-shiftT;
    if(!shiftCrashed&&sT>=SH_HOLD){shiftCrashed=true;crashSfx();}
    if(!shiftApplied&&sT>=SH_APPLY) applyShift();
    if(sT>=SH_TOTAL){
      var pause=now-shiftT;
      playT+=pause;amoebaT+=pause;aEatT+=pause;shiftAt+=pause;
      if(respawnAt)respawnAt+=pause;
      if(fuse)fuse.t0+=pause;
      idleT=now;aLook=now;
      animRem=[];animAdd=[];animSkip={};
      state='playing';
    }
  }
  if(state==='playing'){
    tBonus=Math.max(0,TIME_MAX-Math.floor((now-playT)/1000)*TIME_DEC);
    if(held)idleT=now;
    if((now-idleT)/1000>=IDLE_LIMIT){gameOver('操作が止まった');return;}
    if(now>=shiftAt){shiftAt=now+SHIFT_EVERY;reshape();}
    step(dt);
    if(state!=='playing')return;
    if(fuse){
      var fp=(now-fuse.t0)/FUSE_MS;
      if(!amoebaOn) fuse=null;
      else if(fp>=1) explode();
    }
    if(!amoebaOn&&respawnAt&&now>=respawnAt&&spawnOK()){
      amoebaOn=true;amoebaT=now;amoeba=0;lastEaten=-1;respawnAt=0;
      aMode='trail';aPath=null;aFreeze=null;aTarget=null;
      beep(220,0.3,0.06,'sawtooth');
    }
    if(!amoebaOn&&!respawnAt&&(dots.length-1>=TRIGGER||now-playT>=AMOEBA_TIME)&&spawnOK()){
      amoebaOn=true;amoeba=0;lastEaten=-1;amoebaT=now;
      beep(220,0.25,0.06,'sawtooth');
    }
    checkHoles();
    updateBlockers();
    if(amoebaOn){
      var sp=amoebaSpeed();
      if(aMode==='trail'){
        if(now-aLook>350){aLook=now;var L=pickLure();if(L)startGo(L);}
      }
      if(aMode==='trail'){
        amoeba+=sp*(dt/1000);
        var e=Math.floor(amoeba);
        if(e!==lastEaten){lastEaten=e;beep(260+sp*70,0.05,0.04,'square');}
        if(amoeba>=dots.length-1){
          amoeba=Math.max(0,dots.length-1);
          var ap=amoebaPos();
          if(ap&&Math.hypot(px-ap.x,py-ap.y)<cell*0.55) caught('ヌメリンに食べられた',null);
          else startBack();
        }
      }else if(aMode==='hole'){
        /* 潜っている間は何もしない */
      }else if(aMode==='girl'){
        if(now-aEatT>=GIRL_EAT){
          girl.state='gone';
          var fz=aFreeze,fc=null;
          if(fz){
            var q=cellAt(fz.x,fz.y);
            if(q.r>=0&&q.r<ROWS&&q.c>=0&&q.c<COLS)fc={r:q.r,c:q.c};
          }
          aFreeze=null;aMode='trail';aPath=null;
          startBack(fc);               // 置き去りの位置から軌跡まで歩いて戻る
          if(aMode==='trail'){
            amoeba=Math.min(amoeba,Math.max(0,dots.length-1));
            lastEaten=Math.floor(amoeba);
          }
        }
      }else if(aMode==='eat'){
        if(now-aEatT>=LURE_EAT) finishEat();
      }else{
        aProg+=sp*SPACING_F*(aMode==='go'?LURE_SPD:1)*(dt/1000);
        var guard=0;
        while(aProg>=1&&aPi<aPath.length-1&&guard++<40){aProg-=1;aPi++;}
        if(aPi>=aPath.length-1){aProg=0;arrive();}
      }
    }
  }
}

/* 1文字ずつ色を変えて描く（色は連番で送る） */
function btRainbow(str,x,y,px,align,trk,ref){
  str=String(str).toUpperCase();trk=trk||0;
  var adv=(6+trk)*px,total=btWidth(str,px,trk),sx=x;
  if(align==='center')sx=x-total/2;else if(align==='right')sx=x-total;
  var top=y-7*px;
  for(var i=0;i<str.length;i++){
    var ch=str.charAt(i);
    if(ch===' ')continue;
    var g=GLYPH[ch];
    if(!g)continue;
    ctx.fillStyle=SUB_COLORS[ref.i%SUB_COLORS.length];
    ref.i++;
    ctx.beginPath();
    var bx=sx+i*adv;
    for(var j=0;j<g.length;j+=2)ctx.rect(bx+g[j]*px,top+g[j+1]*px,px,px);
    ctx.fill();
  }
}
function btWidth(str,px,trk){return str.length*(6+(trk||0))*px-(1+(trk||0))*px;}
/* px=ドットの大きさ。yはベースライン。ASCII以外はシステムフォントで描く */
function bt(str,x,y,px,align,trk){
  str=String(str).toUpperCase();trk=trk||0;
  if(!/^[ -~]*$/.test(str)){
    mono(px*7,'700');ctx.textAlign=align||'left';ctx.fillText(str,x,y);return;
  }
  var adv=(6+trk)*px,total=btWidth(str,px,trk),sx=x;
  if(align==='center')sx=x-total/2;else if(align==='right')sx=x-total;
  var top=y-7*px;
  ctx.beginPath();
  for(var i=0;i<str.length;i++){
    var g=GLYPH[str.charAt(i)];
    if(!g)continue;
    var bx=sx+i*adv;
    for(var j=0;j<g.length;j+=2) ctx.rect(bx+g[j]*px,top+g[j+1]*px,px,px);
  }
  ctx.fill();
}
function rrect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
function blob(x,y,R,t,fill,line){
  ctx.beginPath();
  for(var k=0;k<=26;k++){
    var a=k/26*Math.PI*2;
    var rr=R*(1+0.17*Math.sin(a*3+t*0.006)+0.1*Math.sin(a*5-t*0.0045));
    var qx=x+Math.cos(a)*rr,qy=y+Math.sin(a)*rr;
    if(k)ctx.lineTo(qx,qy);else ctx.moveTo(qx,qy);
  }
  ctx.closePath();ctx.fillStyle=fill;ctx.fill();
  ctx.strokeStyle=line;ctx.lineWidth=1.2;ctx.stroke();
}
function drawMaze(){
  ctx.strokeStyle=ink(1);ctx.lineWidth=Math.max(1.3,cell*0.07);
  ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();
  for(var r=0;r<ROWS;r++)for(var c=0;c<COLS;c++){
    var g=grid[r][c],x=ox+c*cell,y=oy+r*cell;
    if(r>0&&g.n&&!animSkip[r+','+c+',n']){ctx.moveTo(x,y);ctx.lineTo(x+cell,y);}
    if(c>0&&g.w&&!animSkip[r+','+c+',w']){ctx.moveTo(x,y);ctx.lineTo(x,y+cell);}
  }
  ctx.stroke();
  drawBorder();
}
function mix(a,b,f){
  return 'rgb('+Math.round(a[0]+(b[0]-a[0])*f)+','+Math.round(a[1]+(b[1]-a[1])*f)+','+Math.round(a[2]+(b[2]-a[2])*f)+')';
}
/* B色：白なら50%暗く、黒なら50%明るく＝どちらも50%グレー */
function inkHalf(){
  var v=INKRGB[0];
  var h=Math.round(v>=128?v*0.5:v+(255-v)*0.5);
  return 'rgb('+h+','+h+','+h+')';
}
/* 外周：迷路の外側にぴったり並ぶ正方形ブロック（角も含めて隙間・重なりなし） */
function drawBorder(){
  var T=cell/3,mw=COLS*cell,mh=ROWS*cell;
  var nx=COLS*3+2,ny=ROWS*3;
  var A=[],B=[],idx=0,j,i,c,r;
  function put(x,y,skip){
    if(!skip)(idx%2===0?A:B).push([x,y]);
    idx++;
  }
  for(j=0;j<nx;j++){                                  // 上辺（左上の角から右へ）
    c=Math.floor((j-1)/3);
    put(ox-T+j*T,oy-T,(j>0&&j<nx-1)&&!grid[0][c].n);
  }
  for(i=0;i<ny;i++){                                  // 右辺（上から下へ）
    r=Math.floor(i/3);
    put(ox+mw,oy+i*T,!grid[r][COLS-1].e);
  }
  for(j=nx-1;j>=0;j--){                               // 下辺（右から左へ）
    c=Math.floor((j-1)/3);
    put(ox-T+j*T,oy+mh,(j>0&&j<nx-1)&&!grid[ROWS-1][c].s);
  }
  for(i=ny-1;i>=0;i--){                               // 左辺（下から上へ）
    r=Math.floor(i/3);
    put(ox-T,oy+i*T,!grid[r][0].w);
  }
  var w=Math.ceil(T)+0.5;
  ctx.fillStyle=ink(1);
  for(i=0;i<A.length;i++)ctx.fillRect(A[i][0],A[i][1],w,w);
  ctx.fillStyle=inkHalf();
  for(i=0;i<B.length;i++)ctx.fillRect(B[i][0],B[i][1],w,w);
}
function drawShift(){
  if(state!=='shift')return;
  var t=now-shiftT,lw=Math.max(1.3,cell*0.07),i,e,L;
  ctx.lineCap='round';
  for(i=0;i<animRem.length;i++){
    e=animRem[i];L=edgeLine(e);
    var dx=0,dy=0,al=1;
    if(t>SH_HOLD){
      var k=Math.min(1,(t-SH_HOLD)/SH_SLIDE);
      al=1-k;
      if(e.d==='n')dx=k*cell*1.4; else dy=k*cell*1.4;
    }else al=0.55+0.45*Math.sin(t*0.018);
    if(al<=0.01)continue;
    ctx.strokeStyle='rgba('+GRN[0]+','+GRN[1]+','+GRN[2]+','+(al*0.3)+')';ctx.lineWidth=lw*3.4;
    ctx.beginPath();ctx.moveTo(L.x1+dx,L.y1+dy);ctx.lineTo(L.x2+dx,L.y2+dy);ctx.stroke();
    ctx.strokeStyle='rgba('+GRN[0]+','+GRN[1]+','+GRN[2]+','+al+')';ctx.lineWidth=lw*1.5;
    ctx.beginPath();ctx.moveTo(L.x1+dx,L.y1+dy);ctx.lineTo(L.x2+dx,L.y2+dy);ctx.stroke();
  }
  if(t>=SH_APPLY){
    var g=Math.min(1,(t-SH_APPLY)/SH_GROW);
    var f=Math.max(0,Math.min(1,(t-SH_APPLY-SH_GROW)/SH_FADE));
    var col=mix(BLU,WHT,f);
    for(i=0;i<animAdd.length;i++){
      e=animAdd[i];L=edgeLine(e);
      var mx=(L.x1+L.x2)/2,my=(L.y1+L.y2)/2;
      var hx=(L.x2-L.x1)/2*g,hy=(L.y2-L.y1)/2*g;
      if(f<1){
        ctx.strokeStyle='rgba('+BLU[0]+','+BLU[1]+','+BLU[2]+','+(0.3*(1-f))+')';ctx.lineWidth=lw*3.4;
        ctx.beginPath();ctx.moveTo(mx-hx,my-hy);ctx.lineTo(mx+hx,my+hy);ctx.stroke();
      }
      ctx.strokeStyle=col;ctx.lineWidth=lw*(1.5-0.5*f);
      ctx.beginPath();ctx.moveTo(mx-hx,my-hy);ctx.lineTo(mx+hx,my+hy);ctx.stroke();
    }
  }
}
function drawGates(){
  var i,g,v,p,ex,ey,pl;
  for(i=0;i<gates.length;i++){
    g=gates[i];v=DIRS[g.d];p=ctr(g.r,g.c);
    pl=0.5+0.5*Math.sin(now*0.005+i*Math.PI);
    ex=p.x+v.dc*cell*0.5;ey=p.y+v.dr*cell*0.5;
    var hx=v.dr?cell*0.45:0, hy=v.dc?cell*0.45:0;   // 穴の口の向き
    var gc=GATE_COLORS[g.p%GATE_COLORS.length];
    ctx.fillStyle=rgba(gc,0.07+0.07*pl);
    ctx.fillRect(p.x-cell*0.45,p.y-cell*0.45,cell*0.9,cell*0.9);
    ctx.lineCap='round';
    ctx.strokeStyle=rgba(gc,0.55+0.45*pl);
    ctx.lineWidth=Math.max(1.6,cell*0.09);
    for(var k=-1;k<=1;k+=2){
      var ax=ex+hx*k,ay=ey+hy*k;
      ctx.beginPath();
      ctx.moveTo(ax,ay);
      ctx.lineTo(ax+v.dc*cell*0.26,ay+v.dr*cell*0.26);
      ctx.stroke();
    }
    ctx.strokeStyle=rgba(gc,0.4+0.5*pl);
    ctx.lineWidth=Math.max(1.2,cell*0.06);
    for(var j=0;j<2;j++){
      var o=(j*0.16+0.06)*cell;
      ctx.beginPath();
      ctx.moveTo(ex-hx*0.55-v.dc*o,ey-hy*0.55-v.dr*o);
      ctx.lineTo(ex-v.dc*o*0.2,ey-v.dr*o*0.2);
      ctx.lineTo(ex+hx*0.55-v.dc*o,ey+hy*0.55-v.dr*o);
      ctx.stroke();
    }
  }
  for(i=warpFx.length-1;i>=0;i--){
    var f=warpFx[i],age=now-f.t;
    if(age>500){warpFx.splice(i,1);continue;}
    var t=age/500;
    ctx.strokeStyle=rgba(f.c||CYA,1-t);
    ctx.lineWidth=Math.max(1.4,cell*0.08);
    ctx.beginPath();ctx.arc(f.x,f.y,cell*(0.2+0.9*t),0,7);ctx.stroke();
  }
}
function drawAim(){
  if(!aiming||state!=='playing')return;
  var pl=0.5+0.5*Math.sin(now*0.012);
  ctx.lineCap='round';
  for(var k in DIRS){
    if(!canBreak(k))continue;
    var L=edgeLine(edgeOf(pc.r,pc.c,k));
    ctx.strokeStyle=rgba(ORG,0.25+0.35*pl);
    ctx.lineWidth=Math.max(2,cell*0.2);
    ctx.beginPath();ctx.moveTo(L.x1,L.y1);ctx.lineTo(L.x2,L.y2);ctx.stroke();
    ctx.strokeStyle=rgba(ORG_L,0.6+0.4*pl);
    ctx.lineWidth=Math.max(1.4,cell*0.075);
    ctx.beginPath();ctx.moveTo(L.x1,L.y1);ctx.lineTo(L.x2,L.y2);ctx.stroke();
  }
}
function drawBreakFx(){
  for(var i=breakFx.length-1;i>=0;i--){
    var f=breakFx[i],age=now-f.t;
    if(age>600){breakFx.splice(i,1);continue;}
    var k=age/600,al=1-k;
    var horiz=Math.abs(f.x2-f.x1)>Math.abs(f.y2-f.y1);
    ctx.lineWidth=Math.max(1.2,cell*0.07);
    ctx.strokeStyle=rgba(ORG,al);
    for(var j=0;j<4;j++){
      var t0=j/4,t1=(j+1)/4;
      var ax=f.x1+(f.x2-f.x1)*t0,ay=f.y1+(f.y2-f.y1)*t0;
      var bx=f.x1+(f.x2-f.x1)*t1,by=f.y1+(f.y2-f.y1)*t1;
      var sd=(j%2?1:-1),sl=(j-1.5)*k*cell*0.3;
      var offx=horiz?sl:sd*k*cell*0.55;
      var offy=horiz?sd*k*cell*0.55:sl;
      ctx.beginPath();ctx.moveTo(ax+offx,ay+offy);ctx.lineTo(bx+offx,by+offy);ctx.stroke();
    }
  }
}
function drawStartSignal(){
  var p=ctr(start.r,start.c),col=SIG_R,lit=1;
  if(state==='countdown'){
    var k=Math.floor((now-cdT)/1000);
    col=(k<1)?SIG_R:(k<2)?SIG_Y:SIG_G;
  }else if(state!=='ready'){col=SIG_G;lit=0.45;}
  var w=cell*0.60,h=cell*0.74;
  ctx.strokeStyle=ink(0.25+0.35*lit);
  ctx.lineWidth=Math.max(1,cell*0.045);
  ctx.beginPath();ctx.moveTo(p.x,p.y+h*0.5);ctx.lineTo(p.x,p.y+h*0.92);ctx.stroke();
  rrect(p.x-w/2,p.y-h/2,w,h,w*0.26);
  ctx.fillStyle=ink(0.07);ctx.fill();
  ctx.strokeStyle=ink(0.35+0.4*lit);ctx.lineWidth=1.2;ctx.stroke();
  var r=w*0.28;
  ctx.globalAlpha=0.20*lit;
  ctx.beginPath();ctx.arc(p.x,p.y,r*2.1,0,7);ctx.fillStyle=col;ctx.fill();
  ctx.globalAlpha=lit;
  ctx.beginPath();ctx.arc(p.x,p.y,r,0,7);ctx.fillStyle=col;ctx.fill();
  ctx.globalAlpha=1;
  ctx.strokeStyle=ink(0.3+0.3*lit);ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(p.x-w*0.42,p.y-r*1.35);ctx.lineTo(p.x+w*0.42,p.y-r*1.35);ctx.stroke();
}
function drawGoalFlag(){
  var p=ctr(goal.r,goal.c),pl=0.5+0.5*Math.sin(now*0.005);
  var base=p.y+cell*0.30,top=p.y-cell*0.38,px2=p.x-cell*0.06;
  ctx.strokeStyle=ink(1);ctx.lineWidth=Math.max(1.1,cell*0.05);ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(px2,base);ctx.lineTo(px2,top);ctx.stroke();
  var wv=Math.sin(now*0.006)*cell*0.05;
  ctx.beginPath();
  ctx.moveTo(px2,top);
  ctx.quadraticCurveTo(px2+cell*0.20,top+cell*0.04+wv,px2+cell*0.36,top+cell*0.11);
  ctx.quadraticCurveTo(px2+cell*0.18,top+cell*0.17-wv,px2,top+cell*0.24);
  ctx.closePath();
  ctx.fillStyle=FLAG;ctx.fill();
  ctx.strokeStyle=rgba(FLAG_L,0.8);ctx.lineWidth=1;ctx.stroke();
}
function fuseIdx(){
  if(!fuse)return dots.length;
  var p=Math.min(1,(now-fuse.t0)/FUSE_MS);
  var to=amoebaOn?Math.floor(amoeba):0;
  return Math.max(to,Math.round(fuse.from+(to-fuse.from)*p));
}
function drawDots(){
  var from=amoebaOn?Math.floor(amoeba)+1:0,i;
  if(from<0)from=0;
  if(state==='tally')from=Math.min(dots.length,tallyFrom+tallyCount());
  var upto=Math.min(dots.length,fuse?fuseIdx()+1:dots.length);
  ctx.fillStyle=rgba(YEL,0.18);ctx.beginPath();
  for(i=from;i<upto;i++){ctx.moveTo(dots[i].x+cell*0.2,dots[i].y);ctx.arc(dots[i].x,dots[i].y,cell*0.2,0,7);}
  ctx.fill();
  ctx.fillStyle=YEL;ctx.beginPath();
  for(i=from;i<upto;i++){ctx.moveTo(dots[i].x+cell*0.11,dots[i].y);ctx.arc(dots[i].x,dots[i].y,cell*0.11,0,7);}
  ctx.fill();
  if(fuse&&upto>0&&upto<=dots.length){                 // 導火線の火
    var f=dots[Math.max(0,upto-1)],fl=0.7+0.3*Math.sin(now*0.05);
    ctx.beginPath();ctx.arc(f.x,f.y,cell*0.34*fl,0,7);
    ctx.fillStyle=rgba(BOMB_C,0.25);ctx.fill();
    ctx.beginPath();ctx.arc(f.x,f.y,cell*0.17*fl,0,7);
    ctx.fillStyle='#fff2c0';ctx.fill();
  }
}
function drawBomb(){
  if(!bomb||bomb.got)return;
  var p=ctr(bomb.r,bomb.c),pl=0.5+0.5*Math.sin(now*0.008);
  ctx.beginPath();ctx.arc(p.x,p.y+cell*0.04,cell*0.24,0,7);
  ctx.fillStyle=DARKBG?'#2a2a33':'#1a1a22';ctx.fill();
  ctx.strokeStyle=ink(0.75);ctx.lineWidth=1.4;ctx.stroke();
  ctx.beginPath();ctx.arc(p.x-cell*0.08,p.y-cell*0.03,cell*0.06,0,7);
  ctx.fillStyle=ink(0.45);ctx.fill();
  ctx.strokeStyle=BOMB_C;ctx.lineWidth=Math.max(1.2,cell*0.05);ctx.lineCap='round';
  ctx.beginPath();
  ctx.moveTo(p.x+cell*0.10,p.y-cell*0.18);
  ctx.quadraticCurveTo(p.x+cell*0.26,p.y-cell*0.28,p.x+cell*0.20,p.y-cell*0.40);
  ctx.stroke();
  ctx.beginPath();ctx.arc(p.x+cell*0.20,p.y-cell*0.42,cell*0.09*(0.7+0.5*pl),0,7);
  ctx.fillStyle=rgba(BOMB_C,0.85);ctx.fill();
}
function drawBoom(){
  for(var i=boomFx.length-1;i>=0;i--){
    var b=boomFx[i],age=now-b.t;
    if(age>700){boomFx.splice(i,1);continue;}
    var t=age/700;
    ctx.strokeStyle=rgba(BOMB_C,1-t);ctx.lineWidth=Math.max(2,cell*0.12*(1-t));
    ctx.beginPath();ctx.arc(b.x,b.y,cell*(0.2+1.9*t),0,7);ctx.stroke();
    ctx.strokeStyle='rgba(255,255,255,'+(0.8*(1-t))+')';ctx.lineWidth=Math.max(1,cell*0.06);
    ctx.beginPath();ctx.arc(b.x,b.y,cell*(0.1+1.2*t),0,7);ctx.stroke();
    for(var k=0;k<8;k++){
      var a=k/8*Math.PI*2,d0=cell*(0.3+1.6*t);
      ctx.fillStyle=rgba(BOMB_C,(1-t)*0.9);
      ctx.beginPath();ctx.arc(b.x+Math.cos(a)*d0,b.y+Math.sin(a)*d0,cell*0.09*(1-t),0,7);ctx.fill();
    }
  }
}
function drawBed(){
  if(!bed)return;
  var r,c,k;
  var bx0=ox+bed.c0*cell,by0=oy+bed.r0*cell;
  var bw2=(bed.c1-bed.c0+1)*cell,bh2=(bed.r1-bed.r0+1)*cell;
  /* 地面（神殿の面だけ石畳） */
  if(bed.temple){
    drawBricks(bx0,by0,bw2,bh2);
  }else{
    ctx.fillStyle='rgba(52,170,80,0.45)';
    ctx.fillRect(bx0,by0,bw2,bh2);
  }
  /* 内側に太らせたコンクリートブロックの縁 */
  drawBedWall(bx0,by0,bw2,bh2);
  var CF=['#ff4f9a','#ffd400','#ffffff','#ff8a3c','#b06bff'];
  var T2=Math.max(2,Math.max(1.3,cell*0.07)*2);
  for(r=bed.r0;r<=bed.r1;r++)for(c=bed.c0;c<=bed.c1;c++){
    if(bed.temple)continue;                     // 神殿の面には花を植えない
    if(bed.fountain&&
       Math.abs(c+0.5-bed.cx)<=bed.fs/2+0.15&&
       Math.abs(r+0.5-bed.cy)<=bed.fs/2+0.15)continue;
    var h=((r*73856093)^(c*19349663))>>>0;
    for(k=0;k<3;k++){                                  // 1マスに3輪
      var hh=(h>>(k*7))>>>0;
      var fx=ox+c*cell+cell*(0.20+0.60*((hh&15)/15));
      var base=oy+r*cell+cell*(0.55+0.40*(((hh>>4)&15)/15));
      var hgt=cell*(0.30+0.14*(((hh>>8)&7)/7));
      var fy=base-hgt;
      /* 縁のブロックに埋もれないよう内側に寄せる */
      fx=Math.min(Math.max(fx,bx0+T2+cell*0.14),bx0+bw2-T2-cell*0.14);
      base=Math.min(Math.max(base,by0+T2+cell*0.18),by0+bh2-T2-cell*0.05);
      fy=base-hgt;
      var sway=Math.sin(now*0.0025+r*0.8+c*1.4+k*2.1)*cell*0.045;
      var col=CF[(hh>>12)%5],pr=cell*0.10,off=cell*0.108;
      if(k===0){
        ctx.save();ctx.translate(fx,base);ctx.scale(1,0.34);
        ctx.beginPath();ctx.arc(0,0,cell*0.13,0,7);
        ctx.fillStyle='rgba(0,70,25,0.28)';ctx.fill();ctx.restore();
      }
      ctx.strokeStyle='#2e9b46';ctx.lineWidth=Math.max(1,cell*0.042);ctx.lineCap='round';
      ctx.beginPath();
      ctx.moveTo(fx,base);
      ctx.quadraticCurveTo(fx+sway*0.4,base-hgt*0.5,fx+sway,fy);
      ctx.stroke();
      if(k===0){
        ctx.fillStyle='#39ad50';
        ctx.beginPath();
        ctx.moveTo(fx+sway*0.35,base-hgt*0.45);
        ctx.quadraticCurveTo(fx+cell*0.18,base-hgt*0.62,fx+cell*0.17,base-hgt*0.32);
        ctx.quadraticCurveTo(fx+cell*0.09,base-hgt*0.34,fx+sway*0.35,base-hgt*0.45);
        ctx.fill();
      }
      ctx.fillStyle=col;
      ctx.beginPath();
      for(var q=0;q<5;q++){
        var a=(q/5)*Math.PI*2-Math.PI/2;
        var pxx=fx+sway+Math.cos(a)*off,pyy=fy+Math.sin(a)*off*0.68;
        ctx.moveTo(pxx+pr,pyy);
        ctx.arc(pxx,pyy,pr,0,7);
      }
      ctx.fill();
      ctx.beginPath();ctx.arc(fx+sway,fy-cell*0.012,cell*0.072,0,7);
      ctx.fillStyle=(col==='#ffd400')?'#ff8a3c':'#ffd400';ctx.fill();
    }
  }
  if(bed.fountain) drawFountain();
}
/* 赤煉瓦の敷き詰め */
function drawBricks(x,y,w,h){
  var bhh=Math.max(4,cell*0.30),bww=bhh*2.1,mortar=Math.max(1,bhh*0.14);
  ctx.save();
  ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();
  ctx.fillStyle='#8c4a34';ctx.fillRect(x,y,w,h);          // 目地
  var row=0;
  for(var yy=y;yy<y+h;yy+=bhh){
    var off=(row%2)?-bww/2:0;
    for(var xx=x+off;xx<x+w;xx+=bww){
      ctx.fillStyle=((row*7+((xx/bww)|0)*3)%5<2)?'#b3543a':'#c26247';
      ctx.fillRect(xx+mortar/2,yy+mortar/2,bww-mortar,bhh-mortar);
    }
    row++;
  }
  ctx.restore();
}
/* 中庭の縁：内側に張り出したコンクリートブロック */
function drawBedWall(x,y,w,h){
  var T2=Math.max(2,Math.max(1.3,cell*0.07)*2);
  var seg=Math.max(10,cell*0.55);
  ctx.fillStyle='#b3b0a6';
  ctx.fillRect(x,y,w,T2);
  ctx.fillRect(x,y+h-T2,w,T2);
  ctx.fillRect(x,y+T2,T2,h-T2*2);
  ctx.fillRect(x+w-T2,y+T2,T2,h-T2*2);
  /* 天端のハイライトと内側の陰 */
  ctx.fillStyle='rgba(255,255,255,0.28)';
  ctx.fillRect(x,y,w,T2*0.28);
  ctx.fillRect(x,y+h-T2,w,T2*0.28);
  ctx.fillRect(x,y+T2,T2*0.28,h-T2*2);
  ctx.fillRect(x+w-T2,y+T2,T2*0.28,h-T2*2);
  ctx.fillStyle='rgba(0,0,0,0.22)';
  ctx.fillRect(x+T2*0.72,y+T2*0.72,w-T2*1.44,T2*0.28);
  ctx.fillRect(x+T2*0.72,y+h-T2,w-T2*1.44,T2*0.28);
  /* 目地 */
  ctx.strokeStyle='rgba(0,0,0,0.30)';ctx.lineWidth=1;
  ctx.beginPath();
  for(var xx=x+seg;xx<x+w-2;xx+=seg){
    ctx.moveTo(xx,y);ctx.lineTo(xx,y+T2);
    ctx.moveTo(xx,y+h-T2);ctx.lineTo(xx,y+h);
  }
  for(var yy=y+T2+seg;yy<y+h-T2-2;yy+=seg){
    ctx.moveTo(x,yy);ctx.lineTo(x+T2,yy);
    ctx.moveTo(x+w-T2,yy);ctx.lineTo(x+w,yy);
  }
  ctx.stroke();
  ctx.strokeStyle='rgba(0,0,0,0.35)';
  ctx.strokeRect(x+T2,y+T2,w-T2*2,h-T2*2);
}
/* 噴水は3種類。ステージごとにランダム（bed.ftype） */
function fountainGeom(){
  var u=cell*(bed.fs||1);
  return {u:u,x:ox+bed.cx*cell,y:oy+bed.cy*cell};
}
function drawFountain(){
  if(bed.temple){drawTemple();return;}
  var t=bed.ftype||0;
  if(t===1)drawFountainB();

/* A：一段の水盤＋中央の柱 */
function drawFountainA(){
  var g=fountainGeom(),u=g.u,px2=g.x,py2=g.y;
  var base=py2+u*0.40,rx=u*0.52,ry=u*0.20;
  ctx.save();ctx.translate(px2,base+u*0.05);ctx.scale(1,0.30);
  ctx.beginPath();ctx.arc(0,0,rx*1.05,0,7);
  ctx.fillStyle='rgba(0,70,25,0.28)';ctx.fill();ctx.restore();
  ctx.fillStyle=ink(0.30);
  ctx.beginPath();
  ctx.moveTo(px2-rx,base-ry*0.9);ctx.lineTo(px2-rx,base-ry*0.2);
  ctx.quadraticCurveTo(px2,base+ry*0.9,px2+rx,base-ry*0.2);
  ctx.lineTo(px2+rx,base-ry*0.9);ctx.closePath();ctx.fill();
  ctx.save();ctx.translate(px2,base-ry*0.9);ctx.scale(1,ry/rx);
  ctx.beginPath();ctx.arc(0,0,rx,0,7);
  ctx.fillStyle='rgba(95,195,255,0.75)';ctx.fill();
  ctx.strokeStyle=ink(0.6);ctx.lineWidth=Math.max(1,u*0.05)*(rx/ry)*0.25;ctx.stroke();
  var pl=0.5+0.5*Math.sin(now*0.0022);
  ctx.beginPath();ctx.arc(0,0,rx*(0.30+0.30*pl),0,7);
  ctx.strokeStyle='rgba(220,245,255,'+(0.45-0.30*pl)+')';ctx.lineWidth=2;ctx.stroke();
  ctx.restore();
  var top=base-ry*0.9-u*0.52;
  ctx.fillStyle=ink(0.42);
  ctx.fillRect(px2-u*0.07,top,u*0.14,u*0.52);
  ctx.save();ctx.translate(px2,top);ctx.scale(1,0.34);
  ctx.beginPath();ctx.arc(0,0,u*0.26,0,7);
  ctx.fillStyle=ink(0.5);ctx.fill();ctx.restore();
  ctx.fillStyle='rgba(190,235,255,0.95)';
  for(var k=0;k<12;k++){
    var t2=((now*0.00055)+k/12)%1,side=(k%2)?1:-1;
    var xx=px2+side*rx*0.72*t2;
    var yy=top-u*0.42*Math.sin(Math.PI*t2)+(base-ry*0.9-top)*t2*t2;

/* B：三段重ねの噴水。上の皿から縁を伝って落ちる */
function drawFountainB(){
  var g=fountainGeom(),u=g.u,x=g.x,y=g.y;
  var base=y+u*0.42;
  ctx.save();ctx.translate(x,base+u*0.04);ctx.scale(1,0.30);
  ctx.beginPath();ctx.arc(0,0,u*0.58,0,7);
  ctx.fillStyle='rgba(0,70,25,0.28)';ctx.fill();ctx.restore();
  function bowl(cy,r,depth,water){
    ctx.fillStyle=ink(0.32);
    ctx.beginPath();
    ctx.moveTo(x-r,cy);ctx.lineTo(x-r*0.72,cy+depth);
    ctx.lineTo(x+r*0.72,cy+depth);ctx.lineTo(x+r,cy);
    ctx.closePath();ctx.fill();
    ctx.save();ctx.translate(x,cy);ctx.scale(1,0.34);
    ctx.beginPath();ctx.arc(0,0,r,0,7);
    ctx.fillStyle=water?'rgba(95,195,255,0.8)':ink(0.45);ctx.fill();
    ctx.strokeStyle=ink(0.6);ctx.lineWidth=Math.max(1,u*0.04)*2.9;ctx.stroke();
    ctx.restore();
  }
  bowl(base-u*0.10,u*0.54,u*0.14,true);
  ctx.fillStyle=ink(0.42);ctx.fillRect(x-u*0.06,base-u*0.44,u*0.12,u*0.34);
  bowl(base-u*0.44,u*0.32,u*0.10,true);
  ctx.fillStyle=ink(0.42);ctx.fillRect(x-u*0.045,base-u*0.70,u*0.09,u*0.26);
  bowl(base-u*0.70,u*0.19,u*0.07,true);
  /* 縁からのしたたり */
  ctx.fillStyle='rgba(190,235,255,0.9)';
  for(var k=0;k<10;k++){
    var t=((now*0.0006)+k/10)%1;
    var lv=(k%2)?1:0;
    var r0=lv?u*0.19:u*0.32,y0=lv?base-u*0.70:base-u*0.44;
    var y1=lv?base-u*0.44:base-u*0.10;
    var side=(k<5)?-1:1;
    ctx.beginPath();
    ctx.arc(x+side*r0*0.92,y0+(y1-y0)*t,u*0.045*(1-t*0.3),0,7);

  var tp=base-u*0.70;
  ctx.strokeStyle='rgba(190,235,255,0.75)';ctx.lineWidth=Math.max(1,u*0.045);
  ctx.beginPath();ctx.moveTo(x,tp);ctx.lineTo(x,tp-u*0.22);ctx.stroke();
  for(k=0;k<6;k++){
    var t3=((now*0.0007)+k/6)%1;

    ctx.arc(x+((k%2)?1:-1)*u*0.16*t3,tp-u*0.24*Math.sin(Math.PI*t3),u*0.04,0,7);
    ctx.fill();

}
/* C：石像から左右に水を吐く噴水 */
function drawFountainC(){
  var g=fountainGeom(),u=g.u,x=g.x,y=g.y;
  var base=y+u*0.42,rx=u*0.56,ry=u*0.21;
  ctx.save();ctx.translate(x,base+u*0.05);ctx.scale(1,0.30);
  ctx.beginPath();ctx.arc(0,0,rx*1.04,0,7);
  ctx.fillStyle='rgba(0,70,25,0.28)';ctx.fill();ctx.restore();
  /* 八角形の水盤 */
  ctx.fillStyle=ink(0.30);
  ctx.beginPath();
  ctx.moveTo(x-rx,base-ry*0.85);ctx.lineTo(x-rx*0.7,base+ry*0.25);
  ctx.lineTo(x+rx*0.7,base+ry*0.25);ctx.lineTo(x+rx,base-ry*0.85);
  ctx.closePath();ctx.fill();
  ctx.save();ctx.translate(x,base-ry*0.85);ctx.scale(1,ry/rx);
  ctx.beginPath();
  for(var q=0;q<8;q++){
    var a=q/8*Math.PI*2+Math.PI/8;
    var xx=Math.cos(a)*rx,yy=Math.sin(a)*rx;
    if(q)ctx.lineTo(xx,yy);else ctx.moveTo(xx,yy);
  }
  ctx.closePath();
  ctx.fillStyle='rgba(95,195,255,0.75)';ctx.fill();
  ctx.strokeStyle=ink(0.6);ctx.lineWidth=Math.max(1,u*0.05)*(rx/ry)*0.22;ctx.stroke();
  ctx.restore();
  /* 台座と石像 */
  var top=base-ry*0.85-u*0.30;
  ctx.fillStyle=ink(0.45);
  ctx.beginPath();
  ctx.moveTo(x-u*0.16,base-ry*0.85);ctx.lineTo(x-u*0.10,top);
  ctx.lineTo(x+u*0.10,top);ctx.lineTo(x+u*0.16,base-ry*0.85);
  ctx.closePath();ctx.fill();
  ctx.fillStyle=ink(0.55);
  ctx.beginPath();ctx.arc(x,top-u*0.16,u*0.15,0,7);ctx.fill();
  ctx.fillRect(x-u*0.03,top-u*0.34,u*0.06,u*0.18);
  ctx.save();ctx.translate(x,top-u*0.36);ctx.scale(1,0.4);
  ctx.beginPath();ctx.arc(0,0,u*0.10,0,7);ctx.fillStyle=ink(0.6);ctx.fill();ctx.restore();
  /* 左右に吐く水 */
  ctx.fillStyle='rgba(190,235,255,0.95)';
  for(var k=0;k<14;k++){
    var t=((now*0.0006)+k/14)%1;
    var side=(k%2)?1:-1;
    var xx2=x+side*(u*0.12+u*0.40*t);
    var yy2=(top-u*0.16)-u*0.16*Math.sin(Math.PI*t)+(base-ry*0.85-(top-u*0.16))*t*t;
    ctx.beginPath();ctx.arc(xx2,yy2,u*0.05*(1-t*0.35),0,7);ctx.fill();
  }
}
/* 赤煉瓦の広場に立つ白い馬と干し草（ステージ9） */
function drawTemple(){
  var bw2=(bed.c1-bed.c0+1)*cell,bh2=(bed.r1-bed.r0+1)*cell;
  var bx0=ox+bed.c0*cell,by0=oy+bed.r0*cell;
  var u=Math.min(bw2,bh2)*0.62;
  var x=ox+bed.cx*cell,cy=oy+bed.cy*cell;
  var T2=Math.max(2,Math.max(1.3,cell*0.07)*2);
  var inTop=by0+T2,inBot=by0+bh2-T2;
  /* 馬は手前（下）、干し草は奥（上）に置く */
  var g=Math.max(inTop+u*1.06,Math.min(cy+u*0.62,inBot-cell*0.18));
  /* うなずき：基本は真っ直ぐ、たまに少し上下 */
  var nod=Math.sin(now*0.00045)*0.62+Math.sin(now*0.00017)*0.38;
  var hy=nod*u*0.13, tip=nod*u*0.06;
  var sway=Math.sin(now*0.0016)*u*0.02;
  var BODY='#f4f1e8',SHADE='#d5cfbf',HAIR='#7a5230',HAIR2='#5d3d24';
  /* 影 */
  ctx.save();ctx.translate(x,g+u*0.02);ctx.scale(1,0.22);
  ctx.beginPath();ctx.arc(0,0,u*0.46,0,7);
  ctx.fillStyle='rgba(0,0,0,0.30)';ctx.fill();ctx.restore();
  /* 後ろ脚 */
  ctx.fillStyle=SHADE;
  ctx.fillRect(x-u*0.30,g-u*0.30,u*0.09,u*0.30);
  ctx.fillRect(x+u*0.06,g-u*0.30,u*0.09,u*0.30);
  /* 尻尾 */
  ctx.strokeStyle=HAIR;ctx.lineWidth=Math.max(2,u*0.08);ctx.lineCap='round';
  ctx.beginPath();
  ctx.moveTo(x-u*0.33,g-u*0.50);
  ctx.quadraticCurveTo(x-u*0.52,g-u*0.34-sway*2,x-u*0.45,g-u*0.08);
  ctx.stroke();
  /* 胴 */
  ctx.fillStyle=BODY;
  ctx.beginPath();
  if(ctx.ellipse)ctx.ellipse(x-u*0.02,g-u*0.42,u*0.34,u*0.19,0,0,7);
  else ctx.arc(x-u*0.02,g-u*0.42,u*0.28,0,7);
  ctx.fill();
  /* 前脚 */
  ctx.fillStyle=BODY;
  ctx.fillRect(x-u*0.24,g-u*0.34,u*0.10,u*0.34);
  ctx.fillRect(x+u*0.16,g-u*0.34,u*0.10,u*0.34);
  ctx.fillStyle=SHADE;
  ctx.fillRect(x-u*0.24,g-u*0.06,u*0.10,u*0.06);
  ctx.fillRect(x+u*0.16,g-u*0.06,u*0.10,u*0.06);
  /* 首 */
  ctx.fillStyle=BODY;
  ctx.beginPath();
  ctx.moveTo(x+u*0.16,g-u*0.54);
  ctx.lineTo(x+u*0.38,g-u*0.86+hy);
  ctx.lineTo(x+u*0.50,g-u*0.80+hy);
  ctx.lineTo(x+u*0.30,g-u*0.42);
  ctx.closePath();ctx.fill();
  /* 頭（少し上下する） */
  ctx.beginPath();
  ctx.moveTo(x+u*0.37,g-u*0.88+hy);
  ctx.lineTo(x+u*0.62,g-u*0.93+hy+tip);
  ctx.lineTo(x+u*0.66,g-u*0.83+hy+tip);
  ctx.lineTo(x+u*0.41,g-u*0.76+hy);
  ctx.closePath();ctx.fill();
  ctx.fillStyle=SHADE;                       // 鼻づら
  ctx.beginPath();
  ctx.moveTo(x+u*0.57,g-u*0.92+hy+tip);
  ctx.lineTo(x+u*0.66,g-u*0.90+hy+tip);
  ctx.lineTo(x+u*0.66,g-u*0.83+hy+tip);
  ctx.lineTo(x+u*0.57,g-u*0.82+hy+tip);
  ctx.closePath();ctx.fill();
  /* 耳 */
  ctx.fillStyle=BODY;
  ctx.beginPath();
  ctx.moveTo(x+u*0.39,g-u*0.90+hy);
  ctx.lineTo(x+u*0.42,g-u*1.00+hy);
  ctx.lineTo(x+u*0.46,g-u*0.89+hy);
  ctx.closePath();ctx.fill();
  /* たてがみ */
  ctx.fillStyle=HAIR;
  ctx.beginPath();
  ctx.moveTo(x+u*0.20,g-u*0.58);
  ctx.lineTo(x+u*0.41,g-u*0.92+hy);
  ctx.lineTo(x+u*0.34,g-u*0.95+hy);
  ctx.lineTo(x+u*0.13,g-u*0.60);
  ctx.closePath();ctx.fill();
  ctx.strokeStyle=HAIR2;ctx.lineWidth=Math.max(1,u*0.02);
  ctx.beginPath();
  ctx.moveTo(x+u*0.17,g-u*0.59);ctx.lineTo(x+u*0.37,g-u*0.93+hy);
  ctx.stroke();
  /* 目 */
  ctx.fillStyle='#2a2119';
  ctx.beginPath();ctx.arc(x+u*0.49,g-u*0.86+hy+tip*0.6,u*0.028,0,7);ctx.fill();
  /* 干し草 */
  var hr=u*0.26;
  var hayX=Math.max(bx0+T2+hr*1.1,Math.min(bx0+bw2-T2-hr*1.1,x-u*0.50));
  var hayY=Math.max(inTop+hr*1.0,Math.min(g-u*1.05,cy-u*0.55));
  drawHay(hayX,hayY,hr);
}
function drawHay(hx,hy2,r){
  ctx.save();ctx.translate(hx,hy2);ctx.scale(1,0.24);
  ctx.beginPath();ctx.arc(0,0,r*0.95,0,7);
  ctx.fillStyle='rgba(0,0,0,0.25)';ctx.fill();ctx.restore();
  ctx.fillStyle='#d8ab4a';
  ctx.beginPath();
  ctx.moveTo(hx-r,hy2);
  ctx.quadraticCurveTo(hx-r*0.7,hy2-r*0.95,hx,hy2-r*0.80);
  ctx.quadraticCurveTo(hx+r*0.7,hy2-r*0.95,hx+r,hy2);
  ctx.closePath();ctx.fill();
  ctx.strokeStyle='#b98a2e';ctx.lineWidth=Math.max(1,r*0.07);ctx.lineCap='round';
  ctx.beginPath();
  for(var k=0;k<7;k++){
    var t=k/6,sx=hx-r*0.9+r*1.8*t;
    ctx.moveTo(sx,hy2-r*0.05);
    ctx.lineTo(sx+r*(0.12-0.24*((k%3)/2)),hy2-r*(0.45+0.3*Math.abs(Math.sin(k*1.7))));
  }
  ctx.stroke();
  ctx.strokeStyle='#f0cd82';ctx.lineWidth=Math.max(1,r*0.05);
  ctx.beginPath();
  ctx.moveTo(hx-r*0.55,hy2-r*0.25);ctx.lineTo(hx-r*0.2,hy2-r*0.72);
  ctx.moveTo(hx+r*0.25,hy2-r*0.30);ctx.lineTo(hx+r*0.62,hy2-r*0.60);
  ctx.stroke();
}
function drawHoles(){
  var i;
  for(i=0;i<holes.length;i++){
    var h=holes[i],p=ctr(h.r,h.c),R=cell*0.42;
    if(h.open){
      var k=Math.min(1,(now-h.open)/350);
      ctx.save();ctx.translate(p.x,p.y);ctx.scale(1,0.60);
      ctx.beginPath();ctx.arc(0,0,R,0,7);
      ctx.fillStyle='rgba(0,0,0,0.85)';ctx.fill();
      ctx.strokeStyle=ink(0.55);ctx.lineWidth=Math.max(1,cell*0.05);ctx.stroke();
      ctx.restore();
      ctx.save();ctx.translate(p.x+R*1.05*k,p.y-R*0.30*k);ctx.scale(1,0.60);
      ctx.beginPath();ctx.arc(0,0,R*0.9,0,7);
      ctx.fillStyle=ink(0.30);ctx.fill();
      ctx.strokeStyle=ink(0.6);ctx.lineWidth=1.2;ctx.stroke();
      ctx.restore();
    }else{
      ctx.save();ctx.translate(p.x,p.y);ctx.scale(1,0.60);
      ctx.beginPath();ctx.arc(0,0,R,0,7);
      ctx.fillStyle=ink(0.28);ctx.fill();
      ctx.strokeStyle=ink(0.6);ctx.lineWidth=Math.max(1,cell*0.05);ctx.stroke();

      ctx.restore();

  }
  for(i=holeFx.length-1;i>=0;i--){

    ctx.beginPath();ctx.arc(f.x,f.y+cell*0.5*t,cell*(0.35-0.25*t),0,7);ctx.stroke();

function drawCoins(){
  for(var i=0;i<coins.length;i++){
    var co=coins[i],p=ctr(co.r,co.c);
    if(co.got){
      var t=(now-co.got)/450;
      if(t>1)continue;
      ctx.globalAlpha=1-t;
      ctx.strokeStyle='#ffd24a';ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(p.x,p.y-cell*0.5*t,cell*0.22*(1+t),0,7);ctx.stroke();

function drawBoy(x,y,h,face,cheer){

    ctx.fillRect(x-w*0.42,y+h*0.30,w*0.34,h*0.16);
    ctx.fillRect(x+w*0.08,y+h*0.30,w*0.34,h*0.16);

  ctx.fillStyle=BOY_SHIRT;

  ctx.fillRect(x-w*(side?0.34:0.5),y-h*0.22,w*(side?0.68:1),h*0.20);
  /* 青いオーバーオール */
  ctx.fillStyle=BOY_OVER;
  ctx.fillRect(x-w*(side?0.34:0.5),y-h*0.04,w*(side?0.68:1),h*0.36);
  ctx.strokeStyle=BOY_OVER;ctx.lineWidth=Math.max(1,h*0.075);ctx.lineCap='butt';
  ctx.beginPath();
  if(back){
    ctx.moveTo(x-w*0.32,y-h*0.24);ctx.lineTo(x+w*0.28,y-h*0.03);
    ctx.moveTo(x+w*0.32,y-h*0.24);ctx.lineTo(x-w*0.28,y-h*0.03);
  }else if(side){
    ctx.moveTo(x+f*w*0.06,y-h*0.24);ctx.lineTo(x+f*w*0.06,y-h*0.03);
  }else{
    ctx.moveTo(x-w*0.26,y-h*0.24);ctx.lineTo(x-w*0.26,y-h*0.03);
    ctx.moveTo(x+w*0.26,y-h*0.24);ctx.lineTo(x+w*0.26,y-h*0.03);
  }
  ctx.stroke();
  /* 頭：後ろ向きは髪、それ以外は顔 */
  ctx.fillStyle=back?BOY_HAIR:SKIN;
  ctx.beginPath();ctx.arc(x,hy,hr,0,7);ctx.fill();
  if(side){
    ctx.fillStyle=BOY_HAIR;
    ctx.beginPath();ctx.arc(x-f*hr*0.42,hy+hr*0.10,hr*0.80,0,7);ctx.fill();
    ctx.fillStyle=SKIN;
    ctx.beginPath();ctx.arc(x-f*hr*0.05,hy+hr*0.18,hr*0.20,0,7);ctx.fill();  // 耳
  }
  ctx.fillStyle='#222';
  var er=Math.max(0.7,hr*0.16);
  if(face==='s'){
    ctx.beginPath();ctx.arc(x-hr*0.38,hy+hr*0.10,er,0,7);ctx.fill();
    ctx.beginPath();ctx.arc(x+hr*0.38,hy+hr*0.10,er,0,7);ctx.fill();
  }else if(side){
    ctx.beginPath();ctx.arc(x+f*hr*0.42,hy+hr*0.02,er,0,7);ctx.fill();
  }
  /* 茶色いキャップ */
  ctx.fillStyle=BOY_CAP;
  ctx.beginPath();ctx.arc(x,hy-h*0.03,hr*1.04,Math.PI,0);ctx.fill();
  ctx.fillRect(x-hr*1.04,hy-h*0.045,hr*2.08,h*0.045);
  if(face==='s') ctx.fillRect(x-hr*1.10,hy-h*0.005,hr*2.20,h*0.05);
  else if(side)  ctx.fillRect(f>0?x+hr*0.55:x-hr*1.70,hy-h*0.02,hr*1.15,h*0.045);
}
function drawGirl(x,y,h,scale,face,cheer){
  h=h*(scale===undefined?1:scale);
  if(h<=0.5)return;
  face=face||'s';
  if(cheer)face='s';
  var w=h*0.5,back=(face==='n'),side=(face==='w'||face==='e'),f=(face==='w')?-1:1;
  if(cheer){back=false;side=false;}
  var hy=y-h*0.40,hr=h*0.19;
  ctx.fillStyle=dressOv||GIRL_DRESS;             // ドレス（衣装の指定があればそれを使う）
  ctx.beginPath();
  ctx.moveTo(x-w*(side?0.48:0.66),y+h*0.40);
  ctx.lineTo(x-w*(side?0.22:0.30),y-h*0.20);
  ctx.lineTo(x+w*(side?0.22:0.30),y-h*0.20);
  ctx.lineTo(x+w*(side?0.48:0.66),y+h*0.40);
  ctx.closePath();ctx.fill();
  ctx.fillStyle=SKIN;
  if(cheer===2||cheer===3){                    // 片腕を胸の前へ、もう片腕は下ろす
    var up=(cheer===2)?1:-1,dn=-up;
    ctx.save();ctx.translate(x+up*w*0.40,y-h*0.10);ctx.rotate(-up*0.75);
    ctx.fillRect(-w*0.13,-h*0.30,w*0.26,h*0.36);ctx.restore();
    ctx.beginPath();ctx.arc(x+up*w*0.14,y-h*0.34,h*0.082,0,7);ctx.fill();
    ctx.save();ctx.translate(x+dn*w*0.52,y-h*0.08);ctx.rotate(dn*0.30);
    ctx.fillRect(-w*0.13,-h*0.04,w*0.26,h*0.32);ctx.restore();
    ctx.beginPath();ctx.arc(x+dn*w*0.62,y+h*0.22,h*0.075,0,7);ctx.fill();
  }
  else if(cheer){                              // 両手を上げて万歳
    ctx.save();ctx.translate(x-w*0.46,y-h*0.14);ctx.rotate(0.85);
    ctx.fillRect(-w*0.13,-h*0.26,w*0.26,h*0.34);ctx.restore();
    ctx.save();ctx.translate(x+w*0.46,y-h*0.14);ctx.rotate(-0.85);
    ctx.fillRect(-w*0.13,-h*0.26,w*0.26,h*0.34);ctx.restore();
    ctx.beginPath();ctx.arc(x-w*0.72,y-h*0.44,h*0.085,0,7);ctx.fill();
    ctx.beginPath();ctx.arc(x+w*0.72,y-h*0.44,h*0.085,0,7);ctx.fill();
  }
  else if(side) ctx.fillRect(x+f*w*0.22-w*0.13,y-h*0.16,w*0.26,h*0.26);
  else{
    ctx.fillRect(x-w*0.62,y-h*0.16,w*0.26,h*0.26);
    ctx.fillRect(x+w*0.36,y-h*0.16,w*0.26,h*0.26);
  }
  ctx.fillStyle=back?GIRL_HAIR:SKIN;
  ctx.beginPath();ctx.arc(x,hy,hr,0,7);ctx.fill();
  ctx.fillStyle=GIRL_HAIR;
  if(side){
    /* 横向き：頭頂から後頭部まで髪で覆う（地肌が出ないように） */
    ctx.beginPath();ctx.arc(x,hy-hr*0.06,hr*1.10,Math.PI*0.88,Math.PI*2.12);ctx.fill();
    ctx.beginPath();ctx.arc(x-f*hr*0.42,hy+hr*0.04,hr*0.96,0,7);ctx.fill();
    ctx.fillRect(x-f*hr*1.05-hr*0.25,hy-hr*0.35,hr*0.5,hr*1.5);
    if(hairOv===1){                       /* ツインテール */
      ctx.beginPath();ctx.arc(x-f*hr*1.28,hy+hr*0.55,hr*0.5,0,7);ctx.fill();
      ctx.fillRect(x-f*hr*1.42-hr*0.28,hy+hr*0.55,hr*0.56,hr*1.4);
    }else if(hairOv===2){                 /* ロング */
      ctx.fillRect(x-f*hr*0.95-hr*0.38,hy-hr*0.2,hr*0.76,hr*3.3);
    }
  }else{
    ctx.beginPath();ctx.arc(x,hy-h*0.03,hr*1.12,Math.PI*0.95,Math.PI*2.05);ctx.fill();
    if(hairOv===1){                       /* ツインテール */
      ctx.fillRect(x-hr*1.15,hy-hr*0.5,hr*0.40,hr*1.0);
      ctx.fillRect(x+hr*0.75,hy-hr*0.5,hr*0.40,hr*1.0);
      ctx.beginPath();ctx.arc(x-hr*1.32,hy+hr*0.62,hr*0.52,0,7);ctx.fill();
      ctx.beginPath();ctx.arc(x+hr*1.32,hy+hr*0.62,hr*0.52,0,7);ctx.fill();
      ctx.fillRect(x-hr*1.62,hy+hr*0.62,hr*0.6,hr*1.5);
      ctx.fillRect(x+hr*1.02,hy+hr*0.62,hr*0.6,hr*1.5);
    }else if(hairOv===2){                 /* ロングストレート */
      ctx.fillRect(x-hr*1.28,hy-hr*0.5,hr*0.52,hr*3.6);
      ctx.fillRect(x+hr*0.76,hy-hr*0.5,hr*0.52,hr*3.6);
      ctx.beginPath();ctx.arc(x,hy+hr*0.2,hr*1.02,0,Math.PI);ctx.fill();
    }else{                                /* ボブ */
      ctx.fillRect(x-hr*1.2,hy-hr*0.5,hr*0.42,hr*1.6);
      ctx.fillRect(x+hr*0.78,hy-hr*0.5,hr*0.42,hr*1.6);
    }
  }
  if(!back){
    ctx.fillStyle='#222';
    var er=Math.max(0.7,hr*0.16);
    if(side){ctx.beginPath();ctx.arc(x+f*hr*0.40,hy+hr*0.02,er,0,7);ctx.fill();}
    else{
      ctx.beginPath();ctx.arc(x-hr*0.36,hy+hr*0.10,er,0,7);ctx.fill();
      ctx.beginPath();ctx.arc(x+hr*0.36,hy+hr*0.10,er,0,7);ctx.fill();
    }
  }
}
function bubble(x,y,txt,col){
  var sc=2,tw=txt.length*22,th=26,c=null;
  try{c=pixelCanvas(txt,'#111111',1);tw=c.width*sc;th=c.height*sc;}catch(e){}
  var w=tw+14,h=th+8;
  var bx=Math.max(4,Math.min(W-w-4,x-w/2)),by=Math.max(4,y-h-8);
  rrect(bx,by,w,h,6);
  ctx.fillStyle='#ffffff';ctx.fill();
  ctx.strokeStyle=col||'#000';ctx.lineWidth=1.6;ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x-5,by+h-1);ctx.lineTo(x,by+h+8);ctx.lineTo(x+5,by+h-1);
  ctx.closePath();ctx.fillStyle='#ffffff';ctx.fill();
  ctx.strokeStyle=col||'#000';ctx.lineWidth=1.4;
  ctx.beginPath();ctx.moveTo(x-5,by+h-1);ctx.lineTo(x,by+h+8);ctx.lineTo(x+5,by+h-1);ctx.stroke();

}

function drawPad(){
  /* 十字ボタン：地色は常に黒、矢印は白、押している間は PANTONE 394 C */
  for(var k in dpad){
    var b=dpad[k],on=(held===k);
    rrect(b.x,b.y,b.w,b.h,b.w*0.26);
    ctx.fillStyle=on?PAD_ON:PAD_BG;ctx.fill();
    ctx.strokeStyle=on?PAD_ON:ink(0.34);ctx.lineWidth=1.2;ctx.stroke();
    var cx=b.x+b.w/2,cy=b.y+b.h/2,a=b.w*0.2;
    ctx.beginPath();
    if(k==='n'){ctx.moveTo(cx,cy-a);ctx.lineTo(cx+a,cy+a*0.7);ctx.lineTo(cx-a,cy+a*0.7);}
    if(k==='s'){ctx.moveTo(cx,cy+a);ctx.lineTo(cx+a,cy-a*0.7);ctx.lineTo(cx-a,cy-a*0.7);}
    if(k==='w'){ctx.moveTo(cx-a,cy);ctx.lineTo(cx+a*0.7,cy+a);ctx.lineTo(cx+a*0.7,cy-a);}
    if(k==='e'){ctx.moveTo(cx+a,cy);ctx.lineTo(cx-a*0.7,cy+a);ctx.lineTo(cx-a*0.7,cy-a);}
    ctx.closePath();
    ctx.fillStyle=PAD_ARROW;ctx.fill();
    if(on){ctx.strokeStyle='rgba(0,0,0,0.55)';ctx.lineWidth=1;ctx.stroke();}
  }

  /* ツルハシ／餌：角丸の横長ボタン（縦1：横5） */
  drawPill(pickBtn,'PICKAXE',picks,PICK_C,aiming,(picks>0||canBuy('pick')),'pick');
  drawPill(lureBtn,'82HASHI',lureStock,LURE_C,lurePressed&&lureStock>0,(lureStock>0),'feed');
  drawPill(bombBtn,'M-BOMB',hasBomb?1:0,BOMB_C,!!fuse,(hasBomb||canBuy('bomb')),'bomb');
  drawPill(coinBtn,'COIN',wallet,'#f2b705',coinPressed,(wallet>0),'coin');
}
function drawPill(b,label,count,icon,on,act,kind){
  if(!act)return;                       // まだ使えない道具は表示しない
  var r=b.h*0.5,cx0=b.x+b.w,cy0=b.y+b.h*0.5;
  ctx.globalAlpha=1;
  rrect(b.x,b.y,b.w,b.h,r);
  ctx.fillStyle=on?icon:BTN_BG;ctx.fill();
  ctx.strokeStyle=on?icon:rgba(BTN_TX,0.35);ctx.lineWidth=on?2:1.1;ctx.stroke();
  var fg=on?BTN_BG:BTN_TX, ic=on?BTN_BG:icon;
  ctx.fillStyle=fg;
  bt(label,b.x+b.h*0.42,cy0+7,2,'left',0);
  var ix=b.x+b.w*0.70,iy=cy0,sz=b.h*0.30;
  if(kind==='coin'){
    ctx.save();ctx.translate(ix,iy);ctx.scale(0.55,1);
    ctx.beginPath();ctx.arc(0,0,sz*1.0,0,7);
    ctx.fillStyle=ic;ctx.fill();
    ctx.strokeStyle=on?BTN_BG:'#ffe27a';ctx.lineWidth=1.4;ctx.stroke();
    ctx.beginPath();ctx.arc(0,0,sz*0.55,0,7);
    ctx.strokeStyle=on?BTN_BG:'#fff3c0';ctx.lineWidth=1.1;ctx.stroke();
    ctx.restore();
  }else if(kind==='bomb'){
    ctx.beginPath();ctx.arc(ix,iy+sz*0.15,sz*0.95,0,7);
    ctx.fillStyle=ic;ctx.fill();
    ctx.strokeStyle=ic;ctx.lineWidth=Math.max(1.4,b.h*0.07);ctx.lineCap='round';
    ctx.beginPath();
    ctx.moveTo(ix+sz*0.45,iy-sz*0.55);
    ctx.quadraticCurveTo(ix+sz*1.1,iy-sz*0.9,ix+sz*0.85,iy-sz*1.5);
    ctx.stroke();
  }else if(kind==='pick'){
    ctx.strokeStyle=ic;ctx.lineWidth=Math.max(1.7,b.h*0.09);ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(ix-sz*0.6,iy+sz*1.05);ctx.lineTo(ix+sz*0.7,iy-sz*0.95);ctx.stroke();
    ctx.beginPath();ctx.arc(ix+sz*0.2,iy-sz*0.38,sz*1.15,Math.PI*1.13,Math.PI*1.97);ctx.stroke();
  }else{
    blob(ix,iy,sz*1.05,now*0.6,ic,on?rgba(BTN_BG,0.7):rgba(icon,0.55));
  }
  ctx.fillStyle=fg;
  bt(String(count),cx0-b.h*0.42,cy0+7,2,'right',0);
  ctx.globalAlpha=1;
}
function drawHUD(){

  bt('SCORE',W-pad,16,2,'right',1);

  bt(('0'+stage).slice(-2),pad,36,3,'left',0);
  bt(String(total+score),W-pad,36,3,'right',0);
  var shown=Math.max(LIVES,lives);
  var lx=W*0.5-((shown-1)*9)/2;
  ctx.fillStyle=ink(0.45);
  bt('LIFE',W*0.5,16,2,'center',1);
  for(var li=0;li<shown;li++){
    ctx.beginPath();ctx.arc(lx+li*9,31,3.4,0,7);
    ctx.fillStyle=(li<lives)?YEL:ink(0.18);ctx.fill();
  }
  if(savedGirls<idolNext){
    ctx.fillStyle=rgba(GIRL_DRESS,0.85);
    bt('W '+savedGirls+'/'+idolNext,W*0.5+34,44,1,'left',1);
  }
  var bw=W-pad*2,by=42,r=tBonus/TIME_MAX;
  ctx.fillStyle=ink(0.14);ctx.fillRect(pad,by,bw,2);
  ctx.fillStyle=r>0.3?ink(1):RED;ctx.fillRect(pad,by,bw*r,2);

  var yy=Math.min(padTop-7,oy+ROWS*cell+cell/3+22);
  rrect(PAD,yy-15,W-PAD*2,21,5);
  ctx.fillStyle='rgba(0,0,0,0.62)';ctx.fill();

  if(state==='tally'){
    var tp=Math.min(1,(now-tallyT)/TALLY_MS);
    tv=Math.round(tBonus*(1-Math.pow(tp,1.9)));

    ctx.fillStyle='#ffd400';
    bt('+'+gained,pad+10,yy-18-Math.pow(tp,1.9)*10,2,'left',0);

    }else if(!amoebaOn){

      var gap=dots.length-1-amoeba;

      bt('X'+amoebaSpeed().toFixed(1)+' D'+gap.toFixed(0),W-pad,yy,2,'right',0);
    }

function helpIcon(kind,x,y,S){
  /* 説明書の小さな絵 */
  if(kind==='lyausken'){drawBoy(x,y,S*0.95,'s');return;}
  if(kind==='watoner'){drawGirl(x,y,S*0.90,1,'s');return;}
  if(kind==='numelin'){
    blob(x,y-S*0.1,S*0.36,now,'rgba(255,60,110,0.9)','rgba(255,150,180,0.9)');
    ctx.beginPath();ctx.arc(x,y-S*0.1,S*0.10,0,7);
    ctx.fillStyle='rgba(255,212,0,0.8)';ctx.fill();return;
  }
  if(kind==='waiting'){
    blob(x,y-S*0.1,S*0.34,now*0.7,'rgba(150,80,255,0.9)','rgba(200,160,255,0.9)');return;
  }
  if(kind==='trajectory'){
    ctx.fillStyle=YEL;
    for(var i=0;i<3;i++){
      ctx.beginPath();ctx.arc(x-S*0.28+i*S*0.28,y-S*0.1,S*0.10,0,7);ctx.fill();
    }
    return;
  }
  if(kind==='coin'){
    ctx.save();ctx.translate(x,y-S*0.1);ctx.scale(0.6,1);
    ctx.beginPath();ctx.arc(0,0,S*0.32,0,7);ctx.fillStyle='#f2b705';ctx.fill();
    ctx.strokeStyle='#ffe27a';ctx.lineWidth=1.5;ctx.stroke();ctx.restore();return;
  }
  if(kind==='pick'){
    ctx.strokeStyle=PICK_C;ctx.lineWidth=Math.max(2,S*0.12);ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(x+S*0.18,y-S*0.42);ctx.lineTo(x-S*0.05,y+S*0.28);ctx.stroke();
    ctx.beginPath();ctx.moveTo(x-S*0.34,y-S*0.20);
    ctx.quadraticCurveTo(x+S*0.02,y-S*0.46,x+S*0.36,y-S*0.16);ctx.stroke();return;
  }
  if(kind==='bomb'){
    ctx.beginPath();ctx.arc(x,y,S*0.30,0,7);
    ctx.fillStyle='#2a2a33';ctx.fill();
    ctx.strokeStyle=ink(0.7);ctx.lineWidth=1.4;ctx.stroke();
    ctx.strokeStyle=BOMB_C;ctx.lineWidth=Math.max(1.4,S*0.08);
    ctx.beginPath();ctx.moveTo(x+S*0.14,y-S*0.24);
    ctx.quadraticCurveTo(x+S*0.36,y-S*0.40,x+S*0.28,y-S*0.56);ctx.stroke();
    ctx.beginPath();ctx.arc(x+S*0.28,y-S*0.58,S*0.10,0,7);
    ctx.fillStyle=BOMB_C;ctx.fill();return;
  }
  if(kind==='yatsu'){
    blob(x,y-S*0.08,S*0.28,now*1.4,'rgba(255,138,224,0.95)','rgba(255,200,240,0.9)');return;
  }
  if(kind==='hole'){
    ctx.save();ctx.translate(x,y-S*0.05);ctx.scale(1,0.55);
    ctx.beginPath();ctx.arc(0,0,S*0.34,0,7);
    ctx.fillStyle='rgba(0,0,0,0.85)';ctx.fill();
    ctx.strokeStyle=ink(0.6);ctx.lineWidth=2;ctx.stroke();ctx.restore();
    ctx.save();ctx.translate(x+S*0.34,y-S*0.22);ctx.scale(1,0.55);
    ctx.beginPath();ctx.arc(0,0,S*0.30,0,7);
    ctx.fillStyle=ink(0.32);ctx.fill();
    ctx.strokeStyle=ink(0.6);ctx.lineWidth=1.2;ctx.stroke();ctx.restore();return;
  }
  if(kind==='heart'){drawHeart(x,y-S*0.05,S*0.30,'#ff3b6b',1);return;}
}
