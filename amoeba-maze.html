function hexRGB(h){h=h.replace('#','');var n=parseInt(h,16);return [(n>>16)&255,(n>>8)&255,n&255];}
function ink(a){return 'rgba('+INKRGB[0]+','+INKRGB[1]+','+INKRGB[2]+','+a+')';}
function rgba(hex,a){var c=hexRGB(hex);return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')';}
function shade(hex,f){                 // f>0で明るく、f<0で暗く
  var c=hexRGB(hex),o='#';
  for(var i=0;i<3;i++){
    var v=f>=0 ? c[i]+(255-c[i])*f : c[i]*(1+f);
    v=Math.max(0,Math.min(255,Math.round(v)));
    o+=('0'+v.toString(16)).slice(-2);
  }
  return o;
}

  if(!audioOK())return;
  try{
    var o=ac.createOscillator(),g=ac.createGain();
    o.type=type||'square';o.frequency.value=f;
    g.gain.setValueAtTime(v||0.05,ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001,ac.currentTime+d);
    o.connect(g);g.connect(mg);o.start();o.stop(ac.currentTime+d);
  }catch(e){}
}

function noiseBurst(dur,vol,f0,f1){
  if(!audioOK())return;
  try{
    var n=Math.max(1,Math.floor(ac.sampleRate*dur));
    var buf=ac.createBuffer(1,n,ac.sampleRate),d=buf.getChannelData(0);
    for(var i=0;i<n;i++){var e=1-i/n;d[i]=(Math.random()*2-1)*e*e;}
    var src=ac.createBufferSource();src.buffer=buf;
    var flt=ac.createBiquadFilter();flt.type='lowpass';
    flt.frequency.setValueAtTime(f0,ac.currentTime);
    flt.frequency.exponentialRampToValueAtTime(f1,ac.currentTime+dur);
    var g=ac.createGain();
    g.gain.setValueAtTime(vol,ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001,ac.currentTime+dur);
    src.connect(flt);flt.connect(g);g.connect(mg);src.start();
  }catch(e){}
}

/* 2曲目：ブラックミュージック風のグルーヴ（BPM104・跳ねる16分） */
function grooveTrack(V){
  var BPM=104,B=60/BPM,S16=B/4,SW=S16*0.22;   // SW=はねる分のずれ
  function sw(i){return i*S16+((i%2)?SW:0);}  // 裏の16分を後ろへ
  var bars=6,i2,b2;
  /* Dm7 - G7 - Cmaj7 - A7 の循環 */
  var bassPat=[
    [0,3,5,7,10,7,5,3],   // 度数（半音）
    [0,3,5,7,10,7,5,3],
    [0,4,7,10,7,4,0,-2],
    [0,3,7,10,7,3,0,-2]
  ];
  var rootHz=[73.42,98.00,65.41,110.00];       // D2 G2 C2 A2
  var chord=[[293.66,349.23,440.00],[293.66,349.23,392.00],
             [329.63,392.00,493.88],[277.18,329.63,440.00]];
  var mel=[[7,5,3,0,-2,0,3,5],[10,7,5,3,5,7,10,12]];
  for(b2=0;b2<bars;b2++){
    var bt0=b2*4*B,ci=b2%4;
    /* ドラム：1と2裏にキック、2と4にスネア、16分のハイハット */
    V.tone('sine',140,bt0,0.16,0.32,45);
    V.tone('sine',140,bt0+B*1.75,0.14,0.26,45);
    V.tone('sine',140,bt0+B*2.5,0.12,0.20,45);
    V.noise(bt0+B,0.16,0.16,1400,'bandpass',1.2);
    V.noise(bt0+B*3,0.16,0.16,1400,'bandpass',1.2);
    for(i2=0;i2<16;i2++)
      V.noise(bt0+sw(i2),0.03,(i2%4===0)?0.055:((i2%2)?0.022:0.038),8000);
    /* うねるベース */
    for(i2=0;i2<8;i2++){
      var d=bassPat[ci][i2];
      if(d<-10)continue;
      V.tone('triangle',rootHz[ci]*Math.pow(2,d/12),bt0+sw(i2*2),B*0.42,0.16);
    }
    /* 裏拍のクラビ風の刻み */
    for(i2=0;i2<8;i2++){
      if(i2%2===0)continue;
      chord[ci].forEach(function(f){
        V.tone('square',f,bt0+sw(i2*2),B*0.16,0.035);
      });
    }
    /* 歌うようなメロディ */
    if(b2>=2){
      var mp=mel[(b2-2)%2];
      for(i2=0;i2<8;i2++){
        var dm=mp[i2];
        if(dm<-10)continue;
        V.tone('sawtooth',rootHz[ci]*4*Math.pow(2,dm/12),bt0+sw(i2*2),B*0.44,0.055);
      }
    }
    if(b2%4===0)V.noise(bt0,0.6,0.07,3500);
  }
  var endT=bars*4*B,ED=2.8;
  V.pad('triangle',73.42,endT,ED,0.13);
  V.pad('square',293.66,endT,ED,0.05);
  V.pad('square',349.23,endT,ED,0.05);
  V.pad('sawtooth',440.00,endT,ED,0.05);
  V.tone('sine',140,endT,0.24,0.30,45);
  V.noise(endT,2.0,0.09,3000);
}

/* ---- 日本語は小さく描いて拡大し、ドット感を出す ---- */
/* stretch=縦の伸ばし率（1.3で130%長体）／中間調は捨てて全ドット100%にする */
function pixelCanvas(txt,color,stretch){
  stretch=stretch||1;
  var key=txt+'|'+color+'|'+stretch;
  if(pxCache[key])return pxCache[key];
  var base=12,t=document.createElement('canvas'),tc=t.getContext('2d');
  var font='700 '+base+'px "Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif';
  tc.font=font;
  var w=Math.ceil(tc.measureText(txt).width)+2;
  t.width=Math.max(1,w);
  t.height=Math.ceil(base*stretch)+5;
  tc=t.getContext('2d');
  tc.setTransform(1,0,0,stretch,0,0);
  tc.font=font;tc.textBaseline='top';tc.fillStyle=color;
  tc.fillText(txt,1,1);
  tc.setTransform(1,0,0,1,0,0);
  if(color.charAt(0)==='#'){
    try{
      var im=tc.getImageData(0,0,t.width,t.height),d=im.data,rgb=hexRGB(color);
      for(var i=0;i<d.length;i+=4){
        if(d[i+3]>=100){d[i]=rgb[0];d[i+1]=rgb[1];d[i+2]=rgb[2];d[i+3]=255;}
        else d[i+3]=0;
      }
      tc.putImageData(im,0,0);
    }catch(e){}
  }
  pxCache[key]=t;
  return t;
}
function pixelText(txt,x,y,scale,align,color,stretch){
  try{
    var c=pixelCanvas(txt,color,stretch);
    var dw=c.width*scale,dh=c.height*scale,dx=x;
    if(align==='center')dx=x-dw/2;else if(align==='right')dx=x-dw;
    ctx.imageSmoothingEnabled=false;
    ctx.webkitImageSmoothingEnabled=false;
    ctx.mozImageSmoothingEnabled=false;
    ctx.drawImage(c,0,0,c.width,c.height,Math.round(dx),Math.round(y),dw,dh);
    ctx.imageSmoothingEnabled=true;
  }catch(e){
    ctx.fillStyle=color;ctx.textAlign=align||'left';
    ctx.font='700 '+(scale*12)+'px sans-serif';
    ctx.fillText(txt,x,y+scale*12);
  }
}

/* ================= 迷路 ================= */
function blank(){
  grid=[];
  for(var r=0;r<ROWS;r++){var row=[];
    for(var c=0;c<COLS;c++) row.push({n:1,e:1,s:1,w:1,v:inBed(r,c)?1:0});
    grid.push(row);}
}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=(Math.random()*(i+1))|0,t=a[i];a[i]=a[j];a[j]=t;}return a;}
function carve(stack){
  var guard=0;
  while(stack.length&&guard++<200000){
    var t=stack[stack.length-1],cr=t[0],cc=t[1],nb=[];
    if(cr>0&&!grid[cr-1][cc].v)      nb.push([cr-1,cc,'n','s']);
    if(cr<ROWS-1&&!grid[cr+1][cc].v) nb.push([cr+1,cc,'s','n']);
    if(cc>0&&!grid[cr][cc-1].v)      nb.push([cr,cc-1,'w','e']);
    if(cc<COLS-1&&!grid[cr][cc+1].v) nb.push([cr,cc+1,'e','w']);
    if(!nb.length){stack.pop();continue;}
    var p=nb[(Math.random()*nb.length)|0];
    grid[cr][cc][p[2]]=0;grid[p[0]][p[1]][p[3]]=0;grid[p[0]][p[1]].v=1;
    stack.push([p[0],p[1]]);
  }
}
function genMaze(){
  blank();
  var sr=(Math.random()*ROWS)|0, sc=(Math.random()*COLS)|0,sg=0;
  while(inBed(sr,sc)&&sg++<600){sr=(Math.random()*ROWS)|0;sc=(Math.random()*COLS)|0;}
  grid[sr][sc].v=1;
  carve([[sr,sc]]);
  repair(sr,sc);
  sealBed();
  if(stage<FREE_FROM){
    start={r:ROWS-1,c:(COLS/2)|0};
    goal ={r:0,     c:(COLS/2)|0};
  }else{
    start={r:(Math.random()*ROWS)|0,c:(Math.random()*COLS)|0};
    var sg2=0;
    while(inBed(start.r,start.c)&&sg2++<600) start={r:(Math.random()*ROWS)|0,c:(Math.random()*COLS)|0};
    goal=farFrom(start.r,start.c,0.8,null);
  }
}
/* 掘り直しで孤立したマスが出たら、必ず通路をつなぎ直す */
function repair(sr,sc){
  var guard=0;
  while(guard++<60){
    var d=bfs(sr,sc),bad=[],r,c;
    for(r=0;r<ROWS;r++)for(c=0;c<COLS;c++) if(d[r][c]<0&&!inBed(r,c)) bad.push([r,c]);
    if(!bad.length) return;
    var opened=false;
    for(var i=0;i<bad.length;i++){
      var r0=bad[i][0],c0=bad[i][1],opts=[];
      if(r0>0&&d[r0-1][c0]>=0&&!inBed(r0-1,c0)) opts.push('n');
      if(r0<ROWS-1&&d[r0+1][c0]>=0&&!inBed(r0+1,c0)) opts.push('s');
      if(c0>0&&d[r0][c0-1]>=0&&!inBed(r0,c0-1)) opts.push('w');
      if(c0<COLS-1&&d[r0][c0+1]>=0&&!inBed(r0,c0+1)) opts.push('e');
      if(!opts.length) continue;
      var k=opts[(Math.random()*opts.length)|0],v=DIRS[k];
      grid[r0][c0][k]=0;grid[r0+v.dr][c0+v.dc][OPP[k]]=0;opened=true;
    }
    if(!opened) return;
  }
}
function bfs(sr,sc){
  var d=[],r,c;
  for(r=0;r<ROWS;r++){d.push([]);for(c=0;c<COLS;c++)d[r].push(-1);}
  var q=[[sr,sc]];d[sr][sc]=0;
  for(var i=0;i<q.length;i++){
    var r0=q[i][0],c0=q[i][1],g=grid[r0][c0],v=d[r0][c0];
    if(!g.n&&r0>0&&d[r0-1][c0]<0){d[r0-1][c0]=v+1;q.push([r0-1,c0]);}
    if(!g.s&&r0<ROWS-1&&d[r0+1][c0]<0){d[r0+1][c0]=v+1;q.push([r0+1,c0]);}
    if(!g.w&&c0>0&&d[r0][c0-1]<0){d[r0][c0-1]=v+1;q.push([r0,c0-1]);}
    if(!g.e&&c0<COLS-1&&d[r0][c0+1]<0){d[r0][c0+1]=v+1;q.push([r0,c0+1]);}
  }
  return d;
}
function farFrom(sr,sc,ratio,avoid){
  var d=bfs(sr,sc),mx=0,r,c;
  for(r=0;r<ROWS;r++)for(c=0;c<COLS;c++) if(d[r][c]>mx) mx=d[r][c];
  var far=[];
  for(r=0;r<ROWS;r++)for(c=0;c<COLS;c++){
    if(d[r][c]<mx*ratio) continue;
    if(avoid&&avoid[r+','+c]) continue;
    far.push({r:r,c:c});
  }
  if(!far.length) far.push({r:sr,c:sc});
  return far[(Math.random()*far.length)|0];
}

/* ---- 迷路の変形：壁を数枚だけ入れ替える ---- */
function ekey(a,b){
  if(a.r===b.r) return a.r+','+Math.max(a.c,b.c)+',w';
  return Math.max(a.r,b.r)+','+a.c+',n';
}
function edgeKey(e){return e.r+','+e.c+','+e.d;}
function setEdge(e,closed){
  var v=closed?1:0;
  if(e.d==='n'){grid[e.r][e.c].n=v;grid[e.r-1][e.c].s=v;}
  else{grid[e.r][e.c].w=v;grid[e.r][e.c-1].e=v;}
}
function edgeLine(e){
  var x=ox+e.c*cell,y=oy+e.r*cell;
  if(e.d==='n') return {x1:x,y1:y,x2:x+cell,y2:y};
  return {x1:x,y1:y,x2:x,y2:y+cell};
}
function allConnected(){
  var d=bfs(pc.r,pc.c),n=0;
  for(var r=0;r<ROWS;r++)for(var c=0;c<COLS;c++) if(d[r][c]>=0)n++;
  return n===ROWS*COLS-bedCount();
}

function reshape(){
  var prot={},i,r,c;
  var from=amoebaOn?Math.floor(amoeba):0,prev=null;
  for(i=Math.max(0,from);i<dots.length;i++){
    var q=cellAt(dots[i].x,dots[i].y);
    if(q.r<0||q.r>=ROWS||q.c<0||q.c>=COLS){prev=null;continue;}
    if(prev&&Math.abs(prev.r-q.r)+Math.abs(prev.c-q.c)===1) prot[ekey(prev,q)]=1;
    prev=q;
  }
  if(dir) prot[ekey(pc,nb(pc,dir))]=1;
  if(aPath&&aMode!=='trail') for(i=0;i+1<aPath.length;i++) prot[ekey(aPath[i],aPath[i+1])]=1;

  var closed=[],opened=[];
  for(r=0;r<ROWS;r++)for(c=0;c<COLS;c++){
    if(r>0&&!inBed(r,c)&&!inBed(r-1,c))(grid[r][c].n?closed:opened).push({r:r,c:c,d:'n'});
    if(c>0&&!inBed(r,c)&&!inBed(r,c-1))(grid[r][c].w?closed:opened).push({r:r,c:c,d:'w'});
  }
  shuffle(closed);shuffle(opened);
  var rem=closed.slice(0,SHIFT_EDGES);
  for(i=0;i<rem.length;i++) setEdge(rem[i],false);
  var add=[];
  for(i=0;i<opened.length&&add.length<SHIFT_EDGES;i++){
    var e=opened[i];
    if(prot[edgeKey(e)])continue;
    setEdge(e,true);
    if(allConnected()) add.push(e); else setEdge(e,false);
  }
  pendGoal=farFrom(pc.r,pc.c,0.65,null);
  for(i=0;i<add.length;i++) setEdge(add[i],false);   // いったん元に戻して演出へ
  for(i=0;i<rem.length;i++) setEdge(rem[i],true);
  animRem=rem;animAdd=add;animSkip={};
  for(i=0;i<rem.length;i++) animSkip[edgeKey(rem[i])]=1;
  for(i=0;i<add.length;i++) animSkip[edgeKey(add[i])]=1;
  shiftApplied=false;shiftCrashed=false;shiftT=now;state='shift';
  beep(300,0.18,0.05,'triangle');
}
function applyShift(){
  var i;
  for(i=0;i<animRem.length;i++) setEdge(animRem[i],false);
  for(i=0;i<animAdd.length;i++) setEdge(animAdd[i],true);
  if(pendGoal) goal=pendGoal;
  for(i=blockers.length-1;i>=0;i--)
    if(blockers[i].mode==='idle'&&blockers[i].r===goal.r&&blockers[i].c===goal.c) blockers.splice(i,1);
  for(i=0;i<blockers.length;i++){
    var b=blockers[i];
    if(b.mode==='wander'&&(!b.wdir||!open({r:b.r,c:b.c},b.wdir))){b.prog=0;b.wdir=null;pickWander(b);}
    if(b.mode!=='go')continue;
    var np=(b.target&&lures.indexOf(b.target)>=0)?pathTo({r:b.r,c:b.c},{r:b.target.r,c:b.target.c}):null;
    if(np&&np.length){b.path=np;b.pi=0;b.prog=0;} else stopBlocker(b);
  }
  shiftApplied=true;
  birthSfx();
}

function ctr(r,c){return {x:ox+c*cell+cell/2,y:oy+r*cell+cell/2};}
function cellAt(x,y){return {r:Math.floor((y-oy)/cell),c:Math.floor((x-ox)/cell)};}
function open(p,d){
  if(!d)return false;
  var g=grid[p.r][p.c];
  if(g[d])return false;
  var v=DIRS[d],nr=p.r+v.dr,nc=p.c+v.dc;
  return nr>=0&&nr<ROWS&&nc>=0&&nc<COLS;
}
function nb(p,d){var v=DIRS[d];return {r:p.r+v.dr,c:p.c+v.dc};}

/* ================= 待ち伏せアメーバ ================= */
function placeBlockers(){
  blockers=[];
  if(stage<BLOCK_FROM) return;
  var n=Math.min(6,stage-BLOCK_FROM+2);
  var d=bfs(pc.r,pc.c),cand=[],r,c;
  for(r=0;r<ROWS;r++)for(c=0;c<COLS;c++){
    if(d[r][c]<3) continue;
    if(isUsed(r,c)) continue;
    cand.push({r:r,c:c});
  }
  shuffle(cand);
  for(var i=0;i<n&&i<cand.length;i++){
    blockers.push({r:cand[i].r,c:cand[i].c,ph:Math.random()*9000,per:6200+Math.random()*3000,op:2600,
                   mode:'idle',path:null,pi:0,prog:0,target:null,look:0,hlook:0,eatT:0,wdir:null});
    markUsed(cand[i].r,cand[i].c);
  }
}
function blockerPos(b){
  if(b.mode==='wander'){
    var a0=ctr(b.r,b.c);
    if(!b.wdir)return a0;
    var n0=nb({r:b.r,c:b.c},b.wdir),q0=ctr(n0.r,n0.c);
    return {x:a0.x+(q0.x-a0.x)*b.prog,y:a0.y+(q0.y-a0.y)*b.prog};
  }
  if((b.mode!=='go'&&b.mode!=='hunt')||!b.path||!b.path.length) return ctr(b.r,b.c);
  var i=Math.min(b.pi,b.path.length-1);
  if(b.path[i].r!==b.r||b.path[i].c!==b.c) return ctr(b.r,b.c);   // 食い違ったら現在地
  var a=ctr(b.path[i].r,b.path[i].c);
  if(i<b.path.length-1){
    var q=ctr(b.path[i+1].r,b.path[i+1].c);
    return {x:a.x+(q.x-a.x)*b.prog,y:a.y+(q.y-a.y)*b.prog};
  }
  return a;
}
function pickWander(b){
  var opts=[],back=b.wdir?OPP[b.wdir]:null,k;
  for(k in DIRS) if(open({r:b.r,c:b.c},k)&&k!==back) opts.push(k);
  if(!opts.length) for(k in DIRS) if(open({r:b.r,c:b.c},k)) opts.push(k);
  b.wdir=opts.length?opts[(Math.random()*opts.length)|0]:null;
}
function stopBlocker(b){
  if(b.mode==='go'&&b.path&&b.path.length){
    var idx=(b.prog>0.5)?Math.min(b.pi+1,b.path.length-1):Math.min(b.pi,b.path.length-1);
    b.r=b.path[idx].r;b.c=b.path[idx].c;
  }
  b.mode='idle';b.path=null;b.pi=0;b.prog=0;b.target=null;
  b.ph=Math.random()*b.per;b.look=now;
}
/* 誰かが食べた時点で、同じ餌を狙っていた個体は動きを止める */
function onLureTaken(L,eater){
  for(var i=0;i<blockers.length;i++){
    var b=blockers[i];
    if(b!==eater&&b.target===L&&b.mode==='go') stopBlocker(b);
  }
  if(eater&&aMode==='go'&&aTarget===L){aTarget=null;startBack();}
}
function nearestLure(r,c,range){
  if(!lures.length)return null;
  var d=bfs(r,c),best=null,bd=1e9;
  for(var i=0;i<lures.length;i++){
    var L=lures[i];
    if(L.eat)continue;
    var v=d[L.r][L.c];
    if(v<0||v>range)continue;
    if(v<bd){bd=v;best=L;}
  }
  return best;
}
function holeAt(r,c){
  for(var i=0;i<holes.length;i++) if(holes[i].open&&holes[i].r===r&&holes[i].c===c) return holes[i];
  return null;
}
function checkHoles(){
  var i,h;
  /* 追跡アメーバ：落ちたら10秒潜って、同じ場所から上がってくる */
  if(aMode==='hole'){
    if(now-aHoleT>=HOLE_HIDE){
      aMode=aPrevMode;aHoleCool=now+3000;
      beep(300,0.14,0.05,'sawtooth');
    }
  }else if(amoebaOn&&now>=aHoleCool&&!amoebaWarping()){
    var a=amoebaPos();
    if(a){
      var q=cellAt(a.x,a.y);
      if(q.r>=0&&q.r<ROWS&&q.c>=0&&q.c<COLS&&holeAt(q.r,q.c)){
        aPrevMode=aMode;aMode='hole';aHoleT=now;aHolePos={x:a.x,y:a.y};
        holeFx.push({x:a.x,y:a.y,t:now,c:RED});
        fallSfx();
      }
    }
  }
  /* 待ち伏せアメーバ：動いている時に落ちたら消滅 */
  for(i=blockers.length-1;i>=0;i--){
    var b=blockers[i];
    if(b.mode!=='go'&&b.mode!=='wander'&&b.mode!=='hunt')continue;
    if(b.noHole){                               // 出てきた穴には落ちない
      if(b.noHole.r===b.r&&b.noHole.c===b.c)continue;
      b.noHole=null;
    }
    if(!holeAt(b.r,b.c))continue;
    var bp=blockerPos(b);
    holeFx.push({x:bp.x,y:bp.y,t:now,c:VIO});
    blockers.splice(i,1);
    score+=HOLE_PT;
    pop(bp.x,bp.y-cell*0.3,'+'+HOLE_PT,'#ffd400');
    fallSfx();
    setTimeout(function(){beep(1046,0.1,0.05,'square');},900);
    setTimeout(function(){beep(1568,0.18,0.05,'square');},1000);
  }
}
function updateBlockers(){
  if(state==='fieldlive')return;
  for(var i=0;i<blockers.length;i++){
    var b=blockers[i];
    if(b.mode==='eat'&&b.girl){
      if(now-b.eatT>=GIRL_EAT){
        (function(){var gl2=girlsAll();for(var q2=0;q2<gl2.length;q2++)if(gl2[q2].eater===b)gl2[q2].state='gone';})();
        b.girl=false;b.mode='wander';b.prog=0;b.wdir=null;pickWander(b);b.look=now;
      }
      continue;
    }
    if(b.mode==='eat'){
      if(now-b.eatT>=LURE_EAT){
        var k=lures.indexOf(b.target);
        if(k>=0)lures.splice(k,1);
        b.target=null;b.mode='wander';b.prog=0;b.wdir=null;pickWander(b);b.look=now;
      }
      continue;
    }
    if(b.mode==='go'){
      if(!b.target||lures.indexOf(b.target)<0||b.target.eat){stopBlocker(b);continue;}
      b.prog+=BLK_SPD*(dt/1000);
      var g=0;
      while(b.prog>=1&&b.pi<b.path.length-1&&g++<40){
        b.prog-=1;b.pi++;b.r=b.path[b.pi].r;b.c=b.path[b.pi].c;
      }
      if(b.pi>=b.path.length-1){
        b.prog=0;
        b.r=b.path[b.path.length-1].r;b.c=b.path[b.path.length-1].c;
        b.mode='eat';b.eatT=now;b.target.eat=now;
        onLureTaken(b.target,b);
        beep(360,0.16,0.045,'sawtooth');
      }
      continue;
    }
    if(b.mode==='hunt'){
      if(!nightT){b.mode='wander';b.prog=0;b.wdir=null;pickWander(b);}
      else{
        var cur=(b.path&&b.path.length)?b.path[Math.min(b.pi,b.path.length-1)]:null;
        var lost=(!cur||cur.r!==b.r||cur.c!==b.c);      // 経路と現在地がずれた
        var tail=(b.path&&b.path.length)?b.path[b.path.length-1]:null;
        var stale=(!tail||tail.r!==pc.r||tail.c!==pc.c);
        if(!b.path||lost||(stale&&b.prog<0.06&&now-b.hlook>300)){
          if(lost)b.prog=0;
          b.hlook=now;
          var hp=pathTo({r:b.r,c:b.c},{r:pc.r,c:pc.c});
          if(hp&&hp.length>1){b.path=hp;b.pi=0;b.prog=0;}
          else {b.path=null;b.prog=0;}
        }
        if(b.path&&b.path.length){
          b.prog+=(SPEED*NIGHT_SPD)*(dt/1000);
          var hg=0;
          while(b.prog>=1&&b.pi<b.path.length-1&&hg++<40){
            b.prog-=1;b.pi++;b.r=b.path[b.pi].r;b.c=b.path[b.pi].c;
          }
          if(b.pi>=b.path.length-1)b.prog=0;
        }
      }
    }
    if(b.mode==='wander'){
      if(!b.wdir)pickWander(b);
      if(b.wdir){
        b.prog+=BLK_SPD*(dt/1000);
        var wg=0;
        while(b.prog>=1&&wg++<20){
          var nx=nb({r:b.r,c:b.c},b.wdir);
          b.r=nx.r;b.c=nx.c;b.prog-=1;pickWander(b);
          if(!b.wdir){b.prog=0;break;}
        }
      }
    }
    if(lures.length&&now-b.look>420&&b.prog<0.06){
      b.look=now;
      var L=nearestLure(b.r,b.c,BLK_RANGE);
      if(L){
        var p=pathTo({r:b.r,c:b.c},{r:L.r,c:L.c});
        if(p&&p.length>1){b.path=p;b.pi=0;b.prog=0;b.target=L;b.mode='go';}
      }
    }
  }
}
function blockerOpen(b){
  if(b.mode!=='idle')return 0;
  var t=(now+b.ph)%b.per, e=500;
  if(t<e) return t/e;
  if(t<b.op) return 1;
  if(t<b.op+e) return 1-(t-b.op)/e;
  return 0;
}

function inBed(r,c){return !!bed&&r>=bed.r0&&r<=bed.r1&&c>=bed.c0&&c<=bed.c1;}

/* 中庭は迷路を掘る前に確保する（通路と重ならない・外周から1マス内側） */
function placeBed(){
  bed=null;
  if(stage<BED_FROM)return;
  if(ROWS<8||COLS<6)return;
  var area=ROWS*COLS,cap=Math.floor(area*0.18);
  var target=Math.max(4,Math.min(cap,Math.round(area*(0.05+Math.random()*0.12))));
  var bh=Math.max(2,Math.min(ROWS-4,Math.round(Math.sqrt(target*(0.7+Math.random()*0.9)))));
  var bw=Math.max(2,Math.min(COLS-4,Math.round(target/Math.max(1,bh))));
  var guard2=0;
  while(bh*bw>cap&&guard2++<40){          // 18%を超えないよう長い方から削る
    if(bh>=bw&&bh>2)bh--; else if(bw>2)bw--; else break;
  }
  if(bh<2||bw<2)return;
  var r0=1+((Math.random()*(ROWS-2-bh+1))|0);
  var c0=1+((Math.random()*(COLS-2-bw+1))|0);
  /* 噴水は最大3マス分。中庭に収まる範囲で大きくする */
  var fs=Math.max(1,Math.min(3,bw-0.4,bh-0.4));
  bed={r0:r0,c0:c0,r1:r0+bh-1,c1:c0+bw-1,
       fr:r0+((bh/2)|0),fc:c0+((bw/2)|0),
       cx:c0+bw/2,cy:r0+bh/2,fs:fs,
       ftype:(Math.random()*3)|0,
       temple:(stage===TEMPLE_STAGE),
       fountain:(stage>=FOUNTAIN_FROM||stage===TEMPLE_STAGE)};
}
/* 中庭：外周は塞ぎ、内部は壁のない広場にする */
function sealBed(){
  if(!bed)return;
  var r,c,k;
  for(r=bed.r0;r<=bed.r1;r++)for(c=bed.c0;c<=bed.c1;c++){
    var g=grid[r][c];
    for(k in DIRS){
      var v=DIRS[k],nr=r+v.dr,nc=c+v.dc,op=inBed(nr,nc)?0:1;
      g[k]=op;
      if(nr>=0&&nr<ROWS&&nc>=0&&nc<COLS) grid[nr][nc][OPP[k]]=op;
    }
    g.v=1;
  }
}

/* 人数に応じた3列の隊形（前列が少なく、後列ほど多い） */
function idolRows(n){
  if(n<=7)return [1,2,4];
  if(n===12)return [3,4,5];
  var front=Math.max(1,Math.round(n*0.25));
  var mid=Math.max(front,Math.round(n*0.33));
  var back=n-front-mid;
  if(back<mid){back=mid;front=n-mid-back;}
  if(front<1){front=1;mid=Math.max(1,Math.floor((n-1)/2));back=n-1-mid;}
  return [front,mid,back];
}
function idolSlotPos(k,S,ox2,oy2){
  if(soloId)return {x:ox2+S*0.50,y:oy2+S*0.76,s:1};
  var r=idolRowsCache||idolRows(idolN);
  var rowY=[0.80,0.635,0.48],rowS=[1.15,1.00,0.86];
  var row=0,idx=k;
  if(idx>=r[0]){idx-=r[0];row=1;}
  if(row===1&&idx>=r[1]){idx-=r[1];row=2;}
  var c=r[row]||1;
  var span=(c<=1)?0:Math.min(0.80,0.20*c);
  var x=(c<=1)?0.5:(0.5-span/2+span*(idx/(c-1)));
  var shrink=Math.min(1,6/Math.max(r[0],r[1],r[2]));
  return {x:ox2+S*x,y:oy2+S*rowY[row],s:rowS[row]*shrink};
}
function updateIdol(){
  var base=musicT||introT;
  if(!idolT){                       // 曲が始まって3秒で照明が入る
    if(now-base>=INTRO_MS){
      idolT=now;idolSwapT=now;
      lightSfx();
    }
    return;
  }
  if(now-idolSwapT>2600&&now-idolT<IDOL_MS-1500){
    idolSwapT=now;
    var r0=idolRowsCache||idolRows(idolN);
    /* 半分は最前列（センター）を必ず入れ替える */
    var a=(Math.random()<0.6)?((Math.random()*r0[0])|0):((Math.random()*idolN)|0);
    var b=(Math.random()*idolN)|0,g2=0;
    while(b===a&&g2++<10)b=(Math.random()*idolN)|0;
    /* 猫のお面のメンバーは最前列から動かさない */
    if(catMembers&&(idolSlots[a]<catMembers||idolSlots[b]<catMembers)){a=b=0;}
    if(a!==b){
      var t=idolSlots[a];idolSlots[a]=idolSlots[b];idolSlots[b]=t;
      idolAnim[idolSlots[a]]={from:b,to:a,t:now};
      idolAnim[idolSlots[b]]={from:a,to:b,t:now};
      beep(1200,0.05,0.03,'square');
    }
  }
  if(!heartT&&now-(musicT||introT)>=idolLen()){ // 曲が終わると同時に歓声
    heartT=now;musicStop();cheerSfx();
  }
  if(heartT&&!heartGot&&now-heartT>=HEART_MS){
    heartGot=now;
    if(!idolDemo){
      lives++;idolBonus++;
      idolNext=savedGirls+IDOL_STEP;idolShow++;   // 次のライブは5人先
    }
    beep(1046,0.09,0.05,'triangle');
    setTimeout(function(){beep(1568,0.09,0.05,'triangle');},90);
    setTimeout(function(){beep(2093,0.22,0.05,'triangle');},180);
  }
  if(heartGot&&now-heartGot>=1200){
    if(idolDemo){idolDemo=false;soloId=null;musicStop();toTitle();}
    else if(soloId&&pendIdol){pendIdol=false;soloId=null;startIdol(false,idolNext);}
    else {soloId=null;clearStage();}
  }
}

  ctx.lineTo(cx+cw*0.52,cy);
  ctx.lineTo(cx+cw*0.30,cy-cw*0.30);
  ctx.lineTo(cx-cw*0.30,cy-cw*0.30);
  ctx.closePath();ctx.fill();
  var by7=cy-cw*0.80;
  ctx.fillStyle='rgba(190,140,255,'+(0.30+0.25*lit)+')';   // にじむ光
  ctx.beginPath();ctx.arc(cx,by7,cw*0.90,0,7);ctx.fill();
  ctx.fillStyle='rgba(216,190,255,'+(0.80+0.15*lit)+')';   // 玉
  ctx.beginPath();ctx.arc(cx,by7,cw*0.52,0,7);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.75)';
  ctx.beginPath();ctx.arc(cx-cw*0.18,by7-cw*0.20,cw*0.16,0,7);ctx.fill();
  ctx.fillStyle='rgba(120,70,190,0.35)';
  ctx.beginPath();ctx.arc(cx+cw*0.14,by7+cw*0.16,cw*0.22,0,7);ctx.fill();
  ctx.restore();
}
function drawBigTrees(ox2,oy2,S,lit){          /* 天井まで届く大樹2本と鳥 */
  ctx.save();
  ctx.beginPath();ctx.rect(ox2,oy2,S,S*0.90);ctx.clip();
  var i,k;
  for(i=0;i<2;i++){
    var tx=ox2+S*(i?0.74:0.26);
    /* 幹 */
    ctx.fillStyle='rgba(32,24,16,'+(0.85+0.1*lit)+')';
    ctx.beginPath();
    ctx.moveTo(tx-S*0.055,oy2+S*0.88);
    ctx.quadraticCurveTo(tx-S*0.030,oy2+S*0.40,tx-S*0.022,oy2);
    ctx.lineTo(tx+S*0.022,oy2);
    ctx.quadraticCurveTo(tx+S*0.030,oy2+S*0.40,tx+S*0.055,oy2+S*0.88);
    ctx.closePath();ctx.fill();
    /* 根 */
    ctx.beginPath();
    ctx.moveTo(tx-S*0.055,oy2+S*0.88);
    ctx.quadraticCurveTo(tx-S*0.11,oy2+S*0.86,tx-S*0.14,oy2+S*0.89);
    ctx.lineTo(tx+S*0.14,oy2+S*0.89);
    ctx.quadraticCurveTo(tx+S*0.11,oy2+S*0.86,tx+S*0.055,oy2+S*0.88);
    ctx.closePath();ctx.fill();
    /* 枝 */
    ctx.strokeStyle='rgba(32,24,16,0.9)';ctx.lineWidth=Math.max(2,S*0.013);
    ctx.lineCap='round';
    for(k=0;k<4;k++){
      var by5=oy2+S*(0.12+k*0.16),dir=(k%2?1:-1);
      ctx.beginPath();
      ctx.moveTo(tx,by5);
      ctx.quadraticCurveTo(tx+dir*S*0.09,by5-S*0.04,tx+dir*S*0.16,by5-S*0.10);
      ctx.stroke();
    }
    /* 葉のかたまり */
    ctx.fillStyle='rgba(26,72,38,'+(0.55+0.3*lit)+')';
    for(k=0;k<7;k++){
      var lx4=tx+Math.sin(k*2.1)*S*0.14;
      var ly4=oy2+S*(0.06+k*0.115);
      ctx.beginPath();
      ctx.ellipse?ctx.ellipse(lx4,ly4,S*0.11,S*0.045,Math.sin(k)*0.3,0,7)
                 :ctx.arc(lx4,ly4,S*0.08,0,7);
      ctx.fill();
    }
  }
  /* 飛び回る鳥 */
  ctx.strokeStyle='rgba(18,16,14,'+(0.55+0.35*lit)+')';
  ctx.lineWidth=Math.max(1.4,S*0.0075);
  for(i=0;i<7;i++){
    var t2=(now*0.00018+i*0.17)%1;
    var bx5=ox2+S*(0.06+0.88*t2);
    var by6=oy2+S*(0.16+0.30*Math.sin(t2*Math.PI*2+i*1.9));
    var flap=Math.sin(now*0.012+i*2)*S*0.012;
    ctx.beginPath();
    ctx.moveTo(bx5-S*0.028,by6+flap);
    ctx.quadraticCurveTo(bx5-S*0.010,by6-S*0.012,bx5,by6);
    ctx.quadraticCurveTo(bx5+S*0.010,by6-S*0.012,bx5+S*0.028,by6+flap);
    ctx.stroke();
  }
  ctx.restore();
}
function drawChair(cx,cy,cw){                  /* 木の椅子 */

function drawCurtainBack(ox2,oy2,S,lit){       /* 白い幕と、隙間から見える針葉樹の森 */
  ctx.save();
  ctx.beginPath();ctx.rect(ox2,oy2,S,S*0.88);ctx.clip();
  /* 隙間の森 */
  var gx0=ox2+S/5,gx1=ox2+S*4/5,gh=S*0.88;
  ctx.save();
  ctx.beginPath();ctx.rect(gx0,oy2,gx1-gx0,gh);ctx.clip();
  var i;
  ctx.fillStyle='rgba(28,44,40,'+(0.55+0.2*lit)+')';   // 奥の森
  for(i=0;i<7;i++){
    var tx=gx0+(gx1-gx0)*(i/6),th=S*(0.30+0.10*((i*37%10)/10));
    ctx.beginPath();
    ctx.moveTo(tx,oy2+S*0.80-th);
    ctx.lineTo(tx-S*0.05,oy2+S*0.80);
    ctx.lineTo(tx+S*0.05,oy2+S*0.80);
    ctx.closePath();ctx.fill();
  }
  ctx.fillStyle='rgba(16,30,26,'+(0.8+0.15*lit)+')';   // 手前の針葉樹
  for(i=0;i<5;i++){
    var nx=gx0+(gx1-gx0)*(0.08+i*0.21),nh=S*(0.42+0.12*((i*53%10)/10));
    for(var k=0;k<3;k++){
      var ky=oy2+S*0.84-nh*(0.30+k*0.26),kw=S*(0.085-k*0.018);
      ctx.beginPath();
      ctx.moveTo(nx,ky-nh*0.30);
      ctx.lineTo(nx-kw,ky);
      ctx.lineTo(nx+kw,ky);
      ctx.closePath();ctx.fill();
    }
    ctx.fillRect(nx-S*0.008,oy2+S*0.80,S*0.016,S*0.05);
  }
  ctx.restore();
  /* 白いカーテン（左右） */
  for(var sdd=0;sdd<2;sdd++){
    var cx0=sdd?gx1:ox2,cw2=S/5;
    var cgd=ctx.createLinearGradient(cx0,oy2,cx0+cw2,oy2);
    cgd.addColorStop(0,'rgba(248,246,240,'+(0.80+0.15*lit)+')');
    cgd.addColorStop(sdd?0.15:0.85,'rgba(232,229,220,'+(0.78+0.15*lit)+')');
    cgd.addColorStop(1,'rgba(214,210,200,'+(0.70+0.15*lit)+')');
    ctx.fillStyle=cgd;
    ctx.fillRect(cx0,oy2,cw2,S*0.88);
    ctx.strokeStyle='rgba(150,146,138,0.35)';   // ひだ
    ctx.lineWidth=Math.max(1,S*0.004);
    for(i=1;i<7;i++){
      var fx=cx0+cw2*(i/7);
      ctx.beginPath();
      ctx.moveTo(fx,oy2);
      ctx.quadraticCurveTo(fx+Math.sin(i*1.7)*S*0.012,oy2+S*0.44,fx,oy2+S*0.88);
      ctx.stroke();
    }
  }
  /* つり下げた小さな電球2灯 */
  var BPOS=[[0.34,0.26],[0.66,0.22],[0.10,0.32],[0.90,0.28]];
  for(i=0;i<4;i++){
    var bx4=ox2+S*BPOS[i][0],by4=oy2+S*BPOS[i][1];
    ctx.strokeStyle='rgba(60,56,50,0.8)';ctx.lineWidth=Math.max(1,S*0.004);
    ctx.beginPath();ctx.moveTo(bx4,oy2);ctx.lineTo(bx4,by4);ctx.stroke();
    var bg2=ctx.createRadialGradient(bx4,by4,S*0.004,bx4,by4,S*0.10);
    bg2.addColorStop(0,'rgba(255,236,180,'+(0.55*lit)+')');
    bg2.addColorStop(1,'rgba(255,230,160,0)');
    ctx.fillStyle=bg2;
    ctx.beginPath();ctx.arc(bx4,by4,S*0.10,0,7);ctx.fill();
    ctx.fillStyle='rgba(255,242,200,'+(0.75+0.2*lit)+')';
    ctx.beginPath();ctx.arc(bx4,by4,S*0.018,0,7);ctx.fill();
    ctx.fillStyle='rgba(70,66,60,0.9)';
    ctx.fillRect(bx4-S*0.008,by4-S*0.030,S*0.016,S*0.012);
  }
  ctx.restore();
}
function wolfHeadArt(cx,top,hgt,lit,sgn){      /* 壁いっぱいの狼の頭のイラスト */
  var u=hgt/2.30;                              // 縦の基準。天井から床まで届く大きさ
  ctx.save();
  ctx.translate(cx,top);
  ctx.scale(sgn<0?-0.86:0.86,1);               // 左右で向かい合わせ、少し細く
  var GL=ctx.createLinearGradient(0,0,0,hgt);
  GL.addColorStop(0,'rgba(104,114,132,'+(0.52*lit)+')');
  GL.addColorStop(0.55,'rgba(74,82,98,'+(0.46*lit)+')');
  GL.addColorStop(1,'rgba(44,50,64,'+(0.34*lit)+')');
  ctx.fillStyle=GL;
  /* 耳 */
  ctx.beginPath();
  ctx.moveTo(-u*0.82,u*0.60);ctx.lineTo(-u*0.56,0);ctx.lineTo(-u*0.12,u*0.56);
  ctx.closePath();ctx.fill();
  ctx.beginPath();
  ctx.moveTo(u*0.82,u*0.60);ctx.lineTo(u*0.56,0);ctx.lineTo(u*0.12,u*0.56);
  ctx.closePath();ctx.fill();
  /* 頭と頬の毛 */
  ctx.beginPath();
  ctx.moveTo(-u*0.92,u*0.56);
  ctx.quadraticCurveTo(-u*1.02,u*1.20,-u*0.70,u*1.52);
  ctx.lineTo(-u*0.84,u*1.70);
  ctx.lineTo(-u*0.52,u*1.66);
  ctx.quadraticCurveTo(-u*0.30,u*2.18,0,u*2.30);
  ctx.quadraticCurveTo(u*0.30,u*2.18,u*0.52,u*1.66);
  ctx.lineTo(u*0.84,u*1.70);
  ctx.lineTo(u*0.70,u*1.52);
  ctx.quadraticCurveTo(u*1.02,u*1.20,u*0.92,u*0.56);
  ctx.closePath();ctx.fill();
  /* 鼻づら */
  ctx.fillStyle='rgba(150,160,178,'+(0.40*lit)+')';
  ctx.beginPath();
  ctx.moveTo(-u*0.30,u*1.52);
  ctx.quadraticCurveTo(-u*0.26,u*2.08,0,u*2.22);
  ctx.quadraticCurveTo(u*0.26,u*2.08,u*0.30,u*1.52);
  ctx.closePath();ctx.fill();
  /* 耳の内側 */
  ctx.fillStyle='rgba(32,36,48,'+(0.46*lit)+')';
  ctx.beginPath();
  ctx.moveTo(-u*0.68,u*0.60);ctx.lineTo(-u*0.54,u*0.22);ctx.lineTo(-u*0.28,u*0.58);
  ctx.closePath();ctx.fill();
  ctx.beginPath();
  ctx.moveTo(u*0.68,u*0.60);ctx.lineTo(u*0.54,u*0.22);ctx.lineTo(u*0.28,u*0.58);
  ctx.closePath();ctx.fill();
  /* 光る目 */
  var gl=0.55+0.35*Math.abs(Math.sin(now*0.0009+(sgn>0?0:1.6)));
  for(var e=-1;e<=1;e+=2){
    var ex=e*u*0.44,ey=u*1.20;
    var eg=ctx.createRadialGradient(ex,ey,u*0.02,ex,ey,u*0.30);
    eg.addColorStop(0,'rgba(255,214,70,'+(0.85*gl*lit)+')');
    eg.addColorStop(1,'rgba(255,170,40,0)');
    ctx.fillStyle=eg;
    ctx.beginPath();ctx.arc(ex,ey,u*0.30,0,7);ctx.fill();
    ctx.fillStyle='rgba(255,232,150,'+(0.92*gl*lit)+')';
    ctx.beginPath();                           // 吊り上がった目
    ctx.moveTo(ex-u*0.19,ey+u*0.05);
    ctx.quadraticCurveTo(ex,ey-u*0.15,ex+u*0.19,ey-u*0.02);
    ctx.quadraticCurveTo(ex,ey+u*0.16,ex-u*0.19,ey+u*0.05);
    ctx.closePath();ctx.fill();
    ctx.fillStyle='rgba(24,18,10,'+(0.85*lit)+')';
    ctx.beginPath();
    ctx.ellipse?ctx.ellipse(ex,ey,u*0.035,u*0.085,0,0,7):ctx.arc(ex,ey,u*0.05,0,7);
    ctx.fill();
  }
  /* 鼻 */
  ctx.fillStyle='rgba(18,20,26,'+(0.72*lit)+')';
  ctx.beginPath();
  ctx.moveTo(-u*0.15,u*2.06);
  ctx.quadraticCurveTo(0,u*1.96,u*0.15,u*2.06);
  ctx.quadraticCurveTo(0,u*2.26,-u*0.15,u*2.06);
  ctx.closePath();ctx.fill();
  /* 牙 */
  ctx.fillStyle='rgba(240,244,250,'+(0.72*lit)+')';
  for(var t=-1;t<=1;t+=2){
    ctx.beginPath();
    ctx.moveTo(t*u*0.20,u*2.22);ctx.lineTo(t*u*0.28,u*2.20);ctx.lineTo(t*u*0.24,u*2.46);
    ctx.closePath();ctx.fill();
  }
  ctx.restore();
}
function drawWolfWall(ox2,oy2,S,lit){          /* 壁の狼の頭2つ */
  ctx.save();
  ctx.beginPath();ctx.rect(ox2,oy2,S,S*0.86);ctx.clip();

  }

}
function drawMirrorFloor(ox2,oy2,S,lit){       /* 鏡のような床 */
  var fy=oy2+S*0.86,fh=S*0.14;

  ctx.beginPath();ctx.rect(ox2,fy,S,fh);ctx.clip();

  mg3.addColorStop(0.35,'rgba(70,84,112,'+(0.16*lit)+')');
  mg3.addColorStop(1,'rgba(10,12,18,0)');
  ctx.fillStyle=mg3;
  ctx.fillRect(ox2,fy,S,fh);

  ctx.fillStyle='rgba(255,255,255,'+(0.38*lit)+')';   // 舞台の際の線
  ctx.fillRect(ox2,fy,S,Math.max(1,S*0.004));
  ctx.restore();
}
function drawSummerSea(ox2,oy2,S,lit){       /* 夏の海と遠くのヨット */
  var hz=oy2+S*0.520;                          // 水平線
  ctx.save();
  ctx.beginPath();ctx.rect(ox2,oy2,S,S*0.88);ctx.clip();
  /* 入道雲 */
  for(var cl=0;cl<3;cl++){
    var ccx=ox2+S*(0.16+cl*0.34)+Math.sin(now*0.00006+cl*2)*S*0.02;
    var ccy=oy2+S*(0.17+0.045*(cl%2));
    var ccr=S*(0.075+0.022*(cl%3));
    ctx.fillStyle='rgba(255,255,255,0.90)';
    ctx.beginPath();ctx.arc(ccx,ccy,ccr,0,7);ctx.fill();
    ctx.beginPath();ctx.arc(ccx-ccr*0.85,ccy+ccr*0.30,ccr*0.66,0,7);ctx.fill();
    ctx.beginPath();ctx.arc(ccx+ccr*0.88,ccy+ccr*0.26,ccr*0.60,0,7);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.95)';
    ctx.fillRect(ccx-ccr*1.5,ccy+ccr*0.30,ccr*3.0,ccr*0.52);
  }
  /* 太陽の光が海に落ちる帯 */
  var sunx=ox2+S*0.33;
  var sgl=ctx.createRadialGradient(sunx,oy2+S*0.12,S*0.02,sunx,oy2+S*0.12,S*0.30);
  sgl.addColorStop(0,'rgba(255,252,220,0.75)');
  sgl.addColorStop(1,'rgba(255,250,200,0)');
  ctx.fillStyle=sgl;
  ctx.beginPath();ctx.arc(sunx,oy2+S*0.12,S*0.30,0,7);ctx.fill();
  /* 遠くの小さなヨット */
  function yacht(yx,yy,ys,ph){
    var bob=Math.sin(now*0.0009+ph)*ys*0.10;
    var tl=Math.sin(now*0.0006+ph)*0.05;
    ctx.save();
    ctx.translate(yx,yy+bob);
    ctx.rotate(tl);
    ctx.fillStyle='#ffffff';                   // 帆（大小2枚）
    ctx.beginPath();
    ctx.moveTo(0,-ys*2.05);ctx.lineTo(ys*0.80,-ys*0.18);ctx.lineTo(0,-ys*0.18);
    ctx.closePath();ctx.fill();
    ctx.fillStyle='#eef4f8';
    ctx.beginPath();
    ctx.moveTo(-ys*0.10,-ys*1.85);ctx.lineTo(-ys*0.72,-ys*0.18);ctx.lineTo(-ys*0.10,-ys*0.18);
    ctx.closePath();ctx.fill();
    ctx.strokeStyle='#4a5560';ctx.lineWidth=Math.max(0.8,ys*0.085);
    ctx.beginPath();ctx.moveTo(-ys*0.04,-ys*2.05);ctx.lineTo(-ys*0.04,-ys*0.16);ctx.stroke();
    ctx.fillStyle='#2f3f4c';                   // 船体
    ctx.beginPath();
    ctx.moveTo(-ys*0.95,-ys*0.18);ctx.lineTo(ys*0.95,-ys*0.18);
    ctx.lineTo(ys*0.56,ys*0.16);ctx.lineTo(-ys*0.62,ys*0.16);
    ctx.closePath();ctx.fill();
    ctx.restore();
  }
  yacht(ox2+S*0.735,hz-S*0.004,S*0.030,0);     // 遠いので小さく
  yacht(ox2+S*0.845,hz-S*0.002,S*0.020,2.1);
  /* 水平線の光 */
  ctx.fillStyle='rgba(255,255,255,0.55)';
  ctx.fillRect(ox2,hz-1,S,2);
  /* 海のうねり */
  ctx.lineCap='round';
  for(var i=0;i<10;i++){
    var wy=hz+S*(0.012+i*0.036);
    var amp=S*(0.004+0.0035*i*0.4);
    var al=0.16+0.12*Math.abs(Math.sin(now*0.0007+i*1.2));
    ctx.strokeStyle='rgba(255,255,255,'+(al*lit)+')';
    ctx.lineWidth=Math.max(1,S*(0.0030+0.0014*i*0.3));
    ctx.beginPath();
    for(var q=0;q<=18;q++){
      var qx=ox2+S*(q/18);
      var qy=wy+Math.sin(q*0.8+now*0.0011+i*1.5)*amp;
      if(q===0)ctx.moveTo(qx,qy);else ctx.lineTo(qx,qy);
    }
    ctx.stroke();
  }
  /* 太陽の道（海面のきらめき） */
  ctx.save();
  ctx.globalCompositeOperation='lighter';
  for(var k=0;k<16;k++){
    var ky=hz+S*(0.012+k*0.022);
    var kw=S*(0.035+k*0.013);
    var ko=Math.sin(now*0.0013+k*1.7)*S*0.018;
    ctx.fillStyle='rgba(255,250,205,'+((0.20-k*0.009)*lit)+')';
    ctx.fillRect(sunx-kw/2+ko,ky,kw,Math.max(1,S*0.005));
  }
  ctx.restore();
  /* 波打ち際 */
  for(var fw=0;fw<3;fw++){
    ctx.fillStyle='rgba(255,255,255,'+(0.30-fw*0.07)+')';
    var ly=oy2+S*(0.845+fw*0.016);
    ctx.beginPath();

function tryWarp(){
  if(gates.length<2||!held||now-warpT<=WARP_LOCK)return false;
  var h=cellAt(px,py);                       // 実際に立っているマスで判定する
  var gi=gateAt(h.r,h.c,held);
  if(gi<0)return false;

  doWarp(pt);
  return true;

function step(ms){
  if(state!=='playing'&&state!=='fieldlive') return;
  if(warpHold){
    if(held===warpHold) return;      // ワープ直後、同じ方向を押しっぱなしなら止まったまま
    warpHold=null;
  }
  if(!held) return;
  if(tryWarp()) return;
  if(dir&&prog>0&&prog<1&&held===OPP[dir]){       // 通路の途中で反転
    pc=nb(pc,dir);dir=OPP[dir];prog=1-prog;
  }
  if(prog<=0){
    prog=0;
    if(open(pc,held)) dir=held;
    else if(!(dir&&open(pc,dir))) return;
  }
  var amt=SPEED*ms/1000,guard=0;
  var moveState=state;
  while(amt>1e-9&&guard++<80&&state===moveState){
    var m=Math.min(amt,1-prog);
    prog+=m;amt-=m;
    sync();
    if(prog>=1-1e-9){
      pc=nb(pc,dir);prog=0;sync();
      if(tryWarp())return;
      if(held&&open(pc,held)) dir=held;
      else if(open(pc,dir)) {}
      else break;                                  // 行き止まり
    }
  }
}
function pushHist(){
  var l=hist[hist.length-1];
  if(!l||Math.hypot(px-l.x,py-l.y)>1.5){hist.push({x:px,y:py});if(hist.length>600)hist.shift();}
}
function followPoint(gap){
  var need=cell*gap,acc=0,i=hist.length-1,gx=px,gy=py;
  while(i>0){
    var a=hist[i],b=hist[i-1],d=Math.hypot(a.x-b.x,a.y-b.y);
    if(acc+d>=need){
      var t=(need-acc)/(d||1);
      gx=a.x+(b.x-a.x)*t;gy=a.y+(b.y-a.y)*t;
      acc=need;break;
    }
    acc+=d;i--;
  }
  if(acc<need&&hist.length){gx=hist[0].x;gy=hist[0].y;}
  return {x:gx,y:gy};
}
function moveGirl(g,gap){
  if(g.state!=='follow')return;
  var q=followPoint(gap);
  var ddx=q.x-g.x,ddy=q.y-g.y;
  if(Math.abs(ddx)>0.6||Math.abs(ddy)>0.6)
    g.face=(Math.abs(ddx)>Math.abs(ddy))?(ddx>0?'e':'w'):(ddy>0?'s':'n');
  g.x=q.x;g.y=q.y;
}

  }
  if(!(pc.r===jail.r&&pc.c===jail.c))girl.lock=false;
  if(jail2&&!(pc.r===jail2.r&&pc.c===jail2.c))girl2.lock=false;
  eraseDots();addDots();
  // 追跡アメーバ
  if(amoebaOn){
    var a=amoebaPos();
    if(a&&aMode!=='girl'&&aMode!=='hole'&&!amoebaWarping()&&Math.hypot(px-a.x,py-a.y)<cell*0.45){caught('ヌメリンに触れた',null);return;}
  }
  // 待ち伏せアメーバ
  for(var i=0;i<blockers.length;i++){
    var b=blockers[i];
    if(b.girl) continue;                       // 少女を食べている個体は当たり判定なし
    if(b.mode!=='idle'&&b.mode!=='wander'&&b.mode!=='go'&&b.mode!=='hunt') continue;
    if(b.mode==='idle'&&blockerOpen(b)>=0.55) continue;
    var bc=blockerPos(b);
    if(Math.hypot(px-bc.x,py-bc.y)<cell*0.31){caught('待機ヌメリンに捕まった',b);return;}
  }
  for(var ci=0;ci<coins.length;ci++){
    var co=coins[ci];
    if(co.got)continue;
    var cp=ctr(co.r,co.c);
    if(Math.hypot(px-cp.x,py-cp.y)<cell*0.34){
      co.got=now;wallet++;
      pop(cp.x,cp.y-cell*0.3,'+1 COIN','#f2b705');
      beep(1046,0.07,0.05,'square');
      setTimeout(function(){beep(1568,0.12,0.05,'square');},70);
    }
  }
  for(var hi=0;hi<holes.length;hi++){
    var ho=holes[hi],hp=ctr(ho.r,ho.c);
    var on=Math.hypot(px-hp.x,py-hp.y)<cell*0.42;
    if(!ho.open){
      if(on){
        ho.open=now;ho.armed=0;          // 蓋を開けた直後は落ちない
        beep(320,0.09,0.045,'square');
        setTimeout(function(){beep(180,0.2,0.05,'sawtooth');},70);
      }
      continue;
    }
    if(!on){ho.armed=1;continue;}        // 一度離れたら落とし穴になる
    if(ho.armed){
      fallSfx();
      gameOver('マンホールに落ちた');
      return;
    }
  }
  if(bomb&&!bomb.got){
    var bp=ctr(bomb.r,bomb.c);
    if(Math.hypot(px-bp.x,py-bp.y)<cell*0.34){
      bomb.got=now;hasBomb=true;
      beep(520,0.08,0.05,'triangle');
      setTimeout(function(){beep(780,0.14,0.05,'triangle');},80);
    }
  }
  var g=ctr(goal.r,goal.c);
  if(state!=='fieldlive'&&Math.hypot(px-g.x,py-g.y)<cell*0.3) startTally();
}
function addDots(){
  var sp=cell*SPACING_F,guard=0;
  while(dots.length&&guard++<40){
    var l=dots[dots.length-1];
    var dx=px-l.x,dy=py-l.y,d=Math.hypot(dx,dy);
    if(d<sp)break;
    dots.push({x:l.x+dx/d*sp,y:l.y+dy/d*sp});
    score+=DOT_PT;
    if(dots.length%6===0) beep(1400,0.02,0.015,'sine');
  }
}
function eraseDots(){
  var sp=cell*SPACING_F,guard=0;
  while(dots.length>=2&&guard++<40){
    var b=dots[dots.length-2];
    if(Math.hypot(px-b.x,py-b.y)>=sp*0.96)break;
    dots.pop();
    score=Math.max(0,score-DOT_PT);
    if(dots.length%4===0) beep(420,0.03,0.02,'sine');
  }
}
/* ============ 擬似餌（ピンク） ============ */
function pathTo(a,b){
  if(a.r===b.r&&a.c===b.c) return [{r:a.r,c:a.c}];
  var d=bfs(b.r,b.c);
  if(d[a.r][a.c]<0) return null;
  var path=[{r:a.r,c:a.c}],cur={r:a.r,c:a.c},guard=0;
  while(!(cur.r===b.r&&cur.c===b.c)&&guard++<3000){
    var best=null,bd=d[cur.r][cur.c];
    for(var k in DIRS){
      if(!open(cur,k))continue;
      var n=nb(cur,k);
      if(d[n.r][n.c]>=0&&d[n.r][n.c]<bd){bd=d[n.r][n.c];best=n;}
    }
    if(!best)break;
    cur=best;path.push(cur);
  }
  return path;
}
function aCellNow(){
  if(aMode==='trail'||!aPath){var p=amoebaPos();return p?cellAt(p.x,p.y):{r:pc.r,c:pc.c};}
  return aPath[Math.min(aPi,aPath.length-1)];
}
function dropLure(){
  if(state!=='playing'||lureStock<=0)return;
  for(var i=0;i<lures.length;i++) if(lures[i].r===pc.r&&lures[i].c===pc.c) return;
  lures.push({r:pc.r,c:pc.c,t:now,eat:0});
  lureStock--;
  beep(700,0.08,0.05,'triangle');
}
/* いちばん近い擬似餌を探す（ピンクは黄色より好み） */
function pickLure(){
  if(!lures.length)return null;
  var a=aCellNow(),d=bfs(a.r,a.c),best=null,bd=1e9;
  for(var i=0;i<lures.length;i++){
    var L=lures[i],v=d[L.r][L.c];
    if(L.eat)continue;
    if(v<0||v>LURE_RANGE)continue;
    if(v<bd){bd=v;best=L;}
  }
  return best;
}
function startGo(L){
  var p=pathTo(aCellNow(),{r:L.r,c:L.c});
  if(!p)return false;
  aPath=p;aPi=0;aProg=0;aTarget=L;aMode='go';
  beep(520,0.12,0.05,'triangle');
  return true;
}
/* 餌を食べ終わったら、抜けた地点そのものへ戻る。
   途中の黄色い丸を飛ばして消してしまわないようにする */
function startBack(fromCell){
  if(!dots.length){aMode='trail';aPath=null;amoeba=0;return;}
  var a=fromCell||aCellNow();
  var lo=Math.min(Math.floor(amoeba),dots.length-1);
  if(lo<0)lo=0;
  var q=cellAt(dots[lo].x,dots[lo].y),p=null,best=lo;
  if(q.r>=0&&q.r<ROWS&&q.c>=0&&q.c<COLS) p=pathTo(a,q);
  if(!p){
    /* 元の地点へ戻れない時だけ、そこから先で一番近い点を探す */
    var d=bfs(a.r,a.c),bd=1e9;best=-1;
    for(var i=lo;i<dots.length;i++){
      var q2=cellAt(dots[i].x,dots[i].y);
      if(q2.r<0||q2.r>=ROWS||q2.c<0||q2.c>=COLS)continue;
      var v=d[q2.r][q2.c];
      if(v<0)continue;
      if(v<bd){bd=v;best=i;}
    }
    if(best<0){aMode='trail';aPath=null;amoeba=Math.min(amoeba,Math.max(0,dots.length-1));return;}
    p=pathTo(a,cellAt(dots[best].x,dots[best].y));
    if(!p){aMode='trail';aPath=null;amoeba=Math.min(amoeba,Math.max(0,dots.length-1));return;}
  }
  aBackIdx=best;aPath=p;aPi=0;aProg=0;aTarget=null;aMode='back';
}
function arrive(){
  if(aMode==='go'){
    aMode='eat';aEatT=now;
    if(aTarget){aTarget.eat=now;onLureTaken(aTarget,null);}
    beep(400,0.2,0.05,'sawtooth');
  }else{
    aMode='trail';aPath=null;
    amoeba=Math.min(aBackIdx,Math.max(0,dots.length-1));
    lastEaten=Math.floor(amoeba);
  }
}
function finishEat(){
  aBoost=LURE_BOOST;                 // 餌を食べたら速さが倍になる（戻りも倍）
  if(aTarget){
    var i=lures.indexOf(aTarget);
    if(i>=0)lures.splice(i,1);
    aTarget=null;
  }
  var L=pickLure();
  if(L&&startGo(L))return;
  startBack();
}
/* 軌跡の最後尾がプレイヤーから十分離れている時だけ湧かせる
   （短い軌跡の上に湧くと、出た瞬間に襲いかかってしまうため） */
function spawnOK(){
  if(dots.length-1<SPAWN_MIN_DOTS)return false;
  return Math.hypot(px-dots[0].x,py-dots[0].y)>=cell*SPAWN_MIN_CELLS;
}
function amoebaSpeed(){
  var t=(now-amoebaT)/1000;
  return Math.min(SPD_MAX*aBoost,(EAT_PER_SEC+(stage-1)*SPD_STAGE)*(1+t*SPD_RAMP)*aBoost);
}
function amoebaWarping(){
  /* キセキがワープ口をまたぐ区間は、地面の裏を通っている扱い */
  if(aMode!=='trail'||!dots.length)return false;
  var i=Math.floor(amoeba);
  if(i>=dots.length-1)return false;
  var a=dots[i],b=dots[i+1];
  return Math.hypot(b.x-a.x,b.y-a.y)>cell*1.6;
}
function amoebaPos(){
  if(aMode==='girl'&&aFreeze)return aFreeze;   // 少女を食べている間は動かない
  if(aMode==='hole')return aHolePos||null;
  if(aMode!=='trail'&&aPath&&aPath.length){
    var a=ctr(aPath[Math.min(aPi,aPath.length-1)].r,aPath[Math.min(aPi,aPath.length-1)].c);
    if(aPi<aPath.length-1){
      var b=ctr(aPath[aPi+1].r,aPath[aPi+1].c);
      return {x:a.x+(b.x-a.x)*aProg,y:a.y+(b.y-a.y)*aProg};
    }
    return a;
  }
  if(!dots.length)return null;
  var i=Math.floor(amoeba),f=amoeba-i;
  var a=dots[Math.min(i,dots.length-1)],b=dots[Math.min(i+1,dots.length-1)];
  return {x:a.x+(b.x-a.x)*f,y:a.y+(b.y-a.y)*f};
}

/* ============ ツルハシ ============ */
function edgeOf(r,c,d){
  if(d==='n')return {r:r,c:c,d:'n'};
  if(d==='s')return {r:r+1,c:c,d:'n'};
  if(d==='w')return {r:r,c:c,d:'w'};
  return {r:r,c:c+1,d:'w'};
}
function canBreak(d){
  var v=DIRS[d],nr=pc.r+v.dr,nc=pc.c+v.dc;
  if(nr<0||nr>=ROWS||nc<0||nc>=COLS)return false;   // 外壁は壊せない
  if(inBed(nr,nc))return false;                     // 中庭の壁は壊せない
  return !!grid[pc.r][pc.c][d];
}
function togglePick(){
  if(state!=='playing')return;
  if(!aiming&&picks<=0){                       // 在庫ゼロなら購入を提案
    if(canBuy('pick'))openBuy('pick');
    else beep(140,0.1,0.04,'square');
    return;
  }
  aiming=!aiming;
  idleT=now;
  beep(aiming?620:300,0.07,0.04,'triangle');
}
function doPick(d){
  if(!aiming||state!=='playing')return;
  if(!canBreak(d)){beep(140,0.1,0.05,'square');return;}   // 狙いは続行
  var e=edgeOf(pc.r,pc.c,d);
  setEdge(e,false);
  picks--;aiming=false;
  score=Math.max(0,score-PICK_COST);
  var L=edgeLine(e);
  breakFx.push({x1:L.x1,y1:L.y1,x2:L.x2,y2:L.y2,t:now});
  idleT=now;
  crashSfx();
}

/* ================= 入力 ================= */
function hitDir(x,y){
  var m=bs*0.12;
  for(var k in dpad){
    var b=dpad[k];
    if(x>=b.x-m&&x<=b.x+b.w+m&&y>=b.y-m&&y<=b.y+b.h+m) return k;
  }
  return null;
}
function inBox(b,x,y,m){return x>=b.x-m&&x<=b.x+b.w+m&&y>=b.y-m&&y<=b.y+b.h+m;}
function hitLure(x,y){return inBox(lureBtn,x,y,bs*0.07);}
function hitPick(x,y){return inBox(pickBtn,x,y,bs*0.07);}
function hitBomb(x,y){return inBox(bombBtn,x,y,bs*0.07);}
function hitCoin(x,y){return inBox(coinBtn,x,y,bs*0.07);}
function hitPause(x,y){return inBox(pauseBtn,x,y,bs*0.10);}
function readTouches(e){
  var r=cv.getBoundingClientRect(),d=null,lp=false,pk=false,bb=false,cn=false,ps=false;
  for(var i=0;i<e.touches.length;i++){
    var x=e.touches[i].clientX-r.left,y=e.touches[i].clientY-r.top;
    var k=hitDir(x,y);
    if(k)d=k;
    if(hitLure(x,y))lp=true;
    if(hitPick(x,y))pk=true;
    if(hitBomb(x,y))bb=true;
    if(hitCoin(x,y))cn=true;
    if(hitPause(x,y))ps=true;
  }
  if(ps&&!pausePressed){
    pauseDownT=now;
    if(state==='playing')enterPause();
    else if(state==='pause'||state==='halt')resumeFromAsk();   // もう一度押すと解除
  }
  if(ps&&state==='pause'&&now-pauseDownT>=3000){state='halt';saveGame();saveInfo=readSave();beep(180,0.2,0.05,'sawtooth');}
  pausePressed=ps;
  if(state==='pause'&&d==='e'&&!dirPressed){dirPressed=true;skipStage();return;}
  if(bb&&!bombPressed)useBomb();
  bombPressed=bb;
  if(cn&&!coinPressed)openShop();
  coinPressed=cn;
  if(pk&&!pickPressed){togglePick();dirPressed=!!d;}
  pickPressed=pk;
  if(lp&&!lurePressed){dropLure();idleT=now;}
  lurePressed=lp;
  if(aiming){
    held=null;idleT=now;
    if(d&&!dirPressed) doPick(d);
    dirPressed=!!d;
    return;
  }
  dirPressed=!!d;
  held=d;
  if(held)idleT=now;
}
function tap(x,y){
  audioUnlock();
  if(state==='title'){
    if(x===undefined)return;
    var sb=startBtn(),hb=howBtn();
    if(saveInfo&&inBox(contBtn(),x,y,8)){
      beep(660,0.08,0.05,'triangle');
      setTimeout(function(){beep(990,0.14,0.05,'triangle');},90);
      continueGame();return;
    }
    if(inBox(demoBtn(),x,y,8)){
      beep(880,0.08,0.05,'triangle');
      var pick=demoNext();demoIdx++;            // 押すたびに順番に切り替わる
      startIdol(true,IDOL_N,pick);
      placeNameInput();return;
    }
    if(ownedList().length>=1&&inBox(dexBtn(),x,y,8)){
      beep(820,0.09,0.05,'triangle');state='dex';dexScroll=0;placeNameInput();return;
    }
    if(inBox(hb,x,y,8)){beep(760,0.09,0.05,'triangle');state='help';helpScroll=0;placeNameInput();return;}
    if(inBox(sb,x,y,8)){beep(880,0.09,0.05,'triangle');startGame();}
    return;
  }
  if(state==='getrare'){
    if(x!==undefined&&inBox(getBtn(),x,y,10))nextGetRare();
    return;
  }
  if(state==='fieldlive'){
    if(x!==undefined&&idolT&&!heartT&&inBox(skipBtn(),x,y,8))skipLive();
    return;
  }
  if(state==='playing'&&x!==undefined&&canFieldLive()&&inBox(fieldBtn(),x,y,8)){
    beep(880,0.09,0.05,'triangle');startFieldLive();return;
  }
  if(state==='idol'){
    if(x!==undefined&&idolT&&!heartT&&inBox(skipBtn(),x,y,8)){skipLive();return;}
    if(x!==undefined&&idolT&&!heartT&&inBox(tipBtn(),x,y,8)){throwTip();return;}
    if(idolDemo&&x!==undefined){musicStop();idolDemo=false;soloId=null;beep(400,0.08,0.045,'triangle');toTitle();}
    return;
  }
  if(state==='dex'){
    if(x===undefined)return;
    var cb2=closeBtn();
    if(renameId){nameEl&&nameEl.blur();return;}
    if(inBox(cb2,x,y,10)){beep(400,0.08,0.045,'triangle');saveDex();state='title';placeNameInput();return;}
    var sl2=soloList();
    if(sl2.length&&inBox(modeBtn(),x,y,8)){          // 真夜中に歌うソロを選ぶ
      var at2=sl2.indexOf(liveMode);
      liveMode=sl2[(at2+1)%sl2.length];
      beep(900,0.07,0.045,'triangle');saveDex();return;
    }
    for(var ri=0;ri<RARE.length;ri++){
      if(!soloDone[RARE[ri].id])continue;
      var rc=renameChip(ri);
      if(x>=rc.x&&x<=rc.x+rc.w&&y>=rc.y&&y<=rc.y+rc.h){
        beep(760,0.07,0.045,'triangle');startRename(RARE[ri].id);return;
      }
    }
    if(ownedList().length<7)return;              // 7人そろうまでは閲覧のみ
    for(var di=0;di<RARE.length;di++){
      var bb2=dexCell(di);
      if(!owned[RARE[di].id])continue;
      if(x>=bb2.x&&x<=bb2.x+bb2.w&&y>=bb2.y&&y<=bb2.y+bb2.h){
        var id=RARE[di].id,at=team.indexOf(id);
        if(at>=0){team.splice(at,1);beep(320,0.07,0.04,'square');}
        else if(team.length<7){team.push(id);beep(880,0.07,0.045,'triangle');}
        else {beep(160,0.09,0.04,'square');}
        saveDex();
        break;
      }
    }
    return;
  }
  if(state==='help'){
    if(x===undefined)return;
    var cb=closeBtn();
    if(inBox(cb,x,y,10)){beep(400,0.08,0.045,'triangle');state='title';placeNameInput();}
    return;
  }
  if(state==='opening'){endOpening();return;}
  if(state==='ready'){state='countdown';cdT=now;cdLast=-1;}
  else if(state==='pause'){
    if(x===undefined)return;
    if(hitPause(x,y)||hitDir(x,y))return;      // ボタンと十字は操作用
    resumeFromAsk();
  }
  else if(state==='halt'){
    if(x===undefined)return;
    if(hitPause(x,y))return;
    resumeFromAsk();
  }
  else if(state==='buy'){
    if(x===undefined)return;
    var bb=askBtns();
    if(inBox(bb.yes,x,y,8)){doBuy(buyKind);resumeFromAsk();}
    else if(inBox(bb.no,x,y,8)){beep(240,0.08,0.04,'square');resumeFromAsk();}
  }
  else if(state==='shop'){
    if(x===undefined)return;
    var sh=shopBtns();
    if(inBox(sh.pick,x,y,8)&&canBuy('pick')){doBuy('pick');resumeFromAsk();}
    else if(inBox(sh.bomb,x,y,8)&&canBuy('bomb')){doBuy('bomb');resumeFromAsk();}
    else if(inBox(sh.cancel,x,y,8)){beep(240,0.08,0.04,'square');resumeFromAsk();}
  }
  else if(state==='ask'){
    var ab=askBtns();
    if(x===undefined)return;
    if(inBox(ab.yes,x,y,8)){rescueGirl();resumeFromAsk();}
    else if(inBox(ab.no,x,y,8)){askLock=true;resumeFromAsk();}
  }
  else if(state==='over'&&now-endT>600){
    if(canRetry){beep(660,0.09,0.05,'triangle');newStage();return;}
    var ob=overBtns();
    if(x===undefined){restartHalf();return;}
    if(ob.up&&inBox(ob.up,x,y,8)){buyLife();return;}
    if(ob.coin&&inBox(ob.coin,x,y,8)){buyCoin();return;}
    if(ob.restart&&inBox(ob.restart,x,y,8)){restartHalf();return;}
  }
  else if(state==='clear'&&now-endT>400){
    var b=nextBtn,m=bs*0.2;
    if(x===undefined||(x>=b.x-m&&x<=b.x+b.w+m&&y>=b.y-m&&y<=b.y+b.h+m)){
      beep(880,0.08,0.05,'triangle');
      stage++;newStage();
    }
  }
}
cv.addEventListener('touchstart',function(e){
  e.preventDefault();
  var r=cv.getBoundingClientRect(),t0=e.touches[0];
  if(state==='help'&&t0)helpDragY=t0.clientY-r.top;
  if(state==='dex'&&t0)dexDragY=t0.clientY-r.top;
  if(t0)tap(t0.clientX-r.left,t0.clientY-r.top); else tap();
  if(state!=='help'&&state!=='dex')readTouches(e);
},{passive:false});
cv.addEventListener('touchmove',function(e){
  e.preventDefault();
  if(state==='help'||state==='dex'){
    var r=cv.getBoundingClientRect(),t0=e.touches[0];
    if(t0){
      var yy=t0.clientY-r.top;
      if(state==='help'){
        if(helpDragY!==null) helpScroll=Math.max(-helpMax,Math.min(0,helpScroll+(yy-helpDragY)));
        helpDragY=yy;
      }else{
        if(dexDragY!==null) dexScroll=Math.max(-dexMax,Math.min(0,dexScroll+(yy-dexDragY)));
        dexDragY=yy;
      }
    }
    return;
  }
  readTouches(e);
},{passive:false});
cv.addEventListener('touchend',function(e){e.preventDefault();helpDragY=null;dexDragY=null;readTouches(e);},{passive:false});
cv.addEventListener('touchcancel',function(e){e.preventDefault();held=null;lurePressed=false;pickPressed=false;dirPressed=false;},{passive:false});
cv.addEventListener('mousedown',function(e){
  var r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
  tap(x,y);
  if(hitPause(x,y)){
    pauseDownT=now;pausePressed=true;
    if(state==='playing')enterPause();
    else if(state==='pause'||state==='halt')resumeFromAsk();
    return;
  }
  if(hitCoin(x,y)){openShop();coinPressed=true;return;}
  if(hitBomb(x,y)){useBomb();bombPressed=true;return;}
  if(hitPick(x,y)){togglePick();pickPressed=true;return;}
  if(hitLure(x,y)){dropLure();lurePressed=true;idleT=now;return;}
  var k=hitDir(x,y);
  if(aiming){if(k)doPick(k);return;}

/* ================= 更新 ================= */
function update(){
  if(state==='countdown'){
    if(now-cdT>=3500) startPlay();
    else{var k=Math.floor((now-cdT)/1000);
      if(k!==cdLast&&k<3){cdLast=k;beep([523,659,784][k],0.13,0.055,'square');}}
  }
  if(state==='tally'){
    var tc=tallyCount();
    if(tc!==tallyLast){
      tallyLast=tc;
      if(now-tallyTick>34){
        tallyTick=now;
        beep(700+Math.min(600,tc*7),0.02,0.025,'square');
      }
    }
    if(now-tallyT>=TALLY_MS&&!tallyDone){
      tallyDone=now;
      pop(px,py-cell*0.9,'TRAJECTORY +'+(tallyN*DOT_PT),'#ffd400');
      beep(1046,0.09,0.05,'triangle');
      setTimeout(function(){beep(1568,0.16,0.05,'triangle');},110);
    }
    /* 救出できていたら、少女が喜ぶ演出を挟む */
    if(tallyDone&&!girlCheerT&&anyFollow()&&now-tallyDone>=600){
      girlCheerT=now;
      var gl5=girlsAll();
      for(var q5=0;q5<gl5.length;q5++)
        if(gl5[q5].state==='follow')pop(gl5[q5].x,gl5[q5].y-cell*1.0,'+'+GIRL_BONUS,'#ff8ac0');
      beep(1174,0.09,0.05,'triangle');
      setTimeout(function(){beep(1568,0.1,0.05,'triangle');},100);
      setTimeout(function(){beep(2093,0.18,0.05,'triangle');},200);
    }
    var endAt=anyFollow()
      ? (girlCheerT?girlCheerT+GIRL_CHEER:Infinity)
      : (tallyDone+TALLY_HOLD);
    if(tallyDone&&now>=endAt){
      var nsv=(girl.state==='follow'?1:0)+(girl2.state==='follow'?1:0);
      var ncat=(girl.state==='follow'&&girl.cat?1:0)+(girl2.state==='follow'&&girl2.cat?1:0);
      savedGirls+=nsv;catMembers+=ncat;
      var gl6=girlsAll();
      getList=[];pendSolo=null;
      for(var q6=0;q6<gl6.length;q6++){
        var gr=gl6[q6];
        if(gr.state==='follow'&&gr.rare){
          getList.push({id:gr.rare,fresh:!owned[gr.rare]});
          owned[gr.rare]=(owned[gr.rare]||0)+1;
          if(owned[gr.rare]>=SOLO_NEED&&!soloDone[gr.rare]){
            soloDone[gr.rare]=1;pendSolo=gr.rare;     // ソロデビュー
            if(liveMode==='group')liveMode=gr.rare;
          }
        }
      }
      if(team.length<7){
        var ow=ownedList();
        for(var q7=0;q7<ow.length&&team.length<7;q7++)
          if(team.indexOf(ow[q7])<0)team.push(ow[q7]);
      }
      saveDex();
      pendIdol=!!(nsv&&savedGirls>=idolNext);
      if(getList.length){getIdx=0;getT=now;state='getrare';getSfx(getList[0].fresh);}
      else if(pendIdol) startIdol(false,idolNext);
      else clearStage();
    }
  }
  if(state==='fieldlive') updateFieldLive();
  if(state==='getrare') updateGetRare();
  if(state==='idol') updateIdol();
  if(state==='opening'&&now-openT>=OPEN_MS) endOpening();
  if(state==='ready'&&(now-readyT)/1000>=viewLimit()){
    state='countdown';cdT=now;cdLast=-1;
  }
  if(state==='shift'){
    var sT=now-shiftT;
    if(!shiftCrashed&&sT>=SH_HOLD){shiftCrashed=true;crashSfx();}
    if(!shiftApplied&&sT>=SH_APPLY) applyShift();
    if(sT>=SH_TOTAL){
      var pause=now-shiftT;
      playT+=pause;amoebaT+=pause;aEatT+=pause;shiftAt+=pause;
      if(nightT)nightT+=pause;
      if(respawnAt)respawnAt+=pause;
      if(fuse)fuse.t0+=pause;
      idleT=now;aLook=now;
      animRem=[];animAdd=[];animSkip={};
      state='playing';
    }
  }
  if(state==='fieldlive'){          // ライブ中もラウスケンは歩ける
    if(held)idleT=now;
    step(dt);
    if(state!=='fieldlive')return;
  }
  if(state==='playing'){
    tBonus=Math.max(0,TIME_MAX-Math.floor((now-playT)/1000)*TIME_DEC);
    if(held)idleT=now;
    if((now-idleT)/1000>=IDLE_LIMIT){gameOver('操作が止まった');return;}
    if(now>=shiftAt){
      if(stage>=NIGHT_FROM&&!nightT) startNight();
      else {shiftAt=now+shiftEvery();reshape();}
    }
    updateNight();spawnFromHoles();
    step(dt);
    if(state!=='playing')return;
    if(fuse){
      var fp=(now-fuse.t0)/FUSE_MS;
      if(!amoebaOn) fuse=null;
      else if(fp>=1) explode();
    }
    if(!amoebaOn&&respawnAt&&now>=respawnAt&&spawnOK()){
      amoebaOn=true;amoebaT=now;amoeba=0;lastEaten=-1;respawnAt=0;
      aMode='trail';aPath=null;aFreeze=null;aTarget=null;
      beep(220,0.3,0.06,'sawtooth');
    }
    if(!amoebaOn&&!respawnAt&&(dots.length-1>=TRIGGER||now-playT>=AMOEBA_TIME)&&spawnOK()){
      amoebaOn=true;amoeba=0;lastEaten=-1;amoebaT=now;
      beep(220,0.25,0.06,'sawtooth');
    }
    checkHoles();
    updateBlockers();
    if(amoebaOn){
      var sp=amoebaSpeed();
      if(aMode==='trail'){
        if(now-aLook>350){aLook=now;var L=pickLure();if(L)startGo(L);}
      }
      if(aMode==='trail'){
        amoeba+=sp*(dt/1000);
        var e=Math.floor(amoeba);
        if(e!==lastEaten){lastEaten=e;beep(260+sp*70,0.05,0.04,'square');}
        if(amoeba>=dots.length-1){
          amoeba=Math.max(0,dots.length-1);
          var ap=amoebaPos();
          if(ap&&Math.hypot(px-ap.x,py-ap.y)<cell*0.55) caught('ヌメリンに食べられた',null);
          else startBack();
        }
      }else if(aMode==='hole'){
        /* 潜っている間は何もしない */
      }else if(aMode==='girl'){
        if(now-aEatT>=GIRL_EAT){
          (function(){var gl3=girlsAll();for(var q3=0;q3<gl3.length;q3++)if(gl3[q3].state==='eating'&&!gl3[q3].eater)gl3[q3].state='gone';})();
          var fz=aFreeze,fc=null;
          if(fz){
            var q=cellAt(fz.x,fz.y);
            if(q.r>=0&&q.r<ROWS&&q.c>=0&&q.c<COLS)fc={r:q.r,c:q.c};
          }
          aFreeze=null;aMode='trail';aPath=null;
          startBack(fc);               // 置き去りの位置から軌跡まで歩いて戻る
          if(aMode==='trail'){
            amoeba=Math.min(amoeba,Math.max(0,dots.length-1));
            lastEaten=Math.floor(amoeba);
          }
        }
      }else if(aMode==='eat'){
        if(now-aEatT>=LURE_EAT) finishEat();
      }else{
        aProg+=sp*SPACING_F*(aMode==='go'?LURE_SPD:1)*(dt/1000);
        var guard=0;
        while(aProg>=1&&aPi<aPath.length-1&&guard++<40){aProg-=1;aPi++;}
        if(aPi>=aPath.length-1){aProg=0;arrive();}
      }
    }
  }
}

/* 1文字ずつ色を変えて描く（色は連番で送る） */
function btRainbow(str,x,y,px,align,trk,ref){
  str=String(str).toUpperCase();trk=trk||0;
  var adv=(6+trk)*px,total=btWidth(str,px,trk),sx=x;
  if(align==='center')sx=x-total/2;else if(align==='right')sx=x-total;
  var top=y-7*px;
  for(var i=0;i<str.length;i++){
    var ch=str.charAt(i);
    if(ch===' ')continue;
    var g=GLYPH[ch];
    if(!g)continue;
    ctx.fillStyle=SUB_COLORS[ref.i%SUB_COLORS.length];
    ref.i++;
    ctx.beginPath();
    var bx=sx+i*adv;
    for(var j=0;j<g.length;j+=2)ctx.rect(bx+g[j]*px,top+g[j+1]*px,px,px);
    ctx.fill();
  }
}
function btWidth(str,px,trk){return str.length*(6+(trk||0))*px-(1+(trk||0))*px;}
/* px=ドットの大きさ。yはベースライン。ASCII以外はシステムフォントで描く */
function bt(str,x,y,px,align,trk){
  str=String(str).toUpperCase();trk=trk||0;
  if(!/^[ -~]*$/.test(str)){
    mono(px*7,'700');ctx.textAlign=align||'left';ctx.fillText(str,x,y);return;
  }
  var adv=(6+trk)*px,total=btWidth(str,px,trk),sx=x;
  if(align==='center')sx=x-total/2;else if(align==='right')sx=x-total;
  var top=y-7*px;
  ctx.beginPath();
  for(var i=0;i<str.length;i++){
    var g=GLYPH[str.charAt(i)];
    if(!g)continue;
    var bx=sx+i*adv;
    for(var j=0;j<g.length;j+=2) ctx.rect(bx+g[j]*px,top+g[j+1]*px,px,px);
  }
  ctx.fill();
}
function rrect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
function blob(x,y,R,t,fill,line){
  ctx.beginPath();
  for(var k=0;k<=26;k++){
    var a=k/26*Math.PI*2;
    var rr=R*(1+0.17*Math.sin(a*3+t*0.006)+0.1*Math.sin(a*5-t*0.0045));
    var qx=x+Math.cos(a)*rr,qy=y+Math.sin(a)*rr;
    if(k)ctx.lineTo(qx,qy);else ctx.moveTo(qx,qy);
  }
  ctx.closePath();ctx.fillStyle=fill;ctx.fill();
  ctx.strokeStyle=line;ctx.lineWidth=1.2;ctx.stroke();
}
function nightMix(hex,k){                 // 暗闇の色へ寄せる
  var c=hexRGB(hex),o='#';
  for(var i=0;i<3;i++){
    var v=Math.round(c[i]*(1-k)+64*k);
    o+=('0'+Math.max(0,Math.min(255,v)).toString(16)).slice(-2);
  }
  return o;
}
function drawMaze(){

                           Math.round(wc[1]*(1-nightK)+255*nightK)+','+
                           Math.round(wc[2]*(1-nightK)+255*nightK)+')';
  }else ctx.strokeStyle=ink(1);
  ctx.lineWidth=Math.max(1.3,cell*0.07);

    if(r>0&&g.n&&!animSkip[r+','+c+',n']){ctx.moveTo(x,y);ctx.lineTo(x+cell,y);}
    if(c>0&&g.w&&!animSkip[r+','+c+',w']){ctx.moveTo(x,y);ctx.lineTo(x,y+cell);}
  }
  ctx.stroke();

}
function mix(a,b,f){
  return 'rgb('+Math.round(a[0]+(b[0]-a[0])*f)+','+Math.round(a[1]+(b[1]-a[1])*f)+','+Math.round(a[2]+(b[2]-a[2])*f)+')';
}
/* B色：白なら50%暗く、黒なら50%明るく＝どちらも50%グレー */
function inkHalf(){
  var v=INKRGB[0];

  return 'rgb('+h+','+h+','+h+')';
}
/* 外周：迷路の外側にぴったり並ぶ正方形ブロック（角も含めて隙間・重なりなし） */
function drawBorder(){
  var T=cell/3,mw=COLS*cell,mh=ROWS*cell;
  var nx=COLS*3+2,ny=ROWS*3;
  var A=[],B=[],idx=0,j,i,c,r;
  function put(x,y,skip){
    if(!skip)(idx%2===0?A:B).push([x,y]);
    idx++;
  }
  for(j=0;j<nx;j++){                                  // 上辺（左上の角から右へ）
    c=Math.floor((j-1)/3);
    put(ox-T+j*T,oy-T,(j>0&&j<nx-1)&&!grid[0][c].n);
  }
  for(i=0;i<ny;i++){                                  // 右辺（上から下へ）
    r=Math.floor(i/3);
    put(ox+mw,oy+i*T,!grid[r][COLS-1].e);
  }
  for(j=nx-1;j>=0;j--){                               // 下辺（右から左へ）
    c=Math.floor((j-1)/3);
    put(ox-T+j*T,oy+mh,(j>0&&j<nx-1)&&!grid[ROWS-1][c].s);
  }
  for(i=ny-1;i>=0;i--){                               // 左辺（下から上へ）
    r=Math.floor(i/3);
    put(ox-T,oy+i*T,!grid[r][0].w);
  }
  var w=Math.ceil(T)+0.5;
  ctx.fillStyle=(nightK>0)?'rgba(255,255,255,'+(0.35+0.65*nightK)+')':ink(1);
  for(i=0;i<A.length;i++)ctx.fillRect(A[i][0],A[i][1],w,w);
  ctx.fillStyle=(nightK>0)?'rgba(128,128,128,'+(0.35+0.65*nightK)+')':inkHalf();
  for(i=0;i<B.length;i++)ctx.fillRect(B[i][0],B[i][1],w,w);
}
function drawShift(){
  if(state!=='shift')return;
  var t=now-shiftT,lw=Math.max(1.3,cell*0.07),i,e,L;
  ctx.lineCap='round';
  for(i=0;i<animRem.length;i++){
    e=animRem[i];L=edgeLine(e);
    var dx=0,dy=0,al=1;
    if(t>SH_HOLD){
      var k=Math.min(1,(t-SH_HOLD)/SH_SLIDE);
      al=1-k;
      if(e.d==='n')dx=k*cell*1.4; else dy=k*cell*1.4;
    }else al=0.55+0.45*Math.sin(t*0.018);
    if(al<=0.01)continue;
    ctx.strokeStyle='rgba('+GRN[0]+','+GRN[1]+','+GRN[2]+','+(al*0.3)+')';ctx.lineWidth=lw*3.4;
    ctx.beginPath();ctx.moveTo(L.x1+dx,L.y1+dy);ctx.lineTo(L.x2+dx,L.y2+dy);ctx.stroke();
    ctx.strokeStyle='rgba('+GRN[0]+','+GRN[1]+','+GRN[2]+','+al+')';ctx.lineWidth=lw*1.5;
    ctx.beginPath();ctx.moveTo(L.x1+dx,L.y1+dy);ctx.lineTo(L.x2+dx,L.y2+dy);ctx.stroke();
  }
  if(t>=SH_APPLY){
    var g=Math.min(1,(t-SH_APPLY)/SH_GROW);
    var f=Math.max(0,Math.min(1,(t-SH_APPLY-SH_GROW)/SH_FADE));
    var col=mix(BLU,WHT,f);
    for(i=0;i<animAdd.length;i++){
      e=animAdd[i];L=edgeLine(e);
      var mx=(L.x1+L.x2)/2,my=(L.y1+L.y2)/2;
      var hx=(L.x2-L.x1)/2*g,hy=(L.y2-L.y1)/2*g;
      if(f<1){
        ctx.strokeStyle='rgba('+BLU[0]+','+BLU[1]+','+BLU[2]+','+(0.3*(1-f))+')';ctx.lineWidth=lw*3.4;
        ctx.beginPath();ctx.moveTo(mx-hx,my-hy);ctx.lineTo(mx+hx,my+hy);ctx.stroke();
      }
      ctx.strokeStyle=col;ctx.lineWidth=lw*(1.5-0.5*f);
      ctx.beginPath();ctx.moveTo(mx-hx,my-hy);ctx.lineTo(mx+hx,my+hy);ctx.stroke();
    }
  }
}
function drawGates(){
  var i,g,v,p,ex,ey,pl;
  for(i=0;i<gates.length;i++){
    g=gates[i];v=DIRS[g.d];p=ctr(g.r,g.c);
    pl=0.5+0.5*Math.sin(now*0.005+i*Math.PI);
    ex=p.x+v.dc*cell*0.5;ey=p.y+v.dr*cell*0.5;
    var hx=v.dr?cell*0.45:0, hy=v.dc?cell*0.45:0;   // 穴の口の向き
    var gc=GATE_COLORS[g.p%GATE_COLORS.length];
    ctx.fillStyle=rgba(gc,0.07+0.07*pl);
    ctx.fillRect(p.x-cell*0.45,p.y-cell*0.45,cell*0.9,cell*0.9);
    ctx.lineCap='round';
    ctx.strokeStyle=rgba(gc,0.55+0.45*pl);
    ctx.lineWidth=Math.max(1.6,cell*0.09);
    for(var k=-1;k<=1;k+=2){
      var ax=ex+hx*k,ay=ey+hy*k;

function drawBed(){
  if(!bed)return;
  var r,c,k;
  var bx0=ox+bed.c0*cell,by0=oy+bed.r0*cell;
  var bw2=(bed.c1-bed.c0+1)*cell,bh2=(bed.r1-bed.r0+1)*cell;
  /* 地面（神殿の面だけ石畳） */
  if(bed.temple){
    drawBricks(bx0,by0,bw2,bh2);
  }else{
    ctx.fillStyle='rgba(52,170,80,0.45)';
    ctx.fillRect(bx0,by0,bw2,bh2);
  }
  /* 内側に太らせたコンクリートブロックの縁 */
  drawBedWall(bx0,by0,bw2,bh2);
  var CF=['#ff4f9a','#ffd400','#ffffff','#ff8a3c','#b06bff'];
  var T2=Math.max(2,Math.max(1.3,cell*0.07)*2);
  for(r=bed.r0;r<=bed.r1;r++)for(c=bed.c0;c<=bed.c1;c++){
    if(bed.temple)continue;                     // 神殿の面には花を植えない
    if(bed.fountain&&
       Math.abs(c+0.5-bed.cx)<=bed.fs/2+0.15&&
       Math.abs(r+0.5-bed.cy)<=bed.fs/2+0.15)continue;
    var h=((r*73856093)^(c*19349663))>>>0;
    for(k=0;k<3;k++){                                  // 1マスに3輪
      var hh=(h>>(k*7))>>>0;
      var fx=ox+c*cell+cell*(0.20+0.60*((hh&15)/15));
      var base=oy+r*cell+cell*(0.55+0.40*(((hh>>4)&15)/15));
      var hgt=cell*(0.30+0.14*(((hh>>8)&7)/7));
      var fy=base-hgt;
      /* 縁のブロックに埋もれないよう内側に寄せる */
      fx=Math.min(Math.max(fx,bx0+T2+cell*0.14),bx0+bw2-T2-cell*0.14);
      base=Math.min(Math.max(base,by0+T2+cell*0.18),by0+bh2-T2-cell*0.05);
      fy=base-hgt;
      var sway=Math.sin(now*0.0025+r*0.8+c*1.4+k*2.1)*cell*0.045;
      var col=CF[(hh>>12)%5],pr=cell*0.10,off=cell*0.108;
      if(k===0){
        ctx.save();ctx.translate(fx,base);ctx.scale(1,0.34);
        ctx.beginPath();ctx.arc(0,0,cell*0.13,0,7);
        ctx.fillStyle='rgba(0,70,25,0.28)';ctx.fill();ctx.restore();
      }
      ctx.strokeStyle='#2e9b46';ctx.lineWidth=Math.max(1,cell*0.042);ctx.lineCap='round';
      ctx.beginPath();
      ctx.moveTo(fx,base);
      ctx.quadraticCurveTo(fx+sway*0.4,base-hgt*0.5,fx+sway,fy);
      ctx.stroke();
      if(k===0){
        ctx.fillStyle='#39ad50';
        ctx.beginPath();
        ctx.moveTo(fx+sway*0.35,base-hgt*0.45);
        ctx.quadraticCurveTo(fx+cell*0.18,base-hgt*0.62,fx+cell*0.17,base-hgt*0.32);
        ctx.quadraticCurveTo(fx+cell*0.09,base-hgt*0.34,fx+sway*0.35,base-hgt*0.45);
        ctx.fill();
      }
      ctx.fillStyle=col;
      ctx.beginPath();
      for(var q=0;q<5;q++){
        var a=(q/5)*Math.PI*2-Math.PI/2;
        var pxx=fx+sway+Math.cos(a)*off,pyy=fy+Math.sin(a)*off*0.68;
        ctx.moveTo(pxx+pr,pyy);
        ctx.arc(pxx,pyy,pr,0,7);
      }
      ctx.fill();
      ctx.beginPath();ctx.arc(fx+sway,fy-cell*0.012,cell*0.072,0,7);
      ctx.fillStyle=(col==='#ffd400')?'#ff8a3c':'#ffd400';ctx.fill();
    }
  }
  if(bed.fountain) drawFountain();
}
/* 赤煉瓦の敷き詰め */
function drawBricks(x,y,w,h){
  var bhh=Math.max(4,cell*0.30),bww=bhh*2.1,mortar=Math.max(1,bhh*0.14);
  ctx.save();
  ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();
  ctx.fillStyle='#8c4a34';ctx.fillRect(x,y,w,h);          // 目地
  var row=0;
  for(var yy=y;yy<y+h;yy+=bhh){
    var off=(row%2)?-bww/2:0;
    for(var xx=x+off;xx<x+w;xx+=bww){
      ctx.fillStyle=((row*7+((xx/bww)|0)*3)%5<2)?'#b3543a':'#c26247';
      ctx.fillRect(xx+mortar/2,yy+mortar/2,bww-mortar,bhh-mortar);
    }
    row++;
  }
  ctx.restore();
}
/* 中庭の縁：内側に張り出したコンクリートブロック */
function drawBedWall(x,y,w,h){
  var T2=Math.max(2,Math.max(1.3,cell*0.07)*2);
  var seg=Math.max(10,cell*0.55);
  ctx.fillStyle='#b3b0a6';
  ctx.fillRect(x,y,w,T2);
  ctx.fillRect(x,y+h-T2,w,T2);
  ctx.fillRect(x,y+T2,T2,h-T2*2);
  ctx.fillRect(x+w-T2,y+T2,T2,h-T2*2);
  /* 天端のハイライトと内側の陰 */
  ctx.fillStyle='rgba(255,255,255,0.28)';
  ctx.fillRect(x,y,w,T2*0.28);
  ctx.fillRect(x,y+h-T2,w,T2*0.28);
  ctx.fillRect(x,y+T2,T2*0.28,h-T2*2);
  ctx.fillRect(x+w-T2,y+T2,T2*0.28,h-T2*2);
  ctx.fillStyle='rgba(0,0,0,0.22)';
  ctx.fillRect(x+T2*0.72,y+T2*0.72,w-T2*1.44,T2*0.28);
  ctx.fillRect(x+T2*0.72,y+h-T2,w-T2*1.44,T2*0.28);
  /* 目地 */
  ctx.strokeStyle='rgba(0,0,0,0.30)';ctx.lineWidth=1;
  ctx.beginPath();
  for(var xx=x+seg;xx<x+w-2;xx+=seg){
    ctx.moveTo(xx,y);ctx.lineTo(xx,y+T2);
    ctx.moveTo(xx,y+h-T2);ctx.lineTo(xx,y+h);
  }
  for(var yy=y+T2+seg;yy<y+h-T2-2;yy+=seg){
    ctx.moveTo(x,yy);ctx.lineTo(x+T2,yy);
    ctx.moveTo(x+w-T2,yy);ctx.lineTo(x+w,yy);
  }
  ctx.stroke();
  ctx.strokeStyle='rgba(0,0,0,0.35)';
  ctx.strokeRect(x+T2,y+T2,w-T2*2,h-T2*2);
}

/* B：三段重ねの噴水。上の皿から縁を伝って落ちる */
function drawFountainB(){

/* C：石像から左右に水を吐く噴水 */

    var a=q/8*Math.PI*2+Math.PI/8;

  ctx.fillStyle='rgba(95,195,255,0.75)';ctx.fill();

  ctx.beginPath();ctx.arc(x,top-u*0.16,u*0.15,0,7);ctx.fill();

  ctx.fillStyle='rgba(190,235,255,0.95)';
  for(var k=0;k<14;k++){
    var t=((now*0.0006)+k/14)%1;

    var yy2=(top-u*0.16)-u*0.16*Math.sin(Math.PI*t)+(base-ry*0.85-(top-u*0.16))*t*t;

  }
}
/* 赤煉瓦の広場に立つ白い馬と干し草（ステージ9） */
function drawTemple(){
  var bw2=(bed.c1-bed.c0+1)*cell,bh2=(bed.r1-bed.r0+1)*cell;
  var bx0=ox+bed.c0*cell,by0=oy+bed.r0*cell;
  var u=Math.min(bw2,bh2)*0.62;
  var x=ox+bed.cx*cell,cy=oy+bed.cy*cell;
  var T2=Math.max(2,Math.max(1.3,cell*0.07)*2);
  var inTop=by0+T2,inBot=by0+bh2-T2;
  /* 馬は手前（下）、干し草は奥（上）に置く */
  var g=Math.max(inTop+u*1.06,Math.min(cy+u*0.62,inBot-cell*0.18));
  /* うなずき：基本は真っ直ぐ、たまに少し上下 */
  var nod=Math.sin(now*0.00045)*0.62+Math.sin(now*0.00017)*0.38;
  var hy=nod*u*0.13, tip=nod*u*0.06;
  var sway=Math.sin(now*0.0016)*u*0.02;
  var BODY='#f4f1e8',SHADE='#d5cfbf',HAIR='#7a5230',HAIR2='#5d3d24';
  /* 影 */
  ctx.save();ctx.translate(x,g+u*0.02);ctx.scale(1,0.22);
  ctx.beginPath();ctx.arc(0,0,u*0.46,0,7);
  ctx.fillStyle='rgba(0,0,0,0.30)';ctx.fill();ctx.restore();
  /* 後ろ脚 */
  ctx.fillStyle=SHADE;
  ctx.fillRect(x-u*0.30,g-u*0.30,u*0.09,u*0.30);
  ctx.fillRect(x+u*0.06,g-u*0.30,u*0.09,u*0.30);
  /* 尻尾 */
  ctx.strokeStyle=HAIR;ctx.lineWidth=Math.max(2,u*0.08);ctx.lineCap='round';
  ctx.beginPath();
  ctx.moveTo(x-u*0.33,g-u*0.50);
  ctx.quadraticCurveTo(x-u*0.52,g-u*0.34-sway*2,x-u*0.45,g-u*0.08);
  ctx.stroke();
  /* 胴 */
  ctx.fillStyle=BODY;
  ctx.beginPath();
  if(ctx.ellipse)ctx.ellipse(x-u*0.02,g-u*0.42,u*0.34,u*0.19,0,0,7);
  else ctx.arc(x-u*0.02,g-u*0.42,u*0.28,0,7);
  ctx.fill();
  /* 前脚 */
  ctx.fillStyle=BODY;
  ctx.fillRect(x-u*0.24,g-u*0.34,u*0.10,u*0.34);
  ctx.fillRect(x+u*0.16,g-u*0.34,u*0.10,u*0.34);
  ctx.fillStyle=SHADE;
  ctx.fillRect(x-u*0.24,g-u*0.06,u*0.10,u*0.06);
  ctx.fillRect(x+u*0.16,g-u*0.06,u*0.10,u*0.06);
  /* 首 */
  ctx.fillStyle=BODY;
  ctx.beginPath();
  ctx.moveTo(x+u*0.16,g-u*0.54);
  ctx.lineTo(x+u*0.38,g-u*0.86+hy);
  ctx.lineTo(x+u*0.50,g-u*0.80+hy);
  ctx.lineTo(x+u*0.30,g-u*0.42);
  ctx.closePath();ctx.fill();
  /* 頭（少し上下する） */
  ctx.beginPath();
  ctx.moveTo(x+u*0.37,g-u*0.88+hy);
  ctx.lineTo(x+u*0.62,g-u*0.93+hy+tip);
  ctx.lineTo(x+u*0.66,g-u*0.83+hy+tip);
  ctx.lineTo(x+u*0.41,g-u*0.76+hy);
  ctx.closePath();ctx.fill();
  ctx.fillStyle=SHADE;                       // 鼻づら
  ctx.beginPath();
  ctx.moveTo(x+u*0.57,g-u*0.92+hy+tip);
  ctx.lineTo(x+u*0.66,g-u*0.90+hy+tip);
  ctx.lineTo(x+u*0.66,g-u*0.83+hy+tip);
  ctx.lineTo(x+u*0.57,g-u*0.82+hy+tip);
  ctx.closePath();ctx.fill();
  /* 耳 */
  ctx.fillStyle=BODY;
  ctx.beginPath();
  ctx.moveTo(x+u*0.39,g-u*0.90+hy);
  ctx.lineTo(x+u*0.42,g-u*1.00+hy);
  ctx.lineTo(x+u*0.46,g-u*0.89+hy);
  ctx.closePath();ctx.fill();
  /* たてがみ */
  ctx.fillStyle=HAIR;
  ctx.beginPath();
  ctx.moveTo(x+u*0.20,g-u*0.58);
  ctx.lineTo(x+u*0.41,g-u*0.92+hy);
  ctx.lineTo(x+u*0.34,g-u*0.95+hy);
  ctx.lineTo(x+u*0.13,g-u*0.60);
  ctx.closePath();ctx.fill();
  ctx.strokeStyle=HAIR2;ctx.lineWidth=Math.max(1,u*0.02);
  ctx.beginPath();
  ctx.moveTo(x+u*0.17,g-u*0.59);ctx.lineTo(x+u*0.37,g-u*0.93+hy);
  ctx.stroke();
  /* 目 */
  ctx.fillStyle='#2a2119';
  ctx.beginPath();ctx.arc(x+u*0.49,g-u*0.86+hy+tip*0.6,u*0.028,0,7);ctx.fill();
  /* 干し草 */
  var hr=u*0.26;
  var hayX=Math.max(bx0+T2+hr*1.1,Math.min(bx0+bw2-T2-hr*1.1,x-u*0.50));
  var hayY=Math.max(inTop+hr*1.0,Math.min(g-u*1.05,cy-u*0.55));
  drawHay(hayX,hayY,hr);
}
function drawHay(hx,hy2,r){
  ctx.save();ctx.translate(hx,hy2);ctx.scale(1,0.24);
  ctx.beginPath();ctx.arc(0,0,r*0.95,0,7);
  ctx.fillStyle='rgba(0,0,0,0.25)';ctx.fill();ctx.restore();
  ctx.fillStyle='#d8ab4a';
  ctx.beginPath();
  ctx.moveTo(hx-r,hy2);
  ctx.quadraticCurveTo(hx-r*0.7,hy2-r*0.95,hx,hy2-r*0.80);
  ctx.quadraticCurveTo(hx+r*0.7,hy2-r*0.95,hx+r,hy2);
  ctx.closePath();ctx.fill();
  ctx.strokeStyle='#b98a2e';ctx.lineWidth=Math.max(1,r*0.07);ctx.lineCap='round';
  ctx.beginPath();
  for(var k=0;k<7;k++){
    var t=k/6,sx=hx-r*0.9+r*1.8*t;
    ctx.moveTo(sx,hy2-r*0.05);
    ctx.lineTo(sx+r*(0.12-0.24*((k%3)/2)),hy2-r*(0.45+0.3*Math.abs(Math.sin(k*1.7))));
  }
  ctx.stroke();
  ctx.strokeStyle='#f0cd82';ctx.lineWidth=Math.max(1,r*0.05);
  ctx.beginPath();
  ctx.moveTo(hx-r*0.55,hy2-r*0.25);ctx.lineTo(hx-r*0.2,hy2-r*0.72);
  ctx.moveTo(hx+r*0.25,hy2-r*0.30);ctx.lineTo(hx+r*0.62,hy2-r*0.60);
  ctx.stroke();
}
function drawHoles(){

      var k=Math.min(1,(now-h.open)/350);
      ctx.save();ctx.translate(p.x,p.y);ctx.scale(1,0.60);
      ctx.beginPath();ctx.arc(0,0,R,0,7);
      ctx.fillStyle='rgba(0,0,0,0.85)';ctx.fill();
      ctx.strokeStyle=ink(0.55);ctx.lineWidth=Math.max(1,cell*0.05);ctx.stroke();
      ctx.restore();

function drawCoins(){

function drawAmoeba(){

function drawGuitar(x,y,h,col,sit){            /* 洋梨の形のアコースティックギター */
  var w=h*0.5;
  ctx.save();
  ctx.translate(x,y+h*(sit?0.16:0.10));
  ctx.rotate(sit?-0.22:-0.35);
  var BC=col||'#8a4a22';
  ctx.fillStyle=BC;
  /* 下の胴（大きい） */
  ctx.beginPath();
  ctx.ellipse?ctx.ellipse(0,h*0.055,w*0.44,h*0.150,0,0,7):ctx.arc(0,h*0.05,w*0.44,0,7);
  ctx.fill();
  /* 上の胴（小さい）— 重なって洋梨のくびれになる */
  ctx.beginPath();
  ctx.ellipse?ctx.ellipse(0,-h*0.120,w*0.32,h*0.115,0,0,7):ctx.arc(0,-h*0.12,w*0.32,0,7);
  ctx.fill();
  /* くびれをつなぐ */
  ctx.beginPath();
  ctx.moveTo(-w*0.30,-h*0.120);
  ctx.quadraticCurveTo(-w*0.26,-h*0.030,-w*0.40,h*0.055);
  ctx.lineTo(w*0.40,h*0.055);
  ctx.quadraticCurveTo(w*0.26,-h*0.030,w*0.30,-h*0.120);
  ctx.closePath();ctx.fill();
  /* ふちの濃い線 */
  ctx.strokeStyle='rgba(0,0,0,0.35)';ctx.lineWidth=Math.max(1,h*0.008);
  ctx.beginPath();
  ctx.ellipse?ctx.ellipse(0,h*0.055,w*0.44,h*0.150,0,0,7):ctx.arc(0,h*0.05,w*0.44,0,7);
  ctx.stroke();
  /* サウンドホール */
  ctx.fillStyle='#2b1a0e';
  ctx.beginPath();ctx.arc(0,-h*0.040,w*0.105,0,7);ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,0.25)';ctx.lineWidth=Math.max(1,h*0.006);
  ctx.beginPath();ctx.arc(0,-h*0.040,w*0.135,0,7);ctx.stroke();
  /* 黒いピックガード */
  ctx.fillStyle='#17171c';
  ctx.beginPath();
  ctx.moveTo(w*0.13,-h*0.010);
  ctx.quadraticCurveTo(w*0.40,h*0.000,w*0.36,h*0.090);
  ctx.quadraticCurveTo(w*0.22,h*0.075,w*0.11,h*0.030);
  ctx.closePath();ctx.fill();
  /* ネック */
  ctx.fillStyle='#4a2f1b';
  ctx.fillRect(-w*0.055,-h*0.52,w*0.11,h*0.40);
  ctx.strokeStyle='rgba(0,0,0,0.25)';ctx.lineWidth=Math.max(0.8,h*0.005);
  for(var fr=1;fr<5;fr++){
    ctx.beginPath();
    ctx.moveTo(-w*0.055,-h*0.52+h*0.40*(fr/5));
    ctx.lineTo(w*0.055,-h*0.52+h*0.40*(fr/5));
    ctx.stroke();
  }
  /* 白いヘッド */
  ctx.fillStyle='#f4f2ec';
  ctx.beginPath();
  ctx.moveTo(-w*0.075,-h*0.515);
  ctx.lineTo(w*0.075,-h*0.515);
  ctx.lineTo(w*0.090,-h*0.620);
  ctx.lineTo(-w*0.090,-h*0.620);
  ctx.closePath();ctx.fill();
  ctx.fillStyle='#c9ccd4';
  for(var pg=0;pg<3;pg++){
    ctx.beginPath();ctx.arc(-w*0.055+pg*w*0.055,-h*0.570,w*0.016,0,7);ctx.fill();
  }
  /* 弦 */
  ctx.strokeStyle='rgba(255,255,255,0.45)';ctx.lineWidth=Math.max(0.8,h*0.005);
  for(var i=0;i<4;i++){
    ctx.beginPath();
    ctx.moveTo(-w*0.035+i*w*0.023,-h*0.56);
    ctx.lineTo(-w*0.035+i*w*0.023,h*0.12);
    ctx.stroke();
  }
  ctx.restore();
}
function drawMic(x,y,h){                       /* 手とマイク。顔より必ず手前 */
  var w=h*0.5;
  if(micHang){                                 /* 上から吊り下げたマイク */
    var mx5=x+w*0.30,top5=y-h*1.30,tip=y-h*0.26;
    ctx.strokeStyle='#2b2b33';ctx.lineWidth=Math.max(1.2,h*0.016);
    ctx.beginPath();ctx.moveTo(mx5,top5);ctx.lineTo(mx5,tip-h*0.06);ctx.stroke();
    ctx.fillStyle='#3a3a44';
    ctx.fillRect(mx5-h*0.022,tip-h*0.075,h*0.044,h*0.045);
    ctx.fillStyle='#e8ebf2';
    ctx.beginPath();ctx.arc(mx5,tip,h*0.058,0,7);ctx.fill();
    ctx.fillStyle='#9aa0ad';
    ctx.beginPath();ctx.arc(mx5,tip+h*0.004,h*0.038,0,7);ctx.fill();
    ctx.fillStyle='#ffffff';
    ctx.beginPath();ctx.arc(mx5-h*0.022,tip-h*0.022,h*0.016,0,7);ctx.fill();
    return;
  }
  if(micHead){                                 /* ヘッドセットマイク */
    var hy2=y-h*0.40,hr2=h*0.19;
    ctx.strokeStyle='#2b2b33';ctx.lineWidth=Math.max(1.4,h*0.022);
    ctx.lineCap='round';
    ctx.beginPath();                            // 頭を通すバンド
    ctx.arc(x,hy2,hr2*1.18,Math.PI*1.08,Math.PI*1.92);
    ctx.stroke();
    ctx.fillStyle='#3a3a44';                    // 耳のパッド
    ctx.beginPath();ctx.arc(x+hr2*1.12,hy2+hr2*0.10,hr2*0.26,0,7);ctx.fill();
    ctx.beginPath();                            // 口元へのアーム
    ctx.moveTo(x+hr2*1.05,hy2+hr2*0.22);
    ctx.quadraticCurveTo(x+hr2*0.95,hy2+hr2*0.95,x+hr2*0.30,hy2+hr2*0.78);
    ctx.strokeStyle='#2b2b33';ctx.lineWidth=Math.max(1.1,h*0.016);
    ctx.stroke();
    ctx.fillStyle='#e8ebf2';                    // 小さなマイク
    ctx.beginPath();ctx.arc(x+hr2*0.24,hy2+hr2*0.78,h*0.026,0,7);ctx.fill();
    return;
  }
  if(micStand){                                /* スタンドマイク */
    var sx=x+w*0.46,base=y+h*0.42,top=y-h*0.34;
    ctx.save();
    ctx.translate(sx,base);
    if(!(rareOv&&rareOv.noHold))ctx.rotate(micSwing*0.20);   // 固定のスタンド
    ctx.fillStyle='#1f1f26';                   // 台座
    ctx.beginPath();
    ctx.ellipse?ctx.ellipse(0,0,h*0.13,h*0.035,0,0,7):ctx.arc(0,0,h*0.10,0,7);
    ctx.fill();
    ctx.strokeStyle='#3a3a44';ctx.lineWidth=Math.max(1.6,h*0.030);ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,top-base);ctx.stroke();  // 支柱
    ctx.strokeStyle='#5a5a66';ctx.lineWidth=Math.max(1,h*0.014);
    ctx.beginPath();ctx.moveTo(-h*0.012,-h*0.10);ctx.lineTo(-h*0.012,top-base+h*0.10);ctx.stroke();
    ctx.fillStyle='#2b2b33';                   // 高さ調整のリング
    ctx.beginPath();ctx.arc(0,(top-base)*0.45,h*0.030,0,7);ctx.fill();
    ctx.fillStyle='#e8ebf2';                   // マイク本体
    ctx.beginPath();ctx.arc(0,top-base-h*0.03,h*0.072,0,7);ctx.fill();
    ctx.fillStyle='#9aa0ad';
    ctx.beginPath();ctx.arc(0,top-base-h*0.025,h*0.048,0,7);ctx.fill();
    ctx.fillStyle='#ffffff';
    ctx.beginPath();ctx.arc(-h*0.026,top-base-h*0.055,h*0.020,0,7);ctx.fill();
    if(!(rareOv&&rareOv.noHold)){               // 支柱を握る手（ひとつだけ）
      ctx.fillStyle=(rareOv&&rareOv.skin)||SKIN;
      ctx.beginPath();ctx.arc(0,top-base+h*0.13,h*0.082,0,7);ctx.fill();
    }
    ctx.restore();
    /* コード */
    ctx.strokeStyle='#2b2b33';ctx.lineWidth=Math.max(1,h*0.018);
    ctx.beginPath();
    ctx.moveTo(sx,base-h*0.02);
    ctx.quadraticCurveTo(sx+w*0.55,base+h*0.02,sx+w*0.30,base+h*0.10);
    ctx.stroke();
    return;
  }
  var mx2=x+w*0.30+micSwing*w*0.36;             // 口より下。時々左右に振れる
  var my2=y-h*0.09;
  ctx.save();
  ctx.translate(mx2,my2);
  ctx.rotate(-0.42+micSwing*0.55);
  ctx.strokeStyle='#2b2b33';ctx.lineWidth=Math.max(1.4,h*0.032);
  ctx.lineCap='round';
  ctx.beginPath();                              // 柄
  ctx.moveTo(0,h*0.150);
  ctx.lineTo(0,-h*0.010);
  ctx.stroke();
  ctx.fillStyle='#2b2b33';                      // 根元のリング
  ctx.beginPath();ctx.arc(0,-h*0.020,h*0.040,0,7);ctx.fill();
  ctx.fillStyle='#e8ebf2';                      // ヘッド（小さめ）
  ctx.beginPath();ctx.arc(0,-h*0.072,h*0.078,0,7);ctx.fill();
  ctx.fillStyle='#9aa0ad';                      // 網目
  ctx.beginPath();ctx.arc(0,-h*0.066,h*0.052,0,7);ctx.fill();
  ctx.fillStyle='#ffffff';                      // つや
  ctx.beginPath();ctx.arc(-h*0.030,-h*0.098,h*0.022,0,7);ctx.fill();
  ctx.fillStyle=(rareOv&&rareOv.skin)||SKIN;    // 握る手（ひとつだけ）
  ctx.beginPath();ctx.arc(0,h*0.055,h*0.080,0,7);ctx.fill();
  ctx.restore();
}

    ctx.lineTo(bx+cell*0.3+i*cell*0.3,oy);
    ctx.lineTo(bx+sw*cell*2+cell*1.6,by2+HH*0.5);

function drawPops(){
  for(var i=pops.length-1;i>=0;i--){
