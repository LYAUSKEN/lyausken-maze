var confetti=[];
function makeConfetti(){
  confetti=[];
  var CC=['#ff3b30','#ffd400','#3f8bff','#34d15a','#ff6fc8','#a878ff','#4fe3ff','#ff8a3c','#ffffff'];
  for(var i=0;i<54;i++){
    confetti.push({u:Math.random(),v:Math.random(),
      s:0.55+Math.random()*0.9,
      w:3+Math.random()*4.5,h:5+Math.random()*5,
      p:Math.random()*Math.PI*2,sp:1.4+Math.random()*2.6,
      c:CC[(Math.random()*CC.length)|0]});
  }
}
function drawConfetti(x,y,w,h){
  if(!confetti.length)return;
  ctx.save();
  ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();
  var t=now*0.001;
  for(var i=0;i<confetti.length;i++){
    var c=confetti[i];
    var py=((c.v+t*c.s*0.24)%1+1)%1;
    var pu=((c.u+Math.sin(t*c.sp+c.p)*0.045)%1+1)%1;
    var X=x+pu*w,Y=y+py*h;
    var sc=Math.abs(Math.cos(t*c.sp*1.25+c.p))*0.85+0.15;
    ctx.fillStyle=c.c;
    ctx.fillRect(X-c.w*sc*0.5,Y-c.h*0.5,Math.max(1,c.w*sc),c.h);
  }
  ctx.restore();
}
function drawClearScene(cx,gy,h,withGirl){
  var hop=Math.abs(Math.sin(now*0.0043))*h*0.26;
  var fx=cx-(withGirl?h*1.30:h*0.85);
  /* ゴールの旗 */
  ctx.strokeStyle='#ffffff';ctx.lineWidth=Math.max(1.4,h*0.05);ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(fx,gy);ctx.lineTo(fx,gy-h*1.15);ctx.stroke();
  var wv=Math.sin(now*0.006)*h*0.05;
  ctx.beginPath();
  ctx.moveTo(fx,gy-h*1.15);
  ctx.quadraticCurveTo(fx+h*0.34,gy-h*1.06+wv,fx+h*0.56,gy-h*0.95);
  ctx.quadraticCurveTo(fx+h*0.30,gy-h*0.86-wv,fx,gy-h*0.78);
  ctx.closePath();
  ctx.fillStyle='#ff2d4d';ctx.fill();
  /* 地面の影 */
  ctx.save();ctx.translate(cx,gy+2);ctx.scale(1,0.22);
  ctx.beginPath();ctx.arc(0,0,h*(withGirl?1.0:0.55),0,7);
  ctx.fillStyle='rgba(0,0,0,0.45)';ctx.fill();ctx.restore();
  /* 足の着地線を旗の根元と同じ高さに揃える */
  var boyY=gy-h*0.46-hop;
  if(withGirl){
    var gh=h*0.94,girlY=gy-gh*0.40-hop;
    var bx=cx-h*0.40,gx=bx+h*0.447+gh*0.36;
    drawBoy(bx,boyY,h,'s',true);
    drawGirl(gx,girlY,gh,1,'s',true);
    /* つないだ手 */
    ctx.strokeStyle=SKIN;ctx.lineWidth=Math.max(1.6,h*0.07);ctx.lineCap='round';
    ctx.beginPath();
    ctx.moveTo(bx+h*0.447,boyY-h*0.44);
    ctx.lineTo(gx-gh*0.36,girlY-gh*0.44);
    ctx.stroke();
  }else{
    drawBoy(cx+h*0.30,boyY,h,'s',true);
  }
}
function panel(lines,title,withNext,scene){
  var sceneH=scene?70:0;
  var h=Math.min(H*0.80,86+lines.length*28+(withNext?54:0)+sceneH),y=(H-h)/2;
  ctx.fillStyle='#000000';ctx.fillRect(0,y,W,h);
  if(scene) drawConfetti(0,y,W,h);
  ctx.strokeStyle='rgba(255,255,255,0.35)';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(0,y+0.5);ctx.lineTo(W,y+0.5);
  ctx.moveTo(0,y+h-0.5);ctx.lineTo(W,y+h-0.5);ctx.stroke();
  ctx.fillStyle='#ffd400';
  bt(title,W/2,y+46,3,'center',1);
  if(scene) drawClearScene(W/2,y+46+sceneH-8,Math.min(46,sceneH*0.62),scene==='girl');
  for(var i=0;i<lines.length;i++){
    ctx.fillStyle=(i===lines.length-1)?'rgba(255,255,255,0.75)':'#ffffff';
    bt(lines[i],W/2,y+78+sceneH+i*28,2,'center',0);
  }
  if(withNext){
    var b=nextBtn,pul=0.5+0.5*Math.sin(now*0.006);
    b.y=y+h-64;
    rrect(b.x,b.y,b.w,b.h,b.h*0.42);
    ctx.fillStyle='rgba(255,212,0,'+(0.16+0.12*pul)+')';ctx.fill();
    ctx.strokeStyle='rgba(255,212,0,'+(0.75+0.25*pul)+')';ctx.lineWidth=1.6;ctx.stroke();
    ctx.fillStyle='#ffd400';
    bt('NEXT',b.x+b.w/2,b.y+b.h/2+7,3,'center',2);
  }
}
function drawOverlay(){
  var my=oy+ROWS*cell/2;
  if(state==='ready'){
    var left=Math.max(0,Math.ceil(viewLimit()-(now-readyT)/1000));
    ctx.textAlign='center';
    mono(11,'600');ctx.fillStyle=ink(0.8);
    ctx.fillText('タップしてスタート',W/2,my-30);
    mono(9,'500');ctx.fillStyle=ink(0.4);
    ctx.fillText('十字ボタンでゴールへ',W/2,my-10);
    ctx.fillStyle=left<=3?SIG_R:ink(0.55);
    bt('MAP '+left,W/2,my+22,3,'center',1);
  }
  if(state==='countdown'){
    var e=now-cdT,k=Math.floor(e/1000),t=(e%1000)/1000;
    var txt=k<3?String(3-k):'START',sc=k<3?(1.25-0.25*t):1;
    var col=k<1?SIG_R:k<2?SIG_Y:SIG_G;
    ctx.save();
    ctx.translate(W/2,my);ctx.scale(sc,sc);
    ctx.globalAlpha=k<3?(1-t*0.35):1;
    ctx.fillStyle=k<3?col:SIG_G;
    bt(txt,0,k<3?26:8,k<3?8:4,'center',k<3?0:1);
    ctx.restore();
  }
  if(aiming&&state==='playing'){
    ctx.textAlign='center';mono(10,'700');
    ctx.fillStyle=rgba(ORG,0.6+0.4*Math.sin(now*0.012));
    ctx.fillText('壊す方向を選ぶ   -'+PICK_COST,W/2,padTop-26);
  }
  if(state==='shift'){
    var st2=now-shiftT;
    ctx.fillStyle=ink(0.9);
    bt('MAZE SHIFT',W/2,my-12,3,'center',1);
    ctx.textAlign='center';mono(10,'600');

  if(state==='pause'||state==='halt'){
    ctx.fillStyle='rgba(0,0,0,0.78)';
    ctx.fillRect(0,oy-4,W,ROWS*cell+8);
    var my2=oy+ROWS*cell*0.5;

    ctx.fillStyle='#ffffff';
    if(state==='pause'){
      bt('PRESS RIGHT : SKIP STAGE',W/2,my2+6,2,'center',1);
      bt('NO CLEAR BONUS',W/2,my2+30,1,'center',2);
      ctx.fillStyle='rgba(255,255,255,0.65)';
      bt('HOLD PAUSE 3S : SUSPEND',W/2,my2+56,1,'center',2);
      bt('TAP SCREEN : RESUME',W/2,my2+76,1,'center',2);

      ctx.fillStyle='rgba(255,255,255,0.7)';
      bt('TAP SCREEN TO RESUME',W/2,my2+10,2,'center',1);

  }
  if(state==='buy'||state==='shop'){
    ctx.fillStyle='rgba(0,0,0,0.72)';
    ctx.fillRect(0,oy-4,W,ROWS*cell+8);
  }
  if(state==='buy'){
    var q=(buyKind==='pick')

    ctx.fillStyle='#f2b705';
    bt('COIN '+wallet,W/2,oy+ROWS*cell*0.36+52,2,'center',2);

      bt(yes?'YES':'NO',b.x+b.w/2,b.y+b.h/2+9,3,'center',2);

    });
    var cb=sh.cancel;
    rrect(cb.x,cb.y,cb.w,cb.h,cb.h*0.42);
    ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.4)';ctx.lineWidth=1.3;ctx.stroke();
    ctx.fillStyle='#ffffff';
    bt('CANCEL',cb.x+cb.w/2,cb.y+cb.h/2+7,2,'center',1);
  }
  if(state==='ask'){
    ctx.fillStyle=DARKBG?'rgba(0,0,0,0.55)':'rgba(255,255,255,0.55)';
    ctx.fillRect(0,oy-4,W,ROWS*cell+8);
    var jp=ctr(jail.r,jail.c);
    drawJail();
    bubble(jp.x,jp.y-cell*0.5,'HELP ME!',RED);
    var ab=askBtns();
    ['yes','no'].forEach(function(k){
      var b=ab[k],yes=(k==='yes');
      rrect(b.x,b.y,b.w,b.h,b.h*0.42);
      ctx.fillStyle=yes?rgba(SIG_G,0.9):BTN_BG;ctx.fill();
      ctx.strokeStyle=yes?SIG_G:rgba(BTN_TX,0.4);ctx.lineWidth=1.4;ctx.stroke();
      var lb=yes?'YES':'NO',lc=yes?'#062211':'#ffffff',lh=26;
      try{lh=pixelCanvas(lb,lc,1).height*2;}catch(e){}
      pixelText(lb,b.x+b.w/2,b.y+(b.h-lh)/2,2,'center',lc,1);
    });
  }
  if(state==='clear'){
    var ln=['TRAJECTORY +'+clearDots,'GOAL +'+GOAL_PT,'TIME +'+tBonus];
    if(girlPen)ln.push('WATONER -'+girlPen);
    else if(GIRL_BONUS&&girl.state==='follow')ln.push('WATONER +'+GIRL_BONUS);
    if(idolBonus)ln.push('HEART x'+idolBonus+'   1UP');
    ln.push('TOTAL '+total);
    panel(ln,'STAGE CLEAR',true,(girl.state==='follow')?'girl':'solo');
  }
  if(state==='over'){
    if(canRetry) panel([overMsg,'CHANCE '+lives+'/'+LIVES,'TOTAL '+total,'タップでもう一度'],'RETRY');
    else panel([overMsg,'STAGE '+overScore,'TOTAL '+total,'タップでタイトルへ'],'GAME OVER');
  }
}

function drawOpening(){
  ctx.fillStyle=TITLE_BG;ctx.fillRect(0,0,W,H);
  if(!drawTitleArt()){
    var ty0=H*0.20,sc=3.6,th=90,stretch=TITLE_COND*TITLE_SY/TITLE_SX;
    try{
      var tc=pixelCanvas(TITLE_TXT,'#ffffff',stretch);
      sc=Math.max(2,Math.floor((W*0.90)/tc.width))*TITLE_SX;
      th=tc.height*sc;
    }catch(e){}
    pixelText(TITLE_TXT,W/2,ty0,sc,'center','#ffffff',stretch);
    var ref={i:0},ly=ty0+th+14;
    for(var li=0;li<SUB_LINES.length;li++) btRainbow(SUB_LINES[li],W/2,ly+li*26,3,'center',1,ref);
  }
  var p=Math.min(1,(now-openT)/OPEN_MS);
  ctx.fillStyle='rgba(255,255,255,0.20)';ctx.fillRect(W*0.15,H*0.82,W*0.70,4);
  ctx.fillStyle=YEL;ctx.fillRect(W*0.15,H*0.82,W*0.70*p,4);
  ctx.fillStyle=ink(0.85);
  bt('STAGE '+two(stage),W/2,H*0.80,3,'center',2);
  if(Math.floor(now/500)%2===0){
    ctx.fillStyle=ink(0.5);
    bt('TAP TO SKIP',W/2,H*0.875,2,'center',2);
  }
}
function drawTitle(){
  ctx.fillStyle=TITLE_BG;ctx.fillRect(0,0,W,H);
  if(!drawTitleArt()){                       // 画像が未読込の時だけ文字で代用
    var ty0=H*0.075,sc=3.6,th=90,stretch=TITLE_COND*TITLE_SY/TITLE_SX;
    try{
      var tc=pixelCanvas(TITLE_TXT,'#ffffff',stretch);
      sc=Math.max(2,Math.floor((W*0.90)/tc.width))*TITLE_SX;
      th=tc.height*sc;
    }catch(e){}
    pixelText(TITLE_TXT,W/2,ty0,sc,'center','#ffffff',stretch);
    var ref={i:0},ly=ty0+th+14;
    for(var li=0;li<SUB_LINES.length;li++) btRainbow(SUB_LINES[li],W/2,ly+li*26,3,'center',1,ref);
  }

  /* 名前の枠 */
  var b=nameBox(),focus=false;
  try{focus=(document.activeElement===nameInput);}catch(e){}
  rrect(b.x,b.y,b.w,b.h,6);
  ctx.fillStyle='rgba(0,0,0,0.35)';ctx.fill();
  ctx.strokeStyle=NAME_C;ctx.lineWidth=focus?2.2:1.4;ctx.stroke();
  var cy=b.y+b.h/2+7;
  if(playerName){
    ctx.fillStyle=ink(1);
    var up=playerName.toUpperCase();
    if(/^[ -~]*$/.test(up)) bt(up,b.x+12,cy,3,'left',1);
    else pixelText(up,b.x+12,b.y+b.h/2-13,2,'left','#ffffff',1.3);
    if(focus&&Math.floor(now/500)%2===0){
      ctx.fillStyle=NAME_C;ctx.fillRect(b.x+12+btWidth(up,3,1)+6,b.y+b.h*0.25,3,b.h*0.5);
    }
  }else{
    ctx.fillStyle=NAME_C;
    bt('NAME?',b.x+12,cy,3,'left',1);
    if(focus&&Math.floor(now/500)%2===0){ctx.fillStyle=NAME_C;ctx.fillRect(b.x+12,b.y+b.h*0.25,3,b.h*0.5);}
  }
  ctx.fillStyle=rgba(NAME_C,0.75);
  bt('TAP THE BOX TO TYPE',b.x+2,b.y+b.h+14,1,'left',1);

  /* ランキング */
  var ty=H*0.665,rowH=H*0.0245;
  ctx.fillStyle=YEL;
  bt('TOP 10',W*0.045,ty,2,'left',3);
  ctx.fillStyle=ink(0.25);ctx.fillRect(W*0.045,ty+7,W*0.91,1);
  if(!ranks.length){
    ctx.fillStyle=ink(0.4);
    bt('NO RECORDS YET',W/2,ty+rowH*2,2,'center',1);
  }
  for(var i=0;i<ranks.length&&i<10;i++){
    var r=ranks[i],yy=ty+rowH*(i+1)+6,hot=(i===lastRank);
    ctx.fillStyle=hot?YEL:ink(0.55);
    bt(two(i+1),W*0.045,yy,2,'left',0);
    ctx.fillStyle=hot?YEL:ink(1);
    var nm=(r.n||'').toUpperCase();
    if(/^[ -~]*$/.test(nm)) bt(nm,W*0.135,yy,2,'left',0);
    else pixelText(nm,W*0.135,yy-14,1,'left',hot?YEL:'#ffffff',1.3);
    bt(String(r.s),W*0.68,yy,2,'right',0);
    ctx.fillStyle=hot?rgba(YEL,0.85):ink(0.5);
    bt(String(r.y).slice(2)+two(r.m)+two(r.d),W*0.955,yy,2,'right',0);
  }

  /* CONTINUE（保存があるときだけ） */
  if(saveInfo){
    var cb2=contBtn(),cp=0.5+0.5*Math.sin(now*0.004);
    rrect(cb2.x,cb2.y,cb2.w,cb2.h,cb2.h*0.42);
    ctx.fillStyle='rgba(60,255,136,'+(0.12+0.10*cp)+')';ctx.fill();
    ctx.strokeStyle='rgba(60,255,136,'+(0.7+0.3*cp)+')';ctx.lineWidth=1.6;ctx.stroke();
    ctx.fillStyle='#3cff88';
    bt('CONTINUE '+two(saveInfo.stage),cb2.x+cb2.w/2,cb2.y+cb2.h/2+7,2,'center',1);
    ctx.fillStyle='rgba(60,255,136,0.7)';
    bt('SCORE '+(saveInfo.total||0)+'  LIFE '+(saveInfo.lives||0),W/2,cb2.y+cb2.h+13,1,'center',1);
  }

  /* HOW TO PLAY */
  var hb=howBtn();
  rrect(hb.x,hb.y,hb.w,hb.h,hb.h*0.42);
  ctx.fillStyle='rgba(80,240,255,0.10)';ctx.fill();
  ctx.strokeStyle='rgba(80,240,255,0.8)';ctx.lineWidth=1.4;ctx.stroke();
  ctx.fillStyle='#50f0ff';
  bt('HOW TO PLAY',hb.x+hb.w/2,hb.y+hb.h/2+6,2,'center',1);

  /* START */
  var sb=startBtn(),pul=0.5+0.5*Math.sin(now*0.005);
  rrect(sb.x,sb.y,sb.w,sb.h,sb.h*0.42);
  ctx.fillStyle=rgba(YEL,0.18+0.14*pul);ctx.fill();
  ctx.strokeStyle=rgba(YEL,0.75+0.25*pul);ctx.lineWidth=1.8;ctx.stroke();
  ctx.fillStyle=YEL;
  bt('START',sb.x+sb.w/2,sb.y+sb.h/2+8,3,'center',2);
}

/* ================= ループ ================= */
function loop(ts){
  now=ts;dt=Math.min(50,ts-prev||16);prev=ts;
  if(state==='idol'){update();drawIdol();requestAnimationFrame(loop);return;}
  if(state==='help'){drawHelp();requestAnimationFrame(loop);return;}
  if(state==='title'){drawTitle();requestAnimationFrame(loop);return;}
  if(state==='opening'){update();drawOpening();requestAnimationFrame(loop);return;}
  update();
  ctx.fillStyle=BG_OUT;ctx.fillRect(0,0,W,H);
  ctx.fillStyle=BG;ctx.fillRect(ox,oy,COLS*cell,ROWS*cell);
  drawBed();drawMaze();drawShift();drawGates();drawAim();drawBreakFx();drawStartSignal();drawGoalFlag();drawJail();drawHoles();drawCoins();drawBomb();drawDots();drawLures();drawBlockers();drawAmoeba();drawGirlWorld();drawPlayer();drawBoom();
  drawPops();drawPad();drawPauseBtn();drawHUD();drawOverlay();
  requestAnimationFrame(loop);
}
ranks=loadRanks();saveInfo=readSave();
makeNameInput();
resize();
placeNameInput();
requestAnimationFrame(loop);
})();
</script>
</body>
