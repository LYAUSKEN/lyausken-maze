function drawPad(){
  /* 十字ボタン：地色は常に黒、矢印は白、押している間は PANTONE 394 C */
  for(var k in dpad){
    var b=dpad[k],on=(held===k);
    rrect(b.x,b.y,b.w,b.h,b.w*0.26);
    ctx.fillStyle=on?PAD_ON:PAD_BG;ctx.fill();
    ctx.strokeStyle=on?PAD_ON:ink(0.34);ctx.lineWidth=1.2;ctx.stroke();
    var cx=b.x+b.w/2,cy=b.y+b.h/2,a=b.w*0.2;
    ctx.beginPath();
    if(k==='n'){ctx.moveTo(cx,cy-a);ctx.lineTo(cx+a,cy+a*0.7);ctx.lineTo(cx-a,cy+a*0.7);}
    if(k==='s'){ctx.moveTo(cx,cy+a);ctx.lineTo(cx+a,cy-a*0.7);ctx.lineTo(cx-a,cy-a*0.7);}
    if(k==='w'){ctx.moveTo(cx-a,cy);ctx.lineTo(cx+a*0.7,cy+a);ctx.lineTo(cx+a*0.7,cy-a);}
    if(k==='e'){ctx.moveTo(cx+a,cy);ctx.lineTo(cx-a*0.7,cy+a);ctx.lineTo(cx-a*0.7,cy-a);}
    ctx.closePath();
    ctx.fillStyle=PAD_ARROW;ctx.fill();
    if(on){ctx.strokeStyle='rgba(0,0,0,0.55)';ctx.lineWidth=1;ctx.stroke();}
  }

  /* ツルハシ／餌：角丸の横長ボタン（縦1：横5） */
  drawPill(pickBtn,'PICKAXE',picks,PICK_C,aiming,(picks>0||canBuy('pick')),'pick');
  drawPill(lureBtn,'82HASHI',lureStock,LURE_C,lurePressed&&lureStock>0,(lureStock>0),'feed');
  drawPill(bombBtn,'M-BOMB',hasBomb?1:0,BOMB_C,!!fuse,(hasBomb||canBuy('bomb')),'bomb');
  drawPill(coinBtn,'COIN',wallet,'#f2b705',coinPressed,(wallet>0),'coin');
}
function drawPill(b,label,count,icon,on,act,kind){
  if(!act)return;                       // まだ使えない道具は表示しない
  var r=b.h*0.5,cx0=b.x+b.w,cy0=b.y+b.h*0.5;
  ctx.globalAlpha=1;
  rrect(b.x,b.y,b.w,b.h,r);
  ctx.fillStyle=on?icon:BTN_BG;ctx.fill();
  ctx.strokeStyle=on?icon:rgba(BTN_TX,0.35);ctx.lineWidth=on?2:1.1;ctx.stroke();
  var fg=on?BTN_BG:BTN_TX, ic=on?BTN_BG:icon;
  ctx.fillStyle=fg;
  bt(label,b.x+b.h*0.42,cy0+7,2,'left',0);
  var ix=b.x+b.w*0.70,iy=cy0,sz=b.h*0.30;
  if(kind==='coin'){
    ctx.save();ctx.translate(ix,iy);ctx.scale(0.55,1);
    ctx.beginPath();ctx.arc(0,0,sz*1.0,0,7);
    ctx.fillStyle=ic;ctx.fill();
    ctx.strokeStyle=on?BTN_BG:'#ffe27a';ctx.lineWidth=1.4;ctx.stroke();
    ctx.beginPath();ctx.arc(0,0,sz*0.55,0,7);
    ctx.strokeStyle=on?BTN_BG:'#fff3c0';ctx.lineWidth=1.1;ctx.stroke();
    ctx.restore();
  }else if(kind==='bomb'){
    ctx.beginPath();ctx.arc(ix,iy+sz*0.15,sz*0.95,0,7);
    ctx.fillStyle=ic;ctx.fill();
    ctx.strokeStyle=ic;ctx.lineWidth=Math.max(1.4,b.h*0.07);ctx.lineCap='round';
    ctx.beginPath();
    ctx.moveTo(ix+sz*0.45,iy-sz*0.55);
    ctx.quadraticCurveTo(ix+sz*1.1,iy-sz*0.9,ix+sz*0.85,iy-sz*1.5);
    ctx.stroke();
  }else if(kind==='pick'){
    ctx.strokeStyle=ic;ctx.lineWidth=Math.max(1.7,b.h*0.09);ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(ix-sz*0.6,iy+sz*1.05);ctx.lineTo(ix+sz*0.7,iy-sz*0.95);ctx.stroke();
    ctx.beginPath();ctx.arc(ix+sz*0.2,iy-sz*0.38,sz*1.15,Math.PI*1.13,Math.PI*1.97);ctx.stroke();
  }else{
    blob(ix,iy,sz*1.05,now*0.6,ic,on?rgba(BTN_BG,0.7):rgba(icon,0.55));
  }
  ctx.fillStyle=fg;
  bt(String(count),cx0-b.h*0.42,cy0+7,2,'right',0);
  ctx.globalAlpha=1;
}
function drawHUD(){

  var lx=W*0.5-((shown-1)*9)/2;
  ctx.fillStyle=ink(0.45);
  bt('LIFE',W*0.5,16,2,'center',1);
  for(var li=0;li<shown;li++){
    ctx.beginPath();ctx.arc(lx+li*9,31,3.4,0,7);
    ctx.fillStyle=(li<lives)?YEL:ink(0.18);ctx.fill();
  }
  var rg=(girl.state==='follow'&&girl.rare)?girl.rare:((girl2.state==='follow'&&girl2.rare)?girl2.rare:null);
  if(rg){
    ctx.fillStyle='#ffd400';
    bt(rareById(rg).ja+' x'+(ownCount(rg)+1),W*0.5+34,56,1,'left',1);
  }
  if(savedGirls<idolNext){
    ctx.fillStyle=rgba(GIRL_DRESS,0.85);
    bt('W '+savedGirls+'/'+idolNext,W*0.5+34,44,1,'left',1);
  }
  var bw=W-pad*2,by=42,r=tBonus/TIME_MAX;
  ctx.fillStyle=ink(0.14);ctx.fillRect(pad,by,bw,2);
  ctx.fillStyle=r>0.3?ink(1):RED;ctx.fillRect(pad,by,bw*r,2);

  var yy=Math.min(padTop-7,oy+ROWS*cell+cell/3+22);
  rrect(PAD,yy-15,W-PAD*2,21,5);
  ctx.fillStyle='rgba(0,0,0,0.62)';ctx.fill();
  var tv=tBonus;
  if(state==='tally'){
    var tp=Math.min(1,(now-tallyT)/TALLY_MS);
    tv=Math.round(tBonus*(1-Math.pow(tp,1.9)));
    var gained=tBonus-tv;
    ctx.fillStyle='#ffd400';
    bt('+'+gained,pad+10,yy-18-Math.pow(tp,1.9)*10,2,'left',0);
  }
  ctx.fillStyle='rgba(255,255,255,0.8)';
  var lt='TIME '+tv;
  /* この面に囚われているワトナーの数 */
  var caged=(girl.state==='caged'?1:0)+(girl2.state==='caged'?1:0);
  if((state==='playing'||state==='ready'||state==='countdown')&&jail2)
    lt+='  CAGE '+caged+'/2';

    lt+='  MIDNIGHT '+Math.max(0,Math.ceil((nightT+NIGHT_FADE+NIGHT_MS-now)/1000));
  else if(state==='playing'&&stage>=SHIFT_FROM&&shiftAt<Infinity)
    lt+='  SHIFT '+Math.max(0,Math.ceil((shiftAt-now)/1000));
  bt(lt,pad,yy,2,'left',0);
  if(state==='playing'){
    if(!amoebaOn&&respawnAt){
      var rs=Math.ceil((respawnAt-now)/1000);
      ctx.fillStyle='#ffb04d';
      bt(rs>0?('NUME DOWN '+rs):'NUME COMING',W-pad,yy,2,'right',0);

      var left=Math.max(0,TRIGGER-(dots.length-1));

    }
  }
}

function helpIcon(kind,x,y,S){

    ctx.fillStyle='rgba(255,212,0,0.8)';ctx.fill();return;
  }

    blob(x,y-S*0.1,S*0.34,now*0.7,'rgba(150,80,255,0.9)','rgba(200,160,255,0.9)');return;

  }

    ctx.strokeStyle='#ffe27a';ctx.lineWidth=1.5;ctx.stroke();ctx.restore();return;
  }
  if(kind==='pick'){

    ctx.beginPath();ctx.moveTo(x+S*0.18,y-S*0.42);ctx.lineTo(x-S*0.05,y+S*0.28);ctx.stroke();
    ctx.beginPath();ctx.moveTo(x-S*0.34,y-S*0.20);

    ctx.beginPath();ctx.arc(x+S*0.28,y-S*0.58,S*0.10,0,7);

  }
  if(kind==='yatsu'){
    blob(x,y-S*0.08,S*0.28,now*1.4,'rgba(255,138,224,0.95)','rgba(255,200,240,0.9)');return;
  }
  if(kind==='hole'){
    ctx.save();ctx.translate(x,y-S*0.05);ctx.scale(1,0.55);
    ctx.beginPath();ctx.arc(0,0,S*0.34,0,7);
    ctx.fillStyle='rgba(0,0,0,0.85)';ctx.fill();
    ctx.strokeStyle=ink(0.6);ctx.lineWidth=2;ctx.stroke();ctx.restore();
    ctx.save();ctx.translate(x+S*0.34,y-S*0.22);ctx.scale(1,0.55);

    ctx.fillStyle=ink(0.32);ctx.fill();
    ctx.strokeStyle=ink(0.6);ctx.lineWidth=1.2;ctx.stroke();ctx.restore();return;
  }
  if(kind==='heart'){drawHeart(x,y-S*0.05,S*0.30,'#ff3b6b',1);return;}

var confetti=[];
function makeConfetti(){
  confetti=[];
  var CC=['#ff3b30','#ffd400','#3f8bff','#34d15a','#ff6fc8','#a878ff','#4fe3ff','#ff8a3c','#ffffff'];
  for(var i=0;i<54;i++){
    confetti.push({u:Math.random(),v:Math.random(),
      s:0.55+Math.random()*0.9,
      w:3+Math.random()*4.5,h:5+Math.random()*5,
      p:Math.random()*Math.PI*2,sp:1.4+Math.random()*2.6,
      c:CC[(Math.random()*CC.length)|0]});
  }
}
function drawConfetti(x,y,w,h){
  if(!confetti.length)return;
  ctx.save();
  ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();
  var t=now*0.001;
  for(var i=0;i<confetti.length;i++){
    var c=confetti[i];
    var py=((c.v+t*c.s*0.24)%1+1)%1;
    var pu=((c.u+Math.sin(t*c.sp+c.p)*0.045)%1+1)%1;
    var X=x+pu*w,Y=y+py*h;
    var sc=Math.abs(Math.cos(t*c.sp*1.25+c.p))*0.85+0.15;
    ctx.fillStyle=c.c;
    ctx.fillRect(X-c.w*sc*0.5,Y-c.h*0.5,Math.max(1,c.w*sc),c.h);
  }
  ctx.restore();
}
function drawClearScene(cx,gy,h,withGirl){
  var hop=Math.abs(Math.sin(now*0.0043))*h*0.26;
  var fx=cx-(withGirl?h*1.30:h*0.85);
  /* ゴールの旗 */
  ctx.strokeStyle='#ffffff';ctx.lineWidth=Math.max(1.4,h*0.05);ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(fx,gy);ctx.lineTo(fx,gy-h*1.15);ctx.stroke();
  var wv=Math.sin(now*0.006)*h*0.05;
  ctx.beginPath();
  ctx.moveTo(fx,gy-h*1.15);
  ctx.quadraticCurveTo(fx+h*0.34,gy-h*1.06+wv,fx+h*0.56,gy-h*0.95);
  ctx.quadraticCurveTo(fx+h*0.30,gy-h*0.86-wv,fx,gy-h*0.78);
  ctx.closePath();
  ctx.fillStyle='#ff2d4d';ctx.fill();
  /* 地面の影 */
  ctx.save();ctx.translate(cx,gy+2);ctx.scale(1,0.22);
  ctx.beginPath();ctx.arc(0,0,h*(withGirl?1.0:0.55),0,7);
  ctx.fillStyle='rgba(0,0,0,0.45)';ctx.fill();ctx.restore();
  /* 足の着地線を旗の根元と同じ高さに揃える */
  var boyY=gy-h*0.46-hop;
  if(withGirl){
    var gh=h*0.94,girlY=gy-gh*0.40-hop;
    var bx=cx-h*0.40,gx=bx+h*0.447+gh*0.36;
    drawBoy(bx,boyY,h,'s',true);
    drawGirl(gx,girlY,gh,1,'s',true);
    /* つないだ手 */
    ctx.strokeStyle=SKIN;ctx.lineWidth=Math.max(1.6,h*0.07);ctx.lineCap='round';
    ctx.beginPath();
    ctx.moveTo(bx+h*0.447,boyY-h*0.44);
    ctx.lineTo(gx-gh*0.36,girlY-gh*0.44);
    ctx.stroke();
  }else{
    drawBoy(cx+h*0.30,boyY,h,'s',true);
  }
}

      ctx.globalAlpha=ok?1:0.35;
      rrect(b.x,b.y,b.w,b.h,b.h*0.42);
      ctx.fillStyle='rgba(59,59,75,0.95)';ctx.fill();
      ctx.strokeStyle=o[3];ctx.lineWidth=1.6;ctx.stroke();
      ctx.fillStyle='#ffffff';
      bt(o[1],b.x+14,b.y+b.h/2+7,2,'left',1);
      ctx.fillStyle=o[3];
      bt(o[2]+' COIN',b.x+b.w-14,b.y+b.h/2+7,2,'right',1);
      ctx.globalAlpha=1;
    });
    var cb=sh.cancel;
    rrect(cb.x,cb.y,cb.w,cb.h,cb.h*0.42);
    ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.4)';ctx.lineWidth=1.3;ctx.stroke();
    ctx.fillStyle='#ffffff';
    bt('CANCEL',cb.x+cb.w/2,cb.y+cb.h/2+7,2,'center',1);
  }
  if(state==='ask'){
    ctx.fillStyle=DARKBG?'rgba(0,0,0,0.55)':'rgba(255,255,255,0.55)';
    ctx.fillRect(0,oy-4,W,ROWS*cell+8);
    var jp=ctr(jail.r,jail.c);
    drawJail();
    bubble(jp.x,jp.y-cell*0.5,'HELP ME!',RED);
    var ab=askBtns();
    ['yes','no'].forEach(function(k){
      var b=ab[k],yes=(k==='yes');
      rrect(b.x,b.y,b.w,b.h,b.h*0.42);
      ctx.fillStyle=yes?rgba(SIG_G,0.9):BTN_BG;ctx.fill();
      ctx.strokeStyle=yes?SIG_G:rgba(BTN_TX,0.4);ctx.lineWidth=1.4;ctx.stroke();
      var lb=yes?'YES':'NO',lc=yes?'#062211':'#ffffff',lh=26;
      try{lh=pixelCanvas(lb,lc,1).height*2;}catch(e){}
      pixelText(lb,b.x+b.w/2,b.y+(b.h-lh)/2,2,'center',lc,1);
    });
  }
  if(state==='clear'){
    var ln=['TRAJECTORY +'+clearDots,'GOAL +'+GOAL_PT,'TIME +'+tBonus];
    if(girlPen)ln.push('WATONER -'+girlPen);
    if(bonusShown)ln.push('WATONER +'+bonusShown);
    if(idolBonus)ln.push('HEART x'+idolBonus+'   1UP');
    ln.push('TOTAL '+total);
    panel(ln,'STAGE CLEAR',true,bonusShown?'girl':'solo');
  }
  if(state==='over'){
    if(canRetry) panel([overMsg,'CHANCE '+lives+'/'+LIVES,'TOTAL '+total,'タップでもう一度'],'RETRY');
    else{
      panel([overMsg,'STAGE '+two(overStage)+'   SCORE '+overScore,'TOTAL '+total,'COIN '+wallet],'GAME OVER');
      var ob=overBtns(),i;
      for(i=0;i<ob.order.length;i++){
        var key=ob.order[i],b=ob[key];
        rrect(b.x,b.y,b.w,b.h,b.h*0.42);
        var col=(key==='restart')?'255,212,0':((key==='up')?'60,255,136':'242,183,5');
        ctx.fillStyle='rgba('+col+',0.16)';ctx.fill();
        ctx.strokeStyle='rgba('+col+',0.9)';ctx.lineWidth=1.6;ctx.stroke();
        ctx.fillStyle='rgb('+col+')';
        bt(key==='up'?('1UP    '+UP_COINS+' COIN'):
           (key==='coin'?('BUY COIN    '+COIN_PT+' PT'):('RESTART    STAGE '+two(halfStage()))),
           b.x+b.w/2,b.y+b.h/2+7,2,'center',1);
      }
    }
  }
}

function drawOpening(){
  ctx.fillStyle=TITLE_BG;ctx.fillRect(0,0,W,H);
  if(!drawTitleArt()){
    var ty0=H*0.20,sc=3.6,th=90,stretch=TITLE_COND*TITLE_SY/TITLE_SX;
    try{
      var tc=pixelCanvas(TITLE_TXT,'#ffffff',stretch);
      sc=Math.max(2,Math.floor((W*0.90)/tc.width))*TITLE_SX;
      th=tc.height*sc;
    }catch(e){}
    pixelText(TITLE_TXT,W/2,ty0,sc,'center','#ffffff',stretch);
    var ref={i:0},ly=ty0+th+14;
    for(var li=0;li<SUB_LINES.length;li++) btRainbow(SUB_LINES[li],W/2,ly+li*26,3,'center',1,ref);
  }
  var p=Math.min(1,(now-openT)/OPEN_MS);
  ctx.fillStyle='rgba(255,255,255,0.20)';ctx.fillRect(W*0.15,H*0.82,W*0.70,4);
  ctx.fillStyle=YEL;ctx.fillRect(W*0.15,H*0.82,W*0.70*p,4);
  ctx.fillStyle=ink(0.85);
  bt('STAGE '+two(stage),W/2,H*0.80,3,'center',2);
  if(Math.floor(now/500)%2===0){
    ctx.fillStyle=ink(0.5);
    bt('TAP TO SKIP',W/2,H*0.875,2,'center',2);
  }
}
function drawTitle(){
  ctx.fillStyle=TITLE_BG;ctx.fillRect(0,0,W,H);
  if(!drawTitleArt()){                       // 画像が未読込の時だけ文字で代用
    var ty0=H*0.075,sc=3.6,th=90,stretch=TITLE_COND*TITLE_SY/TITLE_SX;
    try{
      var tc=pixelCanvas(TITLE_TXT,'#ffffff',stretch);
      sc=Math.max(2,Math.floor((W*0.90)/tc.width))*TITLE_SX;
      th=tc.height*sc;
    }catch(e){}
    pixelText(TITLE_TXT,W/2,ty0,sc,'center','#ffffff',stretch);
    var ref={i:0},ly=ty0+th+14;
    for(var li=0;li<SUB_LINES.length;li++) btRainbow(SUB_LINES[li],W/2,ly+li*26,3,'center',1,ref);
  }

  /* 名前の枠 */
  var b=nameBox(),focus=false;
  try{focus=(document.activeElement===nameInput);}catch(e){}
  rrect(b.x,b.y,b.w,b.h,6);
  ctx.fillStyle='rgba(0,0,0,0.35)';ctx.fill();
  ctx.strokeStyle=NAME_C;ctx.lineWidth=focus?2.2:1.4;ctx.stroke();
  var cy=b.y+b.h/2+7;
  if(playerName){
    ctx.fillStyle=ink(1);
    var up=playerName.toUpperCase();
    if(/^[ -~]*$/.test(up)) bt(up,b.x+12,cy,3,'left',1);
    else pixelText(up,b.x+12,b.y+b.h/2-13,2,'left','#ffffff',1.3);
    if(focus&&Math.floor(now/500)%2===0){
      ctx.fillStyle=NAME_C;ctx.fillRect(b.x+12+btWidth(up,3,1)+6,b.y+b.h*0.25,3,b.h*0.5);
    }
  }else{
    ctx.fillStyle=NAME_C;
    bt('NAME?',b.x+12,cy,3,'left',1);
    if(focus&&Math.floor(now/500)%2===0){ctx.fillStyle=NAME_C;ctx.fillRect(b.x+12,b.y+b.h*0.25,3,b.h*0.5);}
  }
  ctx.fillStyle=rgba(NAME_C,0.75);
  bt('TAP THE BOX TO TYPE',b.x+2,b.y+b.h+14,1,'left',1);

  /* ランキング */
  var ty=H*0.665,rowH=H*0.0245;
  ctx.fillStyle=YEL;
  bt('TOP 10',W*0.045,ty,2,'left',3);
  ctx.fillStyle=ink(0.25);ctx.fillRect(W*0.045,ty+7,W*0.91,1);
  if(!ranks.length){
    ctx.fillStyle=ink(0.4);
    bt('NO RECORDS YET',W/2,ty+rowH*2,2,'center',1);
  }
  for(var i=0;i<ranks.length&&i<10;i++){
    var r=ranks[i],yy=ty+rowH*(i+1)+6,hot=(i===lastRank);
    ctx.fillStyle=hot?YEL:ink(0.55);
    bt(two(i+1),W*0.045,yy,2,'left',0);
    ctx.fillStyle=hot?YEL:ink(1);
    var nm=(r.n||'').toUpperCase();
    if(/^[ -~]*$/.test(nm)) bt(nm,W*0.135,yy,2,'left',0);
    else pixelText(nm,W*0.135,yy-14,1,'left',hot?YEL:'#ffffff',1.3);
    bt(String(r.s),W*0.68,yy,2,'right',0);
    ctx.fillStyle=hot?rgba(YEL,0.85):ink(0.5);
    bt(String(r.y).slice(2)+two(r.m)+two(r.d),W*0.955,yy,2,'right',0);
  }

  /* CONTINUE（保存があるときだけ） */
  if(saveInfo){
    var cb2=contBtn(),cp=0.5+0.5*Math.sin(now*0.004);
    rrect(cb2.x,cb2.y,cb2.w,cb2.h,cb2.h*0.42);
    ctx.fillStyle='rgba(60,255,136,'+(0.12+0.10*cp)+')';ctx.fill();
    ctx.strokeStyle='rgba(60,255,136,'+(0.7+0.3*cp)+')';ctx.lineWidth=1.6;ctx.stroke();
    ctx.fillStyle='#3cff88';
    bt('CONTINUE '+two(saveInfo.stage),cb2.x+cb2.w/2,cb2.y+cb2.h/2+7,2,'center',1);
    ctx.fillStyle='rgba(60,255,136,0.7)';
    bt('SCORE '+(saveInfo.total||0)+'  LIFE '+(saveInfo.lives||0),W/2,cb2.y+cb2.h+13,1,'center',1);
  }

  /* WATONERS（7人集めたら） */
  if(ownedList().length>=1){
    var xb=dexBtn();
    rrect(xb.x,xb.y,xb.w,xb.h,xb.h*0.42);
    ctx.fillStyle='rgba(255,138,192,0.12)';ctx.fill();
    ctx.strokeStyle='rgba(255,138,192,0.85)';ctx.lineWidth=1.4;ctx.stroke();
    ctx.fillStyle=GIRL_DRESS;
    bt((ownedList().length>=7)?'NEW WATONERS':('WATONERS  '+ownedList().length+'/'+RARE.length),
       xb.x+xb.w/2,xb.y+xb.h/2+6,2,'center',1);
  }
  /* 曲ファイルが見つかっているか（確認用・白地を避けて下に出す） */
  (function(){
    var n=0;for(var k in songExt)n++;
    ctx.fillStyle=n?'rgba(60,255,136,0.9)':'rgba(255,255,255,0.55)';
    bt('SONG FILES '+n,PAD,H*0.618,1,'left',2);
  })();
  /* HOW TO PLAY */
  var hb=howBtn();
  rrect(hb.x,hb.y,hb.w,hb.h,hb.h*0.42);
  ctx.fillStyle='rgba(80,240,255,0.10)';ctx.fill();
  ctx.strokeStyle='rgba(80,240,255,0.8)';ctx.lineWidth=1.4;ctx.stroke();
  ctx.fillStyle='#50f0ff';
  bt('HOW TO PLAY',hb.x+hb.w/2,hb.y+hb.h/2+6,2,'center',1);
  var db=demoBtn();                             /* 確認用：ソロの舞台だけ見る */
  rrect(db.x,db.y,db.w,db.h,db.h*0.42);
  ctx.fillStyle='rgba(255,138,192,0.12)';ctx.fill();
  ctx.strokeStyle='rgba(255,138,192,0.85)';ctx.lineWidth=1.4;ctx.stroke();
  ctx.fillStyle=GIRL_DRESS;
  bt('SOLO',db.x+db.w/2,db.y+db.h/2+6,2,'center',1);
  ctx.fillStyle='rgba(255,138,192,0.75)';       /* 次に出る子 */
  ctx.font='400 10px "Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif';
  ctx.textAlign='center';ctx.textBaseline='alphabetic';
  ctx.fillText(rareById(demoNext()).ja,db.x+db.w/2,db.y+db.h+12);

  /* START */
  var sb=startBtn(),pul=0.5+0.5*Math.sin(now*0.005);
  rrect(sb.x,sb.y,sb.w,sb.h,sb.h*0.42);
  ctx.fillStyle=rgba(YEL,0.18+0.14*pul);ctx.fill();
  ctx.strokeStyle=rgba(YEL,0.75+0.25*pul);ctx.lineWidth=1.8;ctx.stroke();
  ctx.fillStyle=YEL;
  bt('START',sb.x+sb.w/2,sb.y+sb.h/2+8,3,'center',2);
}

/* ================= ループ ================= */
function loop(ts){
  now=ts;dt=Math.min(50,ts-prev||16);prev=ts;
  if(state==='getrare'){update();drawGetRare();requestAnimationFrame(loop);return;}
  if(state==='idol'){update();drawIdol();requestAnimationFrame(loop);return;}
  if(state==='dex'){drawDex();requestAnimationFrame(loop);return;}
  if(state==='help'){drawHelp();requestAnimationFrame(loop);return;}
  if(state==='title'){drawTitle();requestAnimationFrame(loop);return;}
  if(state==='opening'){update();drawOpening();requestAnimationFrame(loop);return;}
  update();
  ctx.fillStyle=BG_OUT;ctx.fillRect(0,0,W,H);
  if(nightK>0){                                  // 真夜中は画面全部が真っ黒
    ctx.fillStyle='rgba(0,0,0,'+nightK+')';
    ctx.fillRect(0,0,W,H);
    ctx.fillStyle=(nightK>=1)?'#000000':nightMix(BG,nightK);
    ctx.fillRect(ox,oy,COLS*cell,ROWS*cell);
  }else{
    ctx.fillStyle=BG;ctx.fillRect(ox,oy,COLS*cell,ROWS*cell);
  }
  drawBed();
  if(nightK<=0)drawMaze();
  drawShift();drawGates();drawAim();drawBreakFx();drawStartSignal();drawGoalFlag();drawJail();drawHoles();drawCoins();drawBomb();drawDots();drawLures();drawBlockers();drawAmoeba();drawGirlWorld();drawPlayer();drawBoom();
  if(nightK>0){
    /* キャラクターや道具はそのままの明るさ。白い壁を上に描く */
    drawMaze();
    drawBorder();
    drawNightFlash();
  }
  if(state==='fieldlive'){drawFieldLive();drawCharmNotes();}
  else if(canFieldLive()){
    var fb=fieldBtn(),fp=0.5+0.5*Math.sin(now*0.005);
    rrect(fb.x,fb.y,fb.w,fb.h,fb.h*0.42);
    ctx.fillStyle='rgba(255,138,192,'+(0.14+0.10*fp)+')';ctx.fill();
    ctx.strokeStyle='rgba(255,138,192,'+(0.7+0.3*fp)+')';ctx.lineWidth=1.8;ctx.stroke();
    ctx.fillStyle='#ff8ac0';
    bt('MIDNIGHT LIVE',fb.x+fb.w/2,fb.y+fb.h/2+7,2,'center',2);
  }
  drawPops();drawPad();drawPauseBtn();drawHUD();drawOverlay();
  requestAnimationFrame(loop);
}
ranks=loadRanks();loadDex();saveInfo=readSave();
try{songProbeAll();}catch(e){}             // 曲ファイルを先に調べる（音は鳴らさない）
makeNameInput();
resize();
placeNameInput();
requestAnimationFrame(loop);
})();
</script>
